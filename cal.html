<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Our days · Our note</title>
<meta name="theme-color" content="#b5476a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="약속 노트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Great+Vibes&display=swap">
<style>
  :root {
    --bg: #f7f3f4;
    --paper: #fff;
    --paper-60: rgba(255, 255, 255, .6);
    --ink: #2b2230;
    --muted: #7d6f7a;
    --line: #e8dfe3;
    --rose: #b5476a;
    --rose-soft: #f6e3ea;
    --plum: #4a2f45;
    --ok: #5fae80;
    --part: #e6bd3a;
    --no: #d9474f;
    --shadow: 0 1px 2px rgba(43, 34, 48, .06), 0 4px 14px rgba(43, 34, 48, .05);
    --serif: "Gowun Batang", "Apple SD Gothic Neo", serif;
    --script: "Great Vibes", "Snell Roundhand", "Apple Chancery", cursive;
    --sans: "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c171d;
      --paper: #262028;
      --paper-60: rgba(38, 32, 40, .6);
      --ink: #f1e9ef;
      --muted: #a8999f;
      --line: #3a3039;
      --rose: #e3829f;
      --rose-soft: #3d2531;
      --plum: #e9cfe0;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
    animation: enter .2s ease both;
  }
  body.locked { overflow: hidden; }
  @keyframes enter { from { opacity: 0; } to { opacity: 1; } }
  button, input { font: inherit; color: inherit; }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 max(16px, env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    transition: opacity .12s ease, transform .12s ease;
  }
  body.switching .wrap { opacity: 0; transform: scale(.98); }
  header.top { position: relative; padding: calc(28px + env(safe-area-inset-top)) 2px 10px; }
  header.top h1 { margin: 0; padding-right: 116px; font-family: var(--script); font-weight: 400; font-size: 46px; line-height: 1.1; color: var(--plum); white-space: nowrap; }
  .pillbtn {
    position: absolute; top: calc(28px + env(safe-area-inset-top)); right: 0; height: 34px; padding: 0 13px;
    border-radius: 999px; border: 1px solid var(--line); background: var(--paper); color: var(--plum);
    font-family: var(--serif); font-weight: 700; font-size: 14px; display: grid; place-items: center; box-shadow: var(--shadow); text-decoration: none;
  }
  .sec { margin: 14px 2px 8px; font-size: 12px; letter-spacing: .06em; color: var(--muted); }

  /* 요약 카드 */
  .card { background: var(--paper-60); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); }
  .next { display: flex; align-items: center; gap: 10px; }
  .next .h { font-family: var(--serif); font-weight: 700; font-size: 17px; color: var(--plum); }
  .next .dd { margin-left: auto; color: var(--rose); font-weight: 600; font-size: 14px; white-space: nowrap; }
  .card a { color: var(--rose); font-size: 13px; text-decoration: none; white-space: nowrap; }
  .card .lab { font-size: 12.5px; color: var(--muted); margin: 10px 0 6px; }
  .card .lab:first-child { margin-top: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--rose-soft); background: var(--rose-soft); color: var(--rose); border-radius: 999px; padding: 4px 11px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .chip small { font-weight: 400; opacity: .85; margin-left: 3px; }
  .muted { color: var(--muted); font-size: 13px; word-break: keep-all; }

  /* 달력 */
  .monthbar { display: flex; align-items: center; justify-content: space-between; margin: 18px 2px 8px; }
  .monthbar b { font-family: var(--serif); font-size: 18px; color: var(--plum); }
  .monthbar button { width: 36px; height: 32px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); font-size: 18px; color: var(--plum); cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; touch-action: none; user-select: none; -webkit-user-select: none; }
  .wk { text-align: center; font-size: 11.5px; color: var(--muted); padding-bottom: 2px; }
  .wk.sun { color: var(--rose); }
  .cell {
    position: relative; height: 58px; border-radius: 12px; border: 1px solid transparent; background: var(--paper-60);
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 5px 3px 3px; cursor: pointer;
    transition: background .15s ease, transform .1s ease;
  }
  /* 아래 반쪽: 왼쪽 나, 오른쪽 상대 */
  .halves { display: flex; gap: 2px; width: 100%; height: 24px; }
  .half { flex: 1; min-width: 0; position: relative; border-radius: 6px; display: grid; place-items: center; font-size: 12.5px; font-weight: 700; line-height: 1; }
  .half .dot { width: 9px; height: 9px; border: 0; }
  .half.tagged .dot { position: absolute; top: 2px; right: 2px; width: 7px; height: 7px; box-shadow: 0 0 0 1.5px var(--paper); }
  .c-red { background: #f6cfd2; color: #b3313b; }
  .c-yellow { background: #f7e6a6; color: #806300; }
  .c-blue { background: #c8d9f5; color: #2c57a3; }
  .c-sky { background: #e4edfb; color: #6a8cc6; }
  .c-green { background: #cdeedc; color: #2d7a50; }
  .c-purple { background: #e4d7f5; color: #6b46a3; }
  .c-gray { background: #e6e2e5; color: #6d6570; }
  @media (prefers-color-scheme: dark) {
    .c-red { background: #5a2a30; color: #f3a9b0; }
    .c-yellow { background: #57491c; color: #f2d77a; }
    .c-blue { background: #263f66; color: #a9c6f5; }
    .c-sky { background: #2a3445; color: #a5bbdf; }
    .c-green { background: #234634; color: #9fdcbb; }
    .c-purple { background: #3d2f55; color: #cdb6ef; }
    .c-gray { background: #3a3439; color: #c9c0c6; }
  }
  .cell.out { visibility: hidden; }
  .cell .n { font-size: 14px; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .cell.sun .n { color: var(--rose); }
  .cell.today { border-color: var(--plum); }
  .cell.past { opacity: .4; }
  .cell.both { background: var(--rose-soft); }
  .cell.both::after { content: "💞"; position: absolute; top: 2px; right: 3px; font-size: 9px; }
  .cell.conf .n { background: var(--rose); color: #fff; border-radius: 999px; padding: 0 6px; }
  .cell.hit { transform: scale(.94); }
  /* 쭉 당겨서 고르는 중인 범위 (색은 임시) */
  .cell.sel { background: #ece2f3; border-color: #c9b3dc; }
  @media (prefers-color-scheme: dark) { .cell.sel { background: #3a2d47; border-color: #6c5683; } }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); }
  .dot.ok { background: var(--ok); border-color: var(--ok); }
  .dot.part { background: var(--part); border-color: var(--part); }
  .dot.no { background: var(--no); border-color: var(--no); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 10px 2px 0; font-size: 12px; color: var(--muted); align-items: center; }
  .legend .dot { display: inline-block; vertical-align: -1px; margin-right: 3px; }
  .tagmini { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 4px; font-size: 10.5px; font-weight: 700; margin-right: 3px; vertical-align: -3px; }
  .autonote { font-size: 13px; color: var(--ink); background: var(--bg); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; line-height: 1.5; }
  .autonote small { color: var(--muted); }
  .rulesbtn { opacity: .7; display: flex; align-items: center; gap: 6px; width: 100%; margin-top: 12px; border: 1px solid var(--line); background: var(--paper-60); border-radius: 14px; padding: 11px 14px; font-size: 14.5px; color: var(--plum); font-weight: 600; cursor: pointer; text-align: left; }
  .rulesbtn #rulesN { color: var(--muted); font-weight: 400; font-size: 13px; }
  .rulesbtn .arr { margin-left: auto; color: var(--muted); font-size: 18px; }
  .rlist { display: flex; flex-direction: column; gap: 6px; }
  .ritem { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; text-align: left; cursor: pointer; width: 100%; }
  .ritem .t { font-weight: 600; font-size: 14.5px; }
  .ritem .s { font-size: 12.5px; color: var(--muted); }
  .seg4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
  .seg4 button { border: 0; background: transparent; border-radius: 9px; padding: 7px 0; font-size: 13.5px; color: var(--muted); cursor: pointer; }
  .seg4 button[aria-pressed="true"] { background: var(--paper); color: var(--plum); font-weight: 600; box-shadow: var(--shadow); }
  .wdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .mdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .tog { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 7px 0; font-size: 13.5px; cursor: pointer; }
  .tog[aria-pressed="true"] { border-color: var(--rose); background: var(--rose-soft); color: var(--rose); font-weight: 600; }
  .colors { display: flex; flex-wrap: wrap; gap: 6px; }
  .col { border: 1.5px solid transparent; border-radius: 999px; padding: 5px 11px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .col.none { background: var(--bg); color: var(--muted); border-color: var(--line); font-weight: 400; }
  .col[aria-pressed="true"] { border-color: var(--plum); }
  .ritem .prev { display: flex; gap: 2px; min-width: 20px; }
  .seq { display: flex; flex-wrap: wrap; gap: 4px; min-height: 34px; align-items: center; border: 1px dashed var(--line); border-radius: 12px; padding: 6px; }
  .seq .sq { border-radius: 8px; background: var(--bg); border: 1px solid var(--line); padding: 3px 8px; font-size: 13px; }
  .seq .ph { color: var(--muted); font-size: 12.5px; padding: 0 4px; }
  .typerow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .maprow { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 13px; }
  .maprow b { min-width: 40px; }
  .maprow select, .dateinp { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 6px 8px; }
  .period { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13.5px; }
  .howto { margin: 6px 2px 0; font-size: 12px; color: var(--muted); word-break: keep-all; }

  /* 시트 */
  .ov { position: fixed; inset: 0; z-index: 20; background: rgba(28, 20, 26, .32); display: flex; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity .25s ease; }
  .ov.show { opacity: 1; }
  .bs {
    width: 100%; max-width: 560px; max-height: calc(100% - 20px - env(safe-area-inset-top)); overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: var(--paper); border-radius: 18px 18px 0 0; padding: 10px 20px calc(20px + env(safe-area-inset-bottom));
    transform: translateY(30px); transition: transform .3s cubic-bezier(.22,.8,.3,1);
  }
  .ov.show .bs { transform: none; }
  .grip { width: 38px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 14px; }
  .bs h2 { margin: 0 0 12px; font-family: var(--serif); font-size: 19px; color: var(--plum); }
  .who { font-size: 12.5px; color: var(--muted); margin: 12px 0 6px; }
  .states { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .st { border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 9px 0; font-size: 13.5px; cursor: pointer; }
  .st[aria-pressed="true"] { border-color: var(--plum); background: var(--paper); font-weight: 600; box-shadow: var(--shadow); }
  .parts { display: flex; gap: 6px; margin-top: 8px; }
  .pt { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; color: var(--muted); }
  .pt[aria-pressed="true"] { border-color: var(--part); color: var(--ink); background: var(--bg); font-weight: 600; }
  .memo { width: 100%; margin-top: 8px; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 9px 12px; font-size: 16px; outline: none; }
  .memo:focus { border-color: var(--rose); }
  .theirs { border: 1px dashed var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .confirmbox { margin-top: 14px; border-radius: 14px; background: var(--rose-soft); padding: 12px; display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
  .confirmbox .msg { color: var(--rose); font-weight: 600; text-align: center; }
  .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; align-items: center; }
  .acts .sp { flex: 1; }
  .btn { border: 1px solid var(--line); background: var(--paper); border-radius: 12px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
  .btn.pri { background: var(--rose); border-color: var(--rose); color: var(--paper); font-weight: 600; }
  .btn.ghost { background: transparent; color: var(--muted); padding: 8px 12px; font-size: 13.5px; }
  .btn.wide { width: 100%; }
  .toast {
    position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom)); transform: translate(-50%, 10px);
    background: var(--plum); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 13.5px; opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s; z-index: 40; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Our days</h1>
    <a class="pillbtn" id="backBtn" href="/v2.html" aria-label="Our note로 돌아가기">← 노트</a>
  </header>

  <div class="card" id="summary"></div>

  <div class="monthbar">
    <button type="button" id="prevM" aria-label="이전 달">‹</button>
    <b id="monthT"></b>
    <button type="button" id="nextM" aria-label="다음 달">›</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="legend">
    <span><span class="dot ok"></span>돼요</span>
    <span><span class="dot part"></span>일부만</span>
    <span><span class="dot no"></span>안 돼요</span>
    <span><span class="tagmini c-red">수</span>고정 일정</span>
    <span>💞 둘 다 돼요</span>
  </div>
  <button type="button" class="rulesbtn" id="rulesBtn">🔁 고정 일정 <span id="rulesN"></span><span class="arr">›</span></button>
  <p class="howto">날짜를 누를 때마다 돼요 → 일부만 → 안 돼요 → 지움 · 꾹 누르면 자세히(메모·낮/저녁·이날 보자) · 찍고 쭉 당기면 그 사이 날짜 전부 한꺼번에</p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });

  var AV_KEY = 'ournote:avail';   // 각자 되는 날: [{ id, date, st: ok|part|no, part: day|eve|'', note, who }]
  var DT_KEY = 'ournote:dates';   // 이날 보자(확정): [{ id, date, who }]
  var WEEK = ['일', '월', '화', '수', '목', '금', '토'];
  var NEXT = { '': 'ok', ok: 'part', part: 'no', no: '' };
  var ST_TEXT = { ok: '돼요', part: '일부만', no: '안 돼요' };
  var PART_TEXT = { day: '낮만', eve: '저녁만', '': '' };

  function readJSON(key, fb) {
    try { var v = JSON.parse(localStorage.getItem(key)); return v === null || v === undefined ? fb : v; } catch (e) { return fb; }
  }
  function writeJSON(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function uid() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function today() { return ymd(new Date()); }
  function mdw(s) { var d = parse(s); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + WEEK[d.getDay()] + ')'; }
  function mdShort(s) { var d = parse(s); return (d.getMonth() + 1) + '/' + d.getDate() + '(' + WEEK[d.getDay()] + ')'; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  // ---------- 데이터 ----------
  function syncState() { return readJSON('ournote:sync', null) || {}; }
  function connected() { return !!syncState().cid; }
  // 같이 쓰기 전에 적은 건 who가 비어 있음 → 내 것
  function isMine(x) { var u = syncState().uid; return !x.who || (!!u && x.who === u); }
  function avList() { var v = readJSON(AV_KEY, []); return Array.isArray(v) ? v.filter(function (x) { return x && x.id && x.date; }) : []; }
  function dtList() { var v = readJSON(DT_KEY, []); return Array.isArray(v) ? v.filter(function (x) { return x && x.id && x.date; }) : []; }
  function mineOn(d, list) { var r = null; (list || avList()).forEach(function (x) { if (x.date === d && isMine(x)) r = x; }); return r; }
  function theirsOn(d, list) { var r = null; (list || avList()).forEach(function (x) { if (x.date === d && !isMine(x)) r = x; }); return r; }
  function setMine(d, st, part, note) {
    var list = avList();
    var cur = mineOn(d, list);
    // 같은 날 내 것이 여러 개 생겼으면(폰 두 대 등) 하나만 남김
    list = list.filter(function (x) { return !(x.date === d && isMine(x) && x !== cur); });
    if (!st) list = list.filter(function (x) { return x !== cur; });
    else if (cur) { cur.st = st; cur.part = st === 'part' ? (part || '') : ''; cur.note = note || ''; }
    else list.push({ id: uid(), date: d, st: st, part: st === 'part' ? (part || '') : '', note: note || '' });
    writeJSON(AV_KEY, list);
  }
  function confirmedOn(d) { return dtList().filter(function (x) { return x.date === d; })[0] || null; }
  function setConfirmed(d, on) {
    var list = dtList().filter(function (x) { return x.date !== d; });
    if (on) list.push({ id: uid(), date: d });
    writeJSON(DT_KEY, list);
  }
  // ---------- 고정 일정(반복) ----------
  // { id, who, kind: weekly|biweekly|monthly|shift, days:[0-6], mdays:[1-31], ch: ok|day|eve|no, note,
  //   from, until, seq:['주간',…], map:{ 주간: 'eve', … } }  — 직접 표시한 날이 항상 우선
  var RU_KEY = 'ournote:rules';
  var CHOICE = { ok: { st: 'ok', part: '' }, day: { st: 'part', part: 'day' }, eve: { st: 'part', part: 'eve' }, no: { st: 'no', part: '' } };
  var CHOICE_TEXT = { ok: '🟢 돼요', day: '🟡 낮만', eve: '🟡 저녁만', no: '🔴 안 돼요' };
  var SHIFT_TYPES = [['주간', 'eve'], ['야간', 'no'], ['비번', 'eve'], ['휴무', 'ok']];
  // 달력 칸에 보이는 고정 일정 글자 색. 휴무는 표시 안 함
  var SHIFT_COLOR = { '주간': 'yellow', '야간': 'blue', '비번': 'sky', '휴무': '' };
  var COLORS = [['red', '빨강'], ['yellow', '노랑'], ['blue', '파랑'], ['green', '초록'], ['purple', '보라'], ['gray', '회색'], ['', '표시 안 함']];
  function ruleColor(r) {
    if (r.color !== undefined) return r.color;
    if (/수업/.test(r.note || '') || r.ch === 'no') return 'red';
    if (r.ch === 'day' || r.ch === 'eve') return 'yellow';
    return '';
  }
  function ruList() { var v = readJSON(RU_KEY, []); return Array.isArray(v) ? v.filter(function (x) { return x && x.id && x.kind; }) : []; }
  function dayDiff(a, b) { return Math.round((parse(b) - parse(a)) / 86400000); }
  function weekStart(s) { var d = parse(s); d.setDate(d.getDate() - d.getDay()); return ymd(d); }
  function ruleHit(r, d) {
    var from = r.from || '0000-00-00';
    if (d < from || (r.until && d > r.until)) return null;
    var dt = parse(d), ch = r.ch, note = r.note || '';
    if (r.kind === 'weekly') { if ((r.days || []).indexOf(dt.getDay()) < 0) return null; }
    else if (r.kind === 'biweekly') {
      if ((r.days || []).indexOf(dt.getDay()) < 0) return null;
      if (Math.round(dayDiff(weekStart(from), weekStart(d)) / 7) % 2 !== 0) return null; // 시작 날짜가 있는 주부터 2주마다
    } else if (r.kind === 'monthly') { if ((r.mdays || []).indexOf(dt.getDate()) < 0) return null; }
    else if (r.kind === 'shift') {
      var seq = r.seq || [];
      if (!seq.length) return null;
      var name = seq[((dayDiff(from, d) % seq.length) + seq.length) % seq.length];
      ch = (r.map || {})[name] || 'no';
      note = name;
    } else return null;
    var c = CHOICE[ch] || CHOICE.no;
    var color = r.kind === 'shift' ? (SHIFT_COLOR[note] !== undefined ? SHIFT_COLOR[note] : 'gray') : ruleColor(r);
    var tag = color ? { t: (note || '').charAt(0), c: color } : null;
    return { st: c.st, part: c.part, note: note, auto: true, rule: r, tag: tag };
  }
  function ruleLabel(r) {
    var dn = (r.days || []).slice().sort().map(function (i) { return WEEK[i]; }).join('·');
    if (r.kind === 'weekly') return '매주 ' + dn;
    if (r.kind === 'biweekly') return '격주 ' + dn;
    if (r.kind === 'monthly') return '매달 ' + (r.mdays || []).slice().sort(function (a, b) { return a - b; }).join('·') + '일';
    if (r.kind === 'shift') return '교대 ' + (r.seq || []).length + '일 순환';
    return '';
  }
  // 그날 실제 상태: 직접 표시 > 고정 일정
  // 고정 일정이 여러 개 겹치면 더 빡빡한 쪽(안 돼요 > 일부만 > 돼요)
  function ruleOn(d, mine, rules) {
    var rank = { no: 3, part: 2, ok: 1 }, best = null;
    (rules || ruList()).forEach(function (r) {
      if (isMine(r) !== mine) return;
      var m = ruleHit(r, d);
      if (m && (!best || rank[m.st] >= rank[best.st])) best = m;
    });
    return best;
  }
  function effOn(d, mine, av, rules) {
    var ex = mine ? mineOn(d, av) : theirsOn(d, av);
    return ex || ruleOn(d, mine, rules);
  }

  function free(x) { return !!x && (x.st === 'ok' || x.st === 'part'); }
  // 둘 다 되는지 + 언제(종일/낮/저녁)
  function bothLabel(a, b) {
    if (!free(a) || !free(b)) return null;
    var pa = a.st === 'ok' ? 'all' : (a.part || 'some'), pb = b.st === 'ok' ? 'all' : (b.part || 'some');
    if (pa === 'all' && pb === 'all') return '종일';
    if (pa === 'all') return pb === 'day' ? '낮' : pb === 'eve' ? '저녁' : '일부';
    if (pb === 'all') return pa === 'day' ? '낮' : pa === 'eve' ? '저녁' : '일부';
    if (pa === pb) return pa === 'day' ? '낮' : pa === 'eve' ? '저녁' : '일부';
    if (pa === 'some' || pb === 'some') return '일부';
    return null; // 한 명은 낮만, 한 명은 저녁만 → 안 겹침
  }

  // ---------- 요약 ----------
  function renderSummary() {
    var t = today(), list = avList();
    var conf = dtList().map(function (x) { return x.date; }).filter(function (d) { return d >= t; }).sort()[0];
    var html = '';
    if (conf) {
      var dd = Math.round((parse(conf) - parse(t)) / 86400000);
      html += '<div class="lab">💞 다음 데이트</div><div class="next"><span class="h">' + esc(mdw(conf)) + '</span>' +
        '<span class="dd">' + (dd === 0 ? '오늘!' : 'D-' + dd) + '</span></div>' +
        '<div style="margin-top:4px"><a href="/course.html?date=' + conf + '" data-go="course">코스 보러 가기 →</a></div>';
    }
    var rules = ruList();
    if (!connected() && !list.some(function (x) { return !isMine(x); }) && !rules.some(function (x) { return !isMine(x); })) {
      html += '<div class="lab">둘 다 되는 날</div><div class="muted">💞 같이 쓰기를 연결하면 상대가 표시한 날도 보이고, 둘 다 되는 날을 찾아줘요. 지금은 내 일정만 적을 수 있어요.</div>';
    } else {
      var hits = [], dd0 = parse(t);
      for (var k = 0; k < 120 && hits.length < 6; k++) {
        var d = ymd(new Date(dd0.getFullYear(), dd0.getMonth(), dd0.getDate() + k));
        var l = bothLabel(effOn(d, true, list, rules), effOn(d, false, list, rules));
        if (l && d !== conf) hits.push({ d: d, l: l });
      }
      html += '<div class="lab">둘 다 되는 날</div>' + (hits.length
        ? '<div class="chips">' + hits.map(function (h) { return '<button type="button" class="chip" data-day="' + h.d + '">' + esc(mdShort(h.d)) + '<small>' + h.l + '</small></button>'; }).join('') + '</div>'
        : '<div class="muted">아직 없어요. 각자 되는 날을 눌러서 표시해 보세요.</div>');
    }
    document.getElementById('summary').innerHTML = html;
  }

  // ---------- 달력 ----------
  var shown = new Date(); shown = new Date(shown.getFullYear(), shown.getMonth(), 1);
  function renderGrid() {
    document.getElementById('monthT').textContent = shown.getFullYear() + '년 ' + (shown.getMonth() + 1) + '월';
    var t = today(), list = avList(), rules = ruList(), conf = {};
    dtList().forEach(function (x) { conf[x.date] = true; });
    var h = WEEK.map(function (w, i) { return '<div class="wk' + (i === 0 ? ' sun' : '') + '">' + w + '</div>'; }).join('');
    var first = shown.getDay(), dim = new Date(shown.getFullYear(), shown.getMonth() + 1, 0).getDate();
    for (var i = 0; i < first; i++) h += '<div class="cell out"></div>';
    for (var dn = 1; dn <= dim; dn++) {
      var dt = new Date(shown.getFullYear(), shown.getMonth(), dn), d = ymd(dt);
      var me = effOn(d, true, list, rules), th = effOn(d, false, list, rules);
      var cls = ['cell'];
      if (dt.getDay() === 0) cls.push('sun');
      if (d === t) cls.push('today');
      if (d < t) cls.push('past');
      if (bothLabel(me, th)) cls.push('both');
      if (conf[d]) cls.push('conf');
      h += '<div class="' + cls.join(' ') + '" data-d="' + d + '"><span class="n">' + dn + '</span>' +
        '<span class="halves">' + halfHtml('me', ruleOn(d, true, rules), mineOn(d, list)) + halfHtml('them', ruleOn(d, false, rules), theirsOn(d, list)) + '</span></div>';
    }
    document.getElementById('grid').innerHTML = h;
  }
  // 아래 반쪽 칸: 고정 일정은 글자 1개 + 바탕색, 직접 표시는 작은 점
  function halfHtml(who, rule, ex) {
    var tag = rule && rule.tag;
    return '<span class="half ' + who + (tag ? ' tagged c-' + tag.c : '') + '">' + (tag ? esc(tag.t) : '') +
      (ex ? '<i class="dot ' + ex.st + '"></i>' : '') + '</span>';
  }
  function renderAll() { renderSummary(); renderGrid(); renderRulesBtn(); }
  document.getElementById('prevM').addEventListener('click', function () { shown = new Date(shown.getFullYear(), shown.getMonth() - 1, 1); renderGrid(); });
  document.getElementById('nextM').addEventListener('click', function () { shown = new Date(shown.getFullYear(), shown.getMonth() + 1, 1); renderGrid(); });

  // 누르기(상태 돌리기) · 꾹 누르기(자세히) · 쭉 긋기(한꺼번에)
  var grid = document.getElementById('grid');
  var press = null;
  function cellAt(x, y) { var el = document.elementFromPoint(x, y); el = el && el.closest ? el.closest('.cell[data-d]') : null; return el && !el.classList.contains('past') ? el : null; }
  grid.addEventListener('pointerdown', function (e) {
    var c = e.target.closest('.cell[data-d]');
    if (!c || c.classList.contains('past')) return;
    press = { d: c.getAttribute('data-d'), x: e.clientX, y: e.clientY, painting: false, paint: '', done: {}, long: false };

    try { grid.setPointerCapture(e.pointerId); } catch (err) { /* 없어도 됨 */ }

    var c = cellAt(e.clientX, e.clientY);

      press.painting = true;
      press.paint = NEXT[m ? m.st : '']; // 첫 칸을 누른 것처럼 다음 상태(지움 포함)로 범위 전체를 칠함
    }

  });
  // 처음 찍은 날 ~ 지금 손가락이 있는 날까지 사이의 모든 날(지난 날 빼고)
  function rangeDays(a, b) {
    var lo = a < b ? a : b, hi = a < b ? b : a, out = [];
    grid.querySelectorAll('.cell[data-d]:not(.past)').forEach(function (c) {

  }
  function markRange() {
    var on = {};

  }
  function pressEnd() {
    if (!press) return;

    if (p.painting) {

      days.forEach(function (d) { var m = mineOn(d); setMine(d, p.paint, m && m.part, m && m.note); });
      renderAll();
      days.sort();
      toast((days.length > 1 ? mdShort(days[0]) + '~' + mdShort(days[days.length - 1]) + ' ' : '') + days.length + '일을 ' + (p.paint ? '‘' + ST_TEXT[p.paint] + '’' + (p.paint === 'part' ? '으로' : '로') + ' 표시했어요' : '지웠어요'));
      return;

    var m = mineOn(p.d);

  }
  grid.addEventListener('pointerup', pressEnd);
  grid.addEventListener('pointercancel', pressEnd);
  grid.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  document.getElementById('summary').addEventListener('click', function (e) {
    var c = e.target.closest('[data-day]');
    if (c) openDay(c.getAttribute('data-day'));
  });

  // ---------- 하루 자세히 ----------
  function openDay(d) {
    var me = mineOn(d), th = effOn(d, false), meAuto = me ? null : effOn(d, true);
    var st = me ? me.st : '', part = me ? (me.part || '') : '', note = me ? (me.note || '') : '';
    var past = d < today();
    function desc(x) { return (ST_TEXT[x.st] || '') + (x.st === 'part' && x.part ? ' · ' + PART_TEXT[x.part] : '') + (x.note ? ' · ‘' + x.note + '’' : ''); }
    var thText = th ? desc(th) + (th.auto ? ' (🔁 ' + ruleLabel(th.rule) + ')' : '')
      : (connected() ? '아직 표시 안 했어요' : '같이 쓰기를 연결하면 보여요');
    var html = '<h2>' + esc(mdw(d)) + '</h2>' +
      '<div class="who">나</div>' +
      (meAuto ? '<div class="autonote">🔁 고정 일정(' + esc(ruleLabel(meAuto.rule)) + '): ' + esc(desc(meAuto)) + '<br><small>아래에서 고르면 이날만 바꿔요</small></div>' : '') +
      '<div class="states">' + ['ok', 'part', 'no', ''].map(function (k) {
        return '<button type="button" class="st" data-st="' + k + '" aria-pressed="' + (st === k) + '">' +
          (k === 'ok' ? '🟢 돼요' : k === 'part' ? '🟡 일부만' : k === 'no' ? '🔴 안 돼요' : '지우기') + '</button>';
      }).join('') + '</div>' +
      '<div class="parts" data-parts' + (st === 'part' ? '' : ' hidden') + '>' + ['day', 'eve', ''].map(function (k) {
        return '<button type="button" class="pt" data-part="' + k + '" aria-pressed="' + (part === k) + '">' + (k ? PART_TEXT[k] : '정확히 몰라요') + '</button>';
      }).join('') + '</div>' +
      '<input class="memo" data-memo maxlength="40" placeholder="메모 (예: 야근, 친구 결혼식) · 안 써도 돼요" value="' + esc(note) + '">' +

      function paintConfirm() {
        var box = bs.querySelector('[data-confirm]');

            '<a class="btn pri wide" style="text-align:center;text-decoration:none" href="/course.html?date=' + d + '">코스 짜러 가기 →</a>' +
            '<button type="button" class="btn ghost" data-act="unconfirm">확정 취소</button>';
        } else if (past) {
          box.hidden = true;
        } else {
          var both = bothLabel(st ? { st: st, part: part } : meAuto, th);
          box.innerHTML = (both ? '<div class="msg">둘 다 돼요 · ' + both + '</div>' : '') +
            '<button type="button" class="btn ' + (both ? 'pri' : '') + ' wide" data-act="confirm">💞 이날 보자</button>';
        }
      }
      paintConfirm();
      bs.addEventListener('click', function (e) {
        var s = e.target.closest('[data-st]');
        if (s) {
          st = s.getAttribute('data-st');
          bs.querySelectorAll('[data-st]').forEach(function (b) { b.setAttribute('aria-pressed', String(b === s)); });
          bs.querySelector('[data-parts]').hidden = st !== 'part';
          paintConfirm();

        var p = e.target.closest('[data-part]');
        if (p) {

          setConfirmed(d, true);
          renderAll(); paintConfirm(); toast('💞 ' + mdw(d) + ' 데이트로 정했어요');
        } else if (act === 'unconfirm') {
          setConfirmed(d, false);
          renderAll(); paintConfirm(); toast('확정을 취소했어요');
        }

  }

  // ---------- 고정 일정 목록 · 편집 ----------
  function renderRulesBtn() {
    var n = ruList().filter(isMine).length;
    document.getElementById('rulesN').textContent = n ? n + '개' : '없음 · 수업·근무를 한 번만 정해 두기';
  }
  document.getElementById('rulesBtn').addEventListener('click', openRules);
  function openRules() {
    var mine = ruList().filter(isMine);
    var html = '<h2>🔁 내 고정 일정</h2>' +
      '<p class="muted" style="margin:0 0 10px">매주·격주·매달·교대 근무처럼 반복되는 일정을 한 번만 정해 두면 달력에 자동으로 칠해져요. 그날만 다르면 달력에서 그날을 눌러 바꾸면 돼요.</p>' +
      '<div class="rlist">' + (mine.length ? mine.map(function (r) {
        var sub = r.kind === 'shift' ? (r.seq || []).join('→') : (CHOICE_TEXT[r.ch] || '') + (r.note ? ' · ' + r.note : '');
        sub += r.until ? ' · ' + mdShort(r.until) + '까지' : '';
        var col = r.kind === 'shift' ? '' : ruleColor(r);

          : (col ? '<span class="tagmini c-' + col + '">' + esc((r.note || '').charAt(0)) + '</span>' : '');
        return '<button type="button" class="ritem" data-rid="' + esc(r.id) + '"><span class="prev">' + prev + '</span><span><div class="t">' + esc(ruleLabel(r)) + '</div><div class="s">' + esc(sub) + '</div></span></button>';
      }).join('') : '<div class="muted">아직 없어요.</div>') + '</div>' +
      '<div class="acts"><button type="button" class="btn" data-act="close">닫기</button><button type="button" class="btn pri" data-act="add">＋ 추가</button></div>';
    openSheet(html, function (bs) {
      bs.addEventListener('click', function (e) {
        var it = e.target.closest('[data-rid]');

        var a = e.target.closest('[data-act]');

      });
    });
  }
  function openRule(orig) {
    var r = orig ? JSON.parse(JSON.stringify(orig)) : { kind: 'weekly', days: [], mdays: [], ch: 'no', note: '', from: today(), until: '', seq: [], map: {} };
    if (!r.map) r.map = {};
    SHIFT_TYPES.forEach(function (t) { if (!r.map[t[0]]) r.map[t[0]] = t[1]; });
    var html = '<h2>' + (orig ? '고정 일정 고치기' : '고정 일정 추가') + '</h2>' +
      '<div class="who">반복</div><div class="seg4" data-kinds>' + [['weekly', '매주'], ['biweekly', '격주'], ['monthly', '매달'], ['shift', '교대 근무']].map(function (k) {
        return '<button type="button" data-kind="' + k[0] + '">' + k[1] + '</button>';
      }).join('') + '</div>' +
      '<div data-pane="week"><div class="who" data-weeklab>요일</div><div class="wdays">' + WEEK.map(function (w, i) {
        return '<button type="button" class="tog" data-wd="' + i + '">' + w + '</button>';
      }).join('') + '</div></div>' +
      '<div data-pane="month"><div class="who">날짜</div><div class="mdays">' + Array.apply(null, Array(31)).map(function (_, i) {
        return '<button type="button" class="tog" data-md="' + (i + 1) + '">' + (i + 1) + '</button>';
      }).join('') + '</div></div>' +
      '<div data-pane="shift"><div class="who">근무 순서 (눌러서 차례대로 쌓기)</div><div class="seq" data-seq></div>' +
        '<div class="typerow">' + SHIFT_TYPES.map(function (t) { return '<button type="button" class="tog" style="padding:6px 12px" data-addt="' + t[0] + '">＋ ' + t[0] + '</button>'; }).join('') +
        '<button type="button" class="tog" style="padding:6px 12px" data-act="seqback">⌫ 하나 지우기</button></div>' +
        '<div class="who">근무마다 데이트는?</div><div data-maps></div></div>' +
      '<div data-pane="state"><div class="who">그날은</div><div class="seg4" data-chs>' + ['ok', 'day', 'eve', 'no'].map(function (k) {
        return '<button type="button" data-ch="' + k + '">' + CHOICE_TEXT[k] + '</button>';
      }).join('') + '</div>' +
      '<input class="memo" data-rnote maxlength="20" placeholder="메모 (예: 수업, 알바, 필라테스)" value="' + esc(r.note || '') + '">' +
      '<div class="who">달력에 보이는 색 (메모 첫 글자가 칸에 표시돼요)</div><div class="colors">' + COLORS.map(function (c) {
        return '<button type="button" class="col' + (c[0] ? ' c-' + c[0] : ' none') + '" data-col="' + c[0] + '">' + c[1] + '</button>';
      }).join('') + '</div></div>' +
      '<div class="who" data-fromlab>기간</div><div class="period"><input type="date" class="dateinp" data-from value="' + esc(r.from || today()) + '"> ~ ' +
        '<input type="date" class="dateinp" data-until value="' + esc(r.until || '') + '"><span class="muted">(끝 날짜 비우면 계속)</span></div>' +
      '<div class="acts">' + (orig ? '<button type="button" class="btn ghost" data-act="del">삭제</button><span class="sp"></span>' : '') +
        '<button type="button" class="btn" data-act="close">닫기</button><button type="button" class="btn pri" data-act="save">저장</button></div>';
    openSheet(html, function (bs) {
      function paint() {
        bs.querySelectorAll('[data-kind]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-kind') === r.kind)); });
        bs.querySelector('[data-pane="week"]').hidden = !(r.kind === 'weekly' || r.kind === 'biweekly');
        bs.querySelector('[data-pane="month"]').hidden = r.kind !== 'monthly';
        bs.querySelector('[data-pane="shift"]').hidden = r.kind !== 'shift';
        bs.querySelector('[data-pane="state"]').hidden = r.kind === 'shift';
        bs.querySelector('[data-weeklab]').textContent = r.kind === 'biweekly' ? '요일 (시작 날짜가 있는 주부터 2주마다)' : '요일';
        bs.querySelector('[data-fromlab]').textContent = r.kind === 'shift' ? '순서 첫날 ~ 끝 (첫날이 순서의 맨 앞 근무)' : '기간';
        bs.querySelectorAll('[data-wd]').forEach(function (b) { b.setAttribute('aria-pressed', String((r.days || []).indexOf(+b.getAttribute('data-wd')) >= 0)); });
        bs.querySelectorAll('[data-md]').forEach(function (b) { b.setAttribute('aria-pressed', String((r.mdays || []).indexOf(+b.getAttribute('data-md')) >= 0)); });
        bs.querySelectorAll('[data-ch]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-ch') === r.ch)); });
        r.note = bs.querySelector('[data-rnote]').value.trim();
        var col = ruleColor(r);
        bs.querySelectorAll('[data-col]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-col') === col)); });
        var seq = r.seq || [];
        bs.querySelector('[data-seq]').innerHTML = seq.length ? seq.map(function (x, i) { return '<span class="sq">' + (i + 1) + '. ' + esc(x) + '</span>'; }).join('') : '<span class="ph">예) 주간 → 주간 → 야간 → 야간 → 비번 → 휴무</span>';
        var used = {};
        seq.forEach(function (x) { used[x] = true; });
        bs.querySelector('[data-maps]').innerHTML = Object.keys(used).length ? Object.keys(used).map(function (n) {
          return '<div class="maprow"><b>' + esc(n) + '</b><select data-map="' + esc(n) + '">' + ['ok', 'day', 'eve', 'no'].map(function (k) {
            return '<option value="' + k + '"' + (r.map[n] === k ? ' selected' : '') + '>' + CHOICE_TEXT[k] + '</option>';
          }).join('') + '</select></div>';
        }).join('') : '<div class="muted">순서를 쌓으면 여기서 정할 수 있어요.</div>';
      }
      paint();
      bs.querySelector('[data-rnote]').addEventListener('input', paint); // '수업'이라고 쓰면 빨강 등 기본 색 따라감
      bs.addEventListener('change', function (e) {
        var m = e.target.closest('[data-map]');
        if (m) r.map[m.getAttribute('data-map')] = m.value;
      });
      bs.addEventListener('click', function (e) {
        var k = e.target.closest('[data-kind]');
        if (k) { r.kind = k.getAttribute('data-kind'); paint(); return; }
        var w = e.target.closest('[data-wd]');
        if (w) { var i = +w.getAttribute('data-wd'), a = r.days || (r.days = []); var at = a.indexOf(i); if (at >= 0) a.splice(at, 1); else a.push(i); paint(); return; }
        var md = e.target.closest('[data-md]');
        if (md) { var j = +md.getAttribute('data-md'), b = r.mdays || (r.mdays = []); var bt = b.indexOf(j); if (bt >= 0) b.splice(bt, 1); else b.push(j); paint(); return; }
        var c = e.target.closest('[data-ch]');
        if (c) { r.ch = c.getAttribute('data-ch'); paint(); return; }
        var cl = e.target.closest('[data-col]');
        if (cl) { r.color = cl.getAttribute('data-col'); paint(); return; }
        var t = e.target.closest('[data-addt]');
        if (t) { (r.seq || (r.seq = [])).push(t.getAttribute('data-addt')); paint(); return; }
        var act = e.target.closest('[data-act]');
        if (!act) return;
        act = act.getAttribute('data-act');
        if (act === 'seqback') { (r.seq || []).pop(); paint(); }
        else if (act === 'close') closeSheet();
        else if (act === 'del') {
          writeJSON(RU_KEY, ruList().filter(function (x) { return x.id !== orig.id; }));
          renderAll(); closeSheet(); toast('고정 일정을 지웠어요');
        } else if (act === 'save') {
          r.note = bs.querySelector('[data-rnote]').value.trim();
          r.from = bs.querySelector('[data-from]').value || today();
          r.until = bs.querySelector('[data-until]').value || '';
          if ((r.kind === 'weekly' || r.kind === 'biweekly') && !(r.days || []).length) { toast('요일을 골라주세요'); return; }
          if (r.kind === 'monthly' && !(r.mdays || []).length) { toast('날짜를 골라주세요'); return; }
          if (r.kind === 'shift' && !(r.seq || []).length) { toast('근무 순서를 쌓아주세요'); return; }
          if (r.until && r.until < r.from) { toast('끝 날짜가 시작보다 빨라요'); return; }
          // 필요 없는 칸은 비워서 저장
          if (r.kind !== 'weekly' && r.kind !== 'biweekly') r.days = [];
          if (r.kind !== 'monthly') r.mdays = [];
          if (r.kind !== 'shift') { r.seq = []; r.map = {}; }
          else { var keep = {}; r.seq.forEach(function (x) { keep[x] = r.map[x] || 'no'; }); r.map = keep; }
          var list = ruList();
          if (orig) list = list.map(function (x) { return x.id === orig.id ? r : x; });
          else { r.id = uid(); list.push(r); }
          writeJSON(RU_KEY, list);
          renderAll(); closeSheet(); toast(orig ? '고정 일정을 고쳤어요' : '고정 일정을 추가했어요');
        }
      });
    });
  }

  // ---------- 시트 ----------
  var stack = [];
  function enableDragClose(ov, sheet) {
    var startY = 0, dy = 0, dragging = false, samples = [];
    sheet.addEventListener('pointerdown', function (e) {
      if (!e.target.closest('.grip, .grip-zone, h2')) return;
      dragging = true; startY = e.clientY; dy = 0; samples = [[Date.now(), 0]];
      sheet.style.transition = 'none';
      try { sheet.setPointerCapture(e.pointerId); } catch (err) { /* 없어도 됨 */ }
    });
    sheet.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      dy = Math.max(0, e.clientY - startY);
      samples.push([Date.now(), dy]); if (samples.length > 6) samples.shift();
      sheet.style.transform = dy ? 'translateY(' + dy + 'px)' : '';
      ov.style.opacity = String(Math.max(0.4, 1 - dy / 500));
    });
    function up() {
      if (!dragging) return;
      dragging = false;
      var first = samples[0], speed = (dy - first[1]) / Math.max(1, Date.now() - first[0]);
      sheet.style.transition = ''; ov.style.opacity = '';
      if (dy > 90 || (speed > 0.6 && dy > 24)) { sheet.style.transform = 'translateY(100%)'; closeSheet(); }
      else sheet.style.transform = '';
    }
    sheet.addEventListener('pointerup', up);
    sheet.addEventListener('pointercancel', up);
  }
  function openSheet(html, onMount) {
    var ov = document.createElement('div');
    ov.className = 'ov';
    ov.innerHTML = '<div class="bs" role="dialog" aria-modal="true"><div class="grip-zone"><div class="grip"></div></div>' + html + '</div>';
    ov.addEventListener('click', function (e) { if (e.target === ov) closeSheet(); });
    document.body.appendChild(ov);
    document.body.classList.add('locked');
    stack.push(ov);
    requestAnimationFrame(function () { ov.classList.add('show'); });
    enableDragClose(ov, ov.querySelector('.bs'));
    if (onMount) onMount(ov.querySelector('.bs'));
  }
  function closeSheet() {
    var ov = stack.pop();
    if (!ov) return;
    ov.classList.remove('show');
    setTimeout(function () { ov.remove(); }, 260);
    if (!stack.length) document.body.classList.remove('locked');
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && stack.length) { e.preventDefault(); closeSheet(); } });

  // ---------- 뒤로 ----------
  function goBackTo(href) {
    var sameSite = false;
    try { sameSite = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch (e) { sameSite = false; }
    if (sameSite && history.length > 1) history.back();
    else location.replace(href);
  }
  document.getElementById('backBtn').addEventListener('click', function (e) {
    if (e.metaKey || e.ctrlKey) return;
    e.preventDefault();
    var href = this.getAttribute('href');
    document.body.classList.add('switching');
    setTimeout(function () { goBackTo(href); }, 120);
  });
  window.addEventListener('pageshow', function () { document.body.classList.remove('switching'); });

  // 같이 쓰기: 상대가 바꾼 게 들어오면 다시 그림
  window.addEventListener('ournote:remote', renderAll);
  window.addEventListener('pageshow', function (e) { if (e.persisted) renderAll(); });
  renderAll();

  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('/sw.js').catch(function () {});
})();
</script>
