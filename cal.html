<html lang="ko">
<head>

<style>
  :root {
    --bg: #f7f3f4;
    --paper: #fff;
    --paper-60: rgba(255, 255, 255, .6);
    --ink: #2b2230;
    --muted: #7d6f7a;
    --line: #e8dfe3;
    --rose: #b5476a;
    --rose-soft: #f6e3ea;
    --plum: #4a2f45;
    --ok: #5fae80;
    --part: #e6bd3a;
    --no: #d9474f;
    --shadow: 0 1px 2px rgba(43, 34, 48, .06), 0 4px 14px rgba(43, 34, 48, .05);
    --serif: "Gowun Batang", "Apple SD Gothic Neo", serif;
    --script: "Great Vibes", "Snell Roundhand", "Apple Chancery", cursive;
    --sans: "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c171d;
      --paper: #262028;
      --paper-60: rgba(38, 32, 40, .6);
      --ink: #f1e9ef;
      --muted: #a8999f;
      --line: #3a3039;
      --rose: #e3829f;
      --rose-soft: #3d2531;
      --plum: #e9cfe0;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
    animation: enter .2s ease both;
  }
  body.locked { overflow: hidden; }
  /* 꾹 눌러도 글자가 선택되거나 복사 메뉴가 뜨지 않게(입력칸은 제외) */
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  input, textarea, select { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
  @keyframes enter { from { opacity: 0; } to { opacity: 1; } }
  button, input { font: inherit; color: inherit; }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 max(16px, env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    transition: opacity .12s ease, transform .12s ease;
  }
  body.switching .wrap { opacity: 0; transform: scale(.98); }
  header.top { position: relative; padding: calc(28px + env(safe-area-inset-top)) 2px 10px; }
  header.top h1 { margin: 0; padding-right: 116px; font-family: var(--script); font-weight: 400; font-size: 46px; line-height: 1.1; color: var(--plum); white-space: nowrap; }
  .pillbtn {
    position: absolute; top: calc(28px + env(safe-area-inset-top)); right: 0; height: 34px; padding: 0 13px;
    border-radius: 999px; border: 1px solid var(--line); background: var(--paper); color: var(--plum);
    font-family: var(--serif); font-weight: 700; font-size: 14px; display: grid; place-items: center; box-shadow: var(--shadow); text-decoration: none;
  }
  .sec { margin: 14px 2px 8px; font-size: 12px; letter-spacing: .06em; color: var(--muted); }

  /* 요약 카드 */
  .card { background: var(--paper-60); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); }
  .next { display: flex; align-items: center; gap: 10px; }
  .next .h { font-family: var(--serif); font-weight: 700; font-size: 17px; color: var(--plum); }
  .next .dd { margin-left: auto; color: var(--rose); font-weight: 600; font-size: 14px; white-space: nowrap; }
  .card a { color: var(--rose); font-size: 13px; text-decoration: none; white-space: nowrap; }
  .card .lab { font-size: 12.5px; color: var(--muted); margin: 10px 0 6px; }
  .card .lab:first-child { margin-top: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--rose-soft); background: var(--rose-soft); color: var(--rose); border-radius: 999px; padding: 4px 11px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .chip small { font-weight: 400; opacity: .85; margin-left: 3px; }
  .muted { color: var(--muted); font-size: 13px; word-break: keep-all; }

  /* 달력 */
  .monthbar { display: flex; align-items: center; justify-content: space-between; margin: 18px 2px 8px; }
  .monthbar b { font-family: var(--serif); font-size: 18px; color: var(--plum); }
  .monthbar button { width: 36px; height: 32px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); font-size: 18px; color: var(--plum); cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; touch-action: pan-y; }
  .wk { text-align: center; font-size: 11.5px; color: var(--muted); padding-bottom: 2px; }
  .wk.sun { color: var(--rose); }
  .cell {
    position: relative; height: 58px; border-radius: 12px; border: 1px solid transparent; background: var(--paper-60);
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 5px 3px 3px; cursor: pointer;
    transition: background .15s ease, transform .1s ease;
  }
  /* 아래 반쪽: 왼쪽 나, 오른쪽 상대 */
  .halves { display: flex; gap: 2px; width: 100%; height: 24px; }
  .half { flex: 1; min-width: 0; position: relative; border-radius: 6px; display: grid; place-items: center; font-size: 12.5px; font-weight: 700; line-height: 1; }
  .half .dot { width: 9px; height: 9px; border: 0; }
  .half.tagged .dot { position: absolute; top: 2px; right: 2px; width: 7px; height: 7px; box-shadow: 0 0 0 1.5px var(--paper); }
  .c-red { background: #f6cfd2; color: #b3313b; }
  .c-yellow { background: #f7e6a6; color: #806300; }
  .c-blue { background: #c8d9f5; color: #2c57a3; }
  .c-sky { background: #e4edfb; color: #6a8cc6; }
  .c-green { background: #cdeedc; color: #2d7a50; }
  .c-purple { background: #e4d7f5; color: #6b46a3; }
  .c-gray { background: #e6e2e5; color: #6d6570; }
  @media (prefers-color-scheme: dark) {
    .c-red { background: #5a2a30; color: #f3a9b0; }
    .c-yellow { background: #57491c; color: #f2d77a; }
    .c-blue { background: #263f66; color: #a9c6f5; }
    .c-sky { background: #2a3445; color: #a5bbdf; }
    .c-green { background: #234634; color: #9fdcbb; }
    .c-purple { background: #3d2f55; color: #cdb6ef; }
    .c-gray { background: #3a3439; color: #c9c0c6; }
  }
  .cell.out { visibility: hidden; }
  .cell .n { font-size: 14px; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .cell.sun .n { color: var(--rose); }
  .cell.today { border-color: var(--plum); }
  .cell.past { opacity: .4; }
  .cell.both { background: var(--rose-soft); }
  .cell.both::after { content: "💞"; position: absolute; top: 2px; right: 3px; font-size: 9px; }
  .cell.conf .n { background: var(--rose); color: #fff; border-radius: 999px; padding: 0 6px; }
  .cell.hit { transform: scale(.94); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); }
  .dot.ok { background: var(--ok); border-color: var(--ok); }
  .dot.part { background: var(--part); border-color: var(--part); }

  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 10px 2px 0; font-size: 12px; color: var(--muted); align-items: center; }
  .legend .dot { display: inline-block; vertical-align: -1px; margin-right: 3px; }
  .tagmini { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 4px; font-size: 10.5px; font-weight: 700; margin-right: 3px; vertical-align: -3px; }
  .autonote { font-size: 13px; color: var(--ink); background: var(--bg); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; line-height: 1.5; }
  .autonote small { color: var(--muted); }
  .rulesbtn { opacity: .7; display: flex; align-items: center; gap: 6px; width: 100%; margin-top: 12px; border: 1px solid var(--line); background: var(--paper-60); border-radius: 14px; padding: 11px 14px; font-size: 14.5px; color: var(--plum); font-weight: 600; cursor: pointer; text-align: left; }
  .rulesbtn #rulesN { color: var(--muted); font-weight: 400; font-size: 13px; }
  .rulesbtn .arr { margin-left: auto; color: var(--muted); font-size: 18px; }
  .rlist { display: flex; flex-direction: column; gap: 6px; }

  .seg4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
  .seg4 button { border: 0; background: transparent; border-radius: 9px; padding: 7px 0; font-size: 13.5px; color: var(--muted); cursor: pointer; }
  .seg4 button[aria-pressed="true"] { background: var(--paper); color: var(--plum); font-weight: 600; box-shadow: var(--shadow); }
  .wdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .mdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .tog { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 7px 0; font-size: 13.5px; cursor: pointer; }
  .tog[aria-pressed="true"] { border-color: var(--rose); background: var(--rose-soft); color: var(--rose); font-weight: 600; }
  .colors { display: flex; flex-wrap: wrap; gap: 6px; }

  .col.none { background: var(--bg); color: var(--muted); border-color: var(--line); font-weight: 400; }
  .col[aria-pressed="true"] { border-color: var(--plum); }

  .seq { display: flex; flex-wrap: wrap; gap: 4px; min-height: 34px; align-items: center; border: 1px dashed var(--line); border-radius: 12px; padding: 6px; }
  .seq .sq { border-radius: 8px; background: var(--bg); border: 1px solid var(--line); padding: 3px 8px; font-size: 13px; }
  .seq .ph { color: var(--muted); font-size: 12.5px; padding: 0 4px; }
  .typerow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .maprow { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 13px; }

  .maprow select, .dateinp { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 6px 8px; }
  .period { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13.5px; }
  /* 미리보기 달력 카드 */
  .calcard { margin-top: 16px; border: 1px solid var(--line); background: var(--paper-60); border-radius: 18px; padding: 4px 10px 10px; cursor: pointer; box-shadow: var(--shadow); transition: transform .15s ease; }
  .calcard:active { transform: scale(.99); }
  .calcard .monthbar { margin: 10px 4px 8px; }
  .openhint { font-size: 12px; color: var(--muted); }
  .grid.mini .cell { height: 50px; padding-top: 4px; }
  .grid.mini .halves { height: 20px; }
  .grid.mini .half { font-size: 11.5px; }
  /* 달력 화면(전체) */
  .full { position: fixed; inset: 0; z-index: 15; background: var(--bg); display: none; flex-direction: column; clip-path: inset(0 round 0); will-change: clip-path, transform; }
  .full.on { display: flex; }
  .full.anim { transition: clip-path .38s cubic-bezier(.22,.8,.3,1), transform .28s ease, opacity .28s ease; }
  .fhead { padding: calc(8px + env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 4px max(14px, env(safe-area-inset-left)); touch-action: none; }
  .fgrip { width: 38px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 8px; }
  .frow { display: flex; align-items: center; gap: 6px; }
  .frow b { font-family: var(--serif); font-size: 34px; color: var(--plum); line-height: 1.1; }
  .fyear { color: var(--muted); font-size: 14px; margin-left: 4px; align-self: flex-end; padding-bottom: 6px; }
  .frow .sp { flex: 1; }
  .fbtn { height: 32px; min-width: 32px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); color: var(--plum); font-size: 14px; cursor: pointer; }
  .fbtn[aria-pressed="true"] { background: var(--rose-soft); border-color: var(--rose); }
  .fbtn.test { border-style: dashed; font-size: 12.5px; }
  .fbtn.test[aria-pressed="true"] { background: #4678d2; border-color: #4678d2; color: #fff; }
  body.asthem .frow b::after { content: " (상대)"; font-size: 14px; color: #4678d2; }
  body.asthem .rulesbtn::after { content: "상대 입장"; font-size: 11px; color: #fff; background: #4678d2; border-radius: 999px; padding: 1px 7px; }
  .fweek { display: grid; grid-template-columns: repeat(7, 1fr); margin-top: 10px; font-size: 11.5px; color: var(--muted); text-align: center; }
  .fweek .sun { color: var(--rose); }
  .fbody { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px max(10px, env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
  .grid.big { touch-action: pan-y; }
  .grid.big { gap: 0 2px; }
  .grid.big .cell { height: 76px; justify-content: space-between; gap: 1px; padding: 3px 1px 3px; background: transparent; border-radius: 8px; }
  .grid.big .cell.both { background: var(--rose-soft); }
  .lanes { display: flex; flex-direction: column; gap: 2px; width: 100%; }
  .lanes.me { margin-bottom: auto; }
  .lane { position: relative; height: 12px; display: flex; align-items: center; }
  .lane .dot { width: 7px; height: 7px; border: 0; margin-left: 3px; }
  .bar { position: relative; flex: 1; min-width: 0; height: 12px; border-radius: 2px; display: flex; align-items: center; border-left: 2.5px solid; }
  .bar.jl { border-left: 0; margin-left: -3px; border-top-left-radius: 0; border-bottom-left-radius: 0; }
  .bar.jr { margin-right: -3px; border-top-right-radius: 0; border-bottom-right-radius: 0; }
  /* 글자는 이어진 띠 길이만큼만, 넘치면 잘림 */
  .bar b { position: relative; z-index: 2; display: block; padding: 0 2px 0 2px; font-size: 9px; font-weight: 500; white-space: nowrap; overflow: hidden; line-height: 12px; letter-spacing: -.3px;
    width: calc(var(--run, 1) * 100% + (var(--run, 1) - 1) * 4px); max-width: none; color: var(--ink); }
  .lane .more { position: absolute; right: 0; top: -5px; z-index: 3; font-style: normal; font-size: 8.5px; font-weight: 700; color: var(--muted); background: var(--paper); border-radius: 6px; padding: 0 2px; line-height: 11px; }
  .b-red { background: rgba(217, 71, 79, .18); border-left-color: #d9474f; }
  .b-yellow { background: rgba(230, 189, 58, .24); border-left-color: #d9a91e; }
  .b-blue { background: rgba(70, 120, 210, .20); border-left-color: #4678d2; }
  .b-sky { background: rgba(120, 160, 225, .14); border-left-color: #9cb8e6; }
  .b-green { background: rgba(95, 174, 128, .20); border-left-color: #5fae80; }
  .b-purple { background: rgba(140, 100, 200, .18); border-left-color: #8c64c8; }
  .b-gray { background: rgba(120, 112, 118, .16); border-left-color: #8a8088; }
  .grid .wk { display: none; }
  .grid.mini .wk { display: block; }
  .cell.today { background: rgba(181, 71, 106, .10); border-color: transparent; }

  .grid.onlyboth .cell.both { box-shadow: 0 0 0 1.5px var(--rose) inset; }
  /* 고른 날 정보 */
  .dayp { margin-top: 12px; background: var(--paper-60); border: 1px solid var(--line); border-radius: 16px; padding: 14px 14px 12px; }

    width: 100%; max-width: 560px; max-height: calc(100% - 20px - env(safe-area-inset-top)); overflow-y: auto; -webkit-overflow-scrolling: touch;

  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Our days</h1>
    <a class="pillbtn" id="backBtn" href="/v2.html" aria-label="Our note로 돌아가기">← 노트</a>
  </header>

  <div class="card" id="summary"></div>

  <!-- 달력(미리보기): 어디든 누르면 위로 올라가며 달력 화면으로 -->
  <div class="calcard" id="calCard" role="button" tabindex="0" aria-label="달력 크게 보기">
    <div class="monthbar"><b id="monthT"></b><span class="openhint">눌러서 크게 보기 ⌃</span></div>
    <div class="grid mini" id="grid"></div>
    <div class="legend">
      <span><span class="dot ok"></span>돼요</span>
      <span><span class="dot part"></span>일부만</span>
      <span><span class="dot no"></span>안 돼요</span>
      <span><span class="tagmini c-red">수</span>고정 일정</span>
      <span>💞 둘 다 돼요</span>
    </div>
  </div>
  <button type="button" class="rulesbtn" id="rulesBtn">🔁 고정 일정 <span id="rulesN"></span><span class="arr">›</span></button>
</div>

<!-- 달력 화면(전체): 나갈 때는 아래로 내리거나 왼쪽 끝에서 오른쪽으로 밀기 -->
<div class="full" id="full" aria-hidden="true">
  <div class="fhead" id="fhead">
    <div class="fgrip"></div>
    <div class="frow">
      <b id="fMonth"></b><span class="fyear" id="fYear"></span><span class="sp"></span>
      <button type="button" class="fbtn test" id="fAs" aria-pressed="false" title="테스트용: 상대 입장으로 보기">상대</button>
      <button type="button" class="fbtn" id="fToday">오늘</button>
      <button type="button" class="fbtn" id="fBoth" aria-pressed="false" aria-label="둘 다 되는 날만 보기">💞</button>
      <button type="button" class="fbtn" id="fPrev" aria-label="이전 달">‹</button>
      <button type="button" class="fbtn" id="fNext" aria-label="다음 달">›</button>
    </div>
    <div class="fweek" id="fWeek"></div>
  </div>
  <div class="fbody" id="fbody">
    <div class="grid big" id="fgrid"></div>
    <div class="dayp" id="dayp"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });

  var AV_KEY = 'ournote:avail';   // 각자 되는 날: [{ id, date, st: ok|part|no, part: day|eve|'', note, who }]
  var DT_KEY = 'ournote:dates';   // 이날 보자(확정): [{ id, date, who }]
  var WEEK = ['일', '월', '화', '수', '목', '금', '토'];
  var NEXT = { '': 'ok', ok: 'part', part: 'no', no: '' };
  var ST_TEXT = { ok: '돼요', part: '일부만', no: '안 돼요' };
  var PART_TEXT = { day: '낮만', eve: '저녁만', '': '' };

  function readJSON(key, fb) {
    try { var v = JSON.parse(localStorage.getItem(key)); return v === null || v === undefined ? fb : v; } catch (e) { return fb; }
  }
  function writeJSON(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); return true; } catch (e) { return false; } }
  function uid() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function today() { return ymd(new Date()); }
  function mdw(s) { var d = parse(s); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + WEEK[d.getDay()] + ')'; }
  function mdShort(s) { var d = parse(s); return (d.getMonth() + 1) + '/' + d.getDate() + '(' + WEEK[d.getDay()] + ')'; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  // ---------- 데이터 ----------
  function syncState() { return readJSON('ournote:sync', null) || {}; }
  function connected() { return !!syncState().cid; }
  // 같이 쓰기 전에 적은 건 who가 비어 있음 → 내 것
  function isMe(x) { var u = syncState().uid; return !x.who || (!!u && x.who === u); }
  // 테스트용(나중에 없앨 것): '상대' 버튼을 켜면 상대 입장으로 보고, 그때 만드는 건 테스트 상대 일정이 됨
  var TEST_WHO = 'test-partner', asThem = false;
  try { asThem = sessionStorage.getItem('ournote:asThem') === '1'; } catch (e) { asThem = false; }
  function isMine(x) { return asThem ? !isMe(x) : isMe(x); }
  function avList() { var v = readJSON(AV_KEY, []); return Array.isArray(v) ? v.filter(function (x) { return x && x.id && x.date; }) : []; }
  function dtList() { var v = readJSON(DT_KEY, []); return Array.isArray(v) ? v.filter(function (x) { return x && x.id && x.date; }) : []; }
  function mineOn(d, list) { var r = null; (list || avList()).forEach(function (x) { if (x.date === d && isMine(x)) r = x; }); return r; }
  function theirsOn(d, list) { var r = null; (list || avList()).forEach(function (x) { if (x.date === d && !isMine(x)) r = x; }); return r; }
  function setMine(d, st, part, note) {
    var list = avList();
    var cur = mineOn(d, list);
    // 같은 날 내 것이 여러 개 생겼으면(폰 두 대 등) 하나만 남김
    list = list.filter(function (x) { return !(x.date === d && isMine(x) && x !== cur); });
    if (!st) list = list.filter(function (x) { return x !== cur; });
    else if (cur) { cur.st = st; cur.part = st === 'part' ? (part || '') : ''; cur.note = note || ''; }
    else { var nx = { id: uid(), date: d, st: st, part: st === 'part' ? (part || '') : '', note: note || '' }; if (asThem) nx.who = TEST_WHO; list.push(nx); }
    writeJSON(AV_KEY, list);
  }
  function confirmedOn(d) { return dtList().filter(function (x) { return x.date === d; })[0] || null; }
  function setConfirmed(d, on) {
    var list = dtList().filter(function (x) { return x.date !== d; });
    if (on) list.push({ id: uid(), date: d });
    writeJSON(DT_KEY, list);
  }
  // ---------- 고정 일정(반복) ----------
  // { id, who, kind: weekly|biweekly|monthly|shift, days:[0-6], mdays:[1-31], ch: ok|day|eve|no, note,
  //   from, until, seq:['주간',…], map:{ 주간: 'eve', … } }  — 직접 표시한 날이 항상 우선
  var RU_KEY = 'ournote:rules';
  var CHOICE = { ok: { st: 'ok', part: '' }, day: { st: 'part', part: 'day' }, eve: { st: 'part', part: 'eve' }, no: { st: 'no', part: '' } };
  var CHOICE_TEXT = { ok: '🟢 돼요', day: '🟡 낮만', eve: '🟡 저녁만', no: '🔴 안 돼요' };
  var SHIFT_TYPES = [['주간', 'eve'], ['야간', 'no'], ['비번', 'eve'], ['휴무', 'ok']];
  // 달력 칸에 보이는 고정 일정 글자 색. 휴무는 표시 안 함
  var SHIFT_COLOR = { '주간': 'yellow', '야간': 'blue', '비번': 'sky', '휴무': '' };
  var COLORS = [['red', '빨강'], ['yellow', '노랑'], ['blue', '파랑'], ['green', '초록'], ['purple', '보라'], ['gray', '회색'], ['', '표시 안 함']];
  function ruleColor(r) {
    if (r.color !== undefined) return r.color;
    if (/수업/.test(r.note || '') || r.ch === 'no') return 'red';
    if (r.ch === 'day' || r.ch === 'eve') return 'yellow';
    return '';
  }
  function ruList() { var v = readJSON(RU_KEY, []); return Array.isArray(v) ? v.filter(function (x) { return x && x.id && x.kind; }) : []; }
  function dayDiff(a, b) { return Math.round((parse(b) - parse(a)) / 86400000); }
  function weekStart(s) { var d = parse(s); d.setDate(d.getDate() - d.getDay()); return ymd(d); }
  function ruleHit(r, d) {
    var from = r.from || '0000-00-00';
    if (d < from || (r.until && d > r.until)) return null;
    var dt = parse(d), ch = r.ch, note = r.note || '';
    if (r.kind === 'weekly') { if ((r.days || []).indexOf(dt.getDay()) < 0) return null; }
    else if (r.kind === 'biweekly') {
      if ((r.days || []).indexOf(dt.getDay()) < 0) return null;
      if (Math.round(dayDiff(weekStart(from), weekStart(d)) / 7) % 2 !== 0) return null; // 시작 날짜가 있는 주부터 2주마다
    } else if (r.kind === 'monthly') { if ((r.mdays || []).indexOf(dt.getDate()) < 0) return null; }
    else if (r.kind === 'shift') {
      var seq = r.seq || [];
      if (!seq.length) return null;
      var name = seq[((dayDiff(from, d) % seq.length) + seq.length) % seq.length];
      ch = (r.map || {})[name] || 'no';
      note = name;
    } else return null;
    var c = CHOICE[ch] || CHOICE.no;
    var color = r.kind === 'shift' ? (SHIFT_COLOR[note] !== undefined ? SHIFT_COLOR[note] : 'gray') : ruleColor(r);
    var tag = color ? { t: (note || '').charAt(0), c: color } : null;
    return { st: c.st, part: c.part, note: note, auto: true, rule: r, tag: tag };
  }
  function ruleLabel(r) {
    var dn = (r.days || []).slice().sort().map(function (i) { return WEEK[i]; }).join('·');
    if (r.kind === 'weekly') return '매주 ' + dn;
    if (r.kind === 'biweekly') return '격주 ' + dn;
    if (r.kind === 'monthly') return '매달 ' + (r.mdays || []).slice().sort(function (a, b) { return a - b; }).join('·') + '일';
    if (r.kind === 'shift') return '교대 ' + (r.seq || []).length + '일 순환';
    return '';
  }
  // 그날 실제 상태: 직접 표시 > 고정 일정
  // 고정 일정이 여러 개 겹치면 더 빡빡한 쪽(안 돼요 > 일부만 > 돼요)
  function ruleOn(d, mine, rules) {
    var rank = { no: 3, part: 2, ok: 1 }, best = null, n = 0;
    (rules || ruList()).forEach(function (r) {
      if (isMine(r) !== mine) return;
      var m = ruleHit(r, d);
      if (m && m.tag) n++;
      if (m && (!best || rank[m.st] >= rank[best.st])) best = m;
    });
    if (best) best.count = n;
    return best;
  }
  function effOn(d, mine, av, rules) {
    var ex = mine ? mineOn(d, av) : theirsOn(d, av);
    return ex || ruleOn(d, mine, rules);
  }

  function free(x) { return !!x && (x.st === 'ok' || x.st === 'part'); }
  // 둘 다 되는지 + 언제(종일/낮/저녁)
  function bothLabel(a, b) {
    if (!free(a) || !free(b)) return null;
    var pa = a.st === 'ok' ? 'all' : (a.part || 'some'), pb = b.st === 'ok' ? 'all' : (b.part || 'some');
    if (pa === 'all' && pb === 'all') return '종일';
    if (pa === 'all') return pb === 'day' ? '낮' : pb === 'eve' ? '저녁' : '일부';
    if (pb === 'all') return pa === 'day' ? '낮' : pa === 'eve' ? '저녁' : '일부';
    if (pa === pb) return pa === 'day' ? '낮' : pa === 'eve' ? '저녁' : '일부';
    if (pa === 'some' || pb === 'some') return '일부';
    return null; // 한 명은 낮만, 한 명은 저녁만 → 안 겹침
  }

  // ---------- 요약 ----------
  function renderSummary() {
    var t = today(), list = avList();
    var conf = dtList().map(function (x) { return x.date; }).filter(function (d) { return d >= t; }).sort()[0];
    var html = '';
    if (conf) {
      var dd = Math.round((parse(conf) - parse(t)) / 86400000);
      html += '<div class="lab">💞 다음 데이트</div><div class="next"><span class="h">' + esc(mdw(conf)) + '</span>' +
        '<span class="dd">' + (dd === 0 ? '오늘!' : 'D-' + dd) + '</span></div>' +
        '<div style="margin-top:4px"><a href="/course.html?date=' + conf + '" data-go="course">코스 보러 가기 →</a></div>';
    }
    var rules = ruList();
    if (!connected() && !list.some(function (x) { return !isMine(x); }) && !rules.some(function (x) { return !isMine(x); })) {
      html += '<div class="lab">둘 다 되는 날</div><div class="muted">💞 같이 쓰기를 연결하면 상대가 표시한 날도 보이고, 둘 다 되는 날을 찾아줘요. 지금은 내 일정만 적을 수 있어요.</div>';
    } else {
      var hits = [], dd0 = parse(t);
      for (var k = 0; k < 120 && hits.length < 6; k++) {
        var d = ymd(new Date(dd0.getFullYear(), dd0.getMonth(), dd0.getDate() + k));
        var l = bothLabel(effOn(d, true, list, rules), effOn(d, false, list, rules));
        if (l && d !== conf) hits.push({ d: d, l: l });
      }
      html += '<div class="lab">둘 다 되는 날</div>' + (hits.length
        ? '<div class="chips">' + hits.map(function (h) { return '<button type="button" class="chip" data-day="' + h.d + '">' + esc(mdShort(h.d)) + '<small>' + h.l + '</small></button>'; }).join('') + '</div>'
        : '<div class="muted">아직 없어요. 각자 되는 날을 눌러서 표시해 보세요.</div>');
    }
    document.getElementById('summary').innerHTML = html;
  }

  // ---------- 달력 ----------
  var shown = new Date(); shown = new Date(shown.getFullYear(), shown.getMonth(), 1);
  var sel = today(), onlyBoth = false;
  function renderMonth(el, big) {
    var t = today(), list = avList(), rules = ruList(), conf = {};
    dtList().forEach(function (x) { conf[x.date] = true; });
    var h = WEEK.map(function (w, i) { return '<div class="wk' + (i === 0 ? ' sun' : '') + '">' + w + '</div>'; }).join('');
    var first = shown.getDay(), dim = new Date(shown.getFullYear(), shown.getMonth() + 1, 0).getDate();
    for (var i = 0; i < first; i++) h += '<div class="cell out"></div>';
    // 큰 달력: 줄마다(위 나 / 아래 상대) 띠. 같은 일정이 이어지면 한 띠, 글자는 띠 길이까지만(넘치면 잘림)
    var lanes = [];
    if (big) for (var k = 1; k <= dim; k++) {
      var kd = ymd(new Date(shown.getFullYear(), shown.getMonth(), k));
      lanes[k] = { me: laneItems(kd, true, list, rules), them: laneItems(kd, false, list, rules) };
    }
    function same(a, b) { return a && b && a.kind === 'bar' && a.key === b.key; }
    for (var dn = 1; dn <= dim; dn++) {
      var dt = new Date(shown.getFullYear(), shown.getMonth(), dn), d = ymd(dt);
      var me = effOn(d, true, list, rules), th = effOn(d, false, list, rules);
      var cls = ['cell'];
      if (dt.getDay() === 0) cls.push('sun');
      if (d === t) cls.push('today');
      if (d < t) cls.push('past');
      if (bothLabel(me, th)) cls.push('both');
      if (conf[d]) cls.push('conf');
      if (big && d === sel) cls.push('sel');
      var inner;
      if (big) {
        var dow = dt.getDay();
        // 나: 위에서부터 / 상대: 칸 아래에서부터 위로
        inner = ['me', 'them'].map(function (who) {
          var html = [0, 1].map(function (slot) {
            var x = lanes[dn][who][slot];
            var jl = dow > 0 && dn > 1 && same(lanes[dn - 1][who][slot], x);
            var jr = dow < 6 && dn < dim && same(lanes[dn + 1][who][slot], x);
            var run = 1;
            if (x && !jl) for (var q = dn + 1; q <= dim && new Date(shown.getFullYear(), shown.getMonth(), q).getDay() > 0 && same(lanes[q][who][slot], x); q++) run++;
            return laneHtml(x, jl, jr, run);
          });
          if (who === 'them') html.reverse();
          return '<span class="lanes ' + who + '">' + html.join('') + '</span>';
        }).join('');
      } else {
        inner = '<span class="halves">' + halfHtml('me', ruleOn(d, true, rules), mineOn(d, list)) + halfHtml('them', ruleOn(d, false, rules), theirsOn(d, list)) + '</span>';
      }
      h += '<div class="' + cls.join(' ') + '" data-d="' + d + '"><span class="n">' + dn + '</span>' + inner + '</div>';
    }
    el.innerHTML = h;
    el.classList.toggle('onlyboth', !!(big && onlyBoth));
  }
  // 큰 달력: 한 사람당 최대 2개. 직접 표시(메모 있으면 띠, 없으면 점) 먼저, 그다음 고정 일정 띠
  var STATE_COLOR = { ok: 'green', part: 'yellow', no: 'red' };
  function laneItems(d, mine, av, rules) {
    var out = [];
    var ex = mine ? mineOn(d, av) : theirsOn(d, av);
    if (ex) out.push(ex.note ? { kind: 'bar', key: 'x:' + ex.st + ':' + ex.note, label: ex.note, color: STATE_COLOR[ex.st] || 'gray' } : { kind: 'dot', key: 'dot', st: ex.st });
    (rules || ruList()).forEach(function (r) {
      if (isMine(r) !== mine) return;
      var m = ruleHit(r, d);
      if (m && m.tag) out.push({ kind: 'bar', key: 'r:' + r.id + ':' + m.note, label: m.note || m.tag.t, color: m.tag.c });
    });
    var more = Math.max(0, out.length - 2);
    out = out.slice(0, 2);
    if (more) out[out.length - 1].more = more;
    return out;
  }
  function laneHtml(x, jl, jr, run) {
    if (!x) return '<span class="lane"></span>';
    var more = x.more && !jr ? '<i class="more">+' + x.more + '</i>' : '';
    if (x.kind === 'dot') return '<span class="lane"><i class="dot ' + x.st + '"></i>' + more + '</span>';
    return '<span class="lane"><span class="bar b-' + x.color + (jl ? ' jl' : '') + (jr ? ' jr' : '') + '">' +
      (jl ? '' : '<b style="--run:' + run + '">' + esc(x.label) + '</b>') + '</span>' + more + '</span>';
  }
  // 아래 반쪽 칸: 고정 일정은 글자 1개 + 바탕색, 직접 표시는 작은 점
  function halfHtml(who, rule, ex) {
    var tag = rule && rule.tag;
    return '<span class="half ' + who + (tag ? ' tagged c-' + tag.c : '') + '">' + (tag ? esc(tag.t) : '') +
      (ex ? '<i class="dot ' + ex.st + '"></i>' : '') + '</span>';
  }
  var full = document.getElementById('full'), fgrid = document.getElementById('fgrid');
  function renderAll() {
    renderSummary();
    document.getElementById('monthT').textContent = shown.getFullYear() + '년 ' + (shown.getMonth() + 1) + '월';
    renderMonth(document.getElementById('grid'), false);
    if (full.classList.contains('on')) renderFull();
    renderRulesBtn();
  }
  function renderFull() {
    document.getElementById('fMonth').textContent = (shown.getMonth() + 1) + '월';
    document.getElementById('fYear').textContent = shown.getFullYear();
    document.getElementById('fBoth').setAttribute('aria-pressed', String(onlyBoth));
    renderMonth(fgrid, true);
    renderDay();
  }
  function moveMonth(n) {
    shown = new Date(shown.getFullYear(), shown.getMonth() + n, 1);
    renderAll();
  }
  document.getElementById('fWeek').innerHTML = WEEK.map(function (w, i) { return '<span' + (i === 0 ? ' class="sun"' : '') + '>' + w + '</span>'; }).join('');
  document.getElementById('fPrev').addEventListener('click', function () { moveMonth(-1); });
  document.getElementById('fNext').addEventListener('click', function () { moveMonth(1); });
  function paintAs() {
    document.getElementById('fAs').setAttribute('aria-pressed', String(asThem));
    document.body.classList.toggle('asthem', asThem);
  }
  paintAs();
  document.getElementById('fAs').addEventListener('click', function () {
    asThem = !asThem;
    try { sessionStorage.setItem('ournote:asThem', asThem ? '1' : '0'); } catch (e) { /* 없어도 됨 */ }
    paintAs(); renderAll();
    toast(asThem ? '테스트: 상대 입장으로 봐요 (지금 만드는 일정은 상대 일정)' : '내 입장으로 돌아왔어요');
  });
  document.getElementById('fToday').addEventListener('click', function () {
    sel = today(); var d = new Date(); shown = new Date(d.getFullYear(), d.getMonth(), 1); renderAll();
  });
  document.getElementById('fBoth').addEventListener('click', function () {
    onlyBoth = !onlyBoth; renderFull();
    if (onlyBoth) toast('💞 둘 다 되는 날만 진하게 보여요');
  });

    var ov = document.createElement('div');
    ov.className = 'ov';
    ov.innerHTML = '<div class="bs" role="dialog" aria-modal="true"><div class="grip-zone"><div class="grip"></div></div>' + html + '</div>';
    ov.addEventListener('click', function (e) { if (e.target === ov) closeSheet(); });
    document.body.appendChild(ov);
    document.body.classList.add('locked');
    stack.push(ov);
    requestAnimationFrame(function () { ov.classList.add('show'); });
    enableDragClose(ov, ov.querySelector('.bs'));
    if (onMount) onMount(ov.querySelector('.bs'));
  }
  function closeSheet() {
    var ov = stack.pop();
    if (!ov) return;
    ov.classList.remove('show');
    setTimeout(function () { ov.remove(); }, 260);
    if (!stack.length) document.body.classList.remove('locked');
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && stack.length) { e.preventDefault(); closeSheet(); } });

  // ---------- 뒤로 ----------
  function goBackTo(href) {
    var sameSite = false;
    try { sameSite = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch (e) { sameSite = false; }
    if (sameSite && history.length > 1) history.back();
    else location.replace(href);
  }
  document.getElementById('backBtn').addEventListener('click', function (e) {
    if (e.metaKey || e.ctrlKey) return;
    e.preventDefault();
    var href = this.getAttribute('href');
    document.body.classList.add('switching');
    setTimeout(function () { goBackTo(href); }, 120);
  });
  window.addEventListener('pageshow', function () { document.body.classList.remove('switching'); });

  // 같이 쓰기: 상대가 바꾼 게 들어오면 다시 그림
  window.addEventListener('ournote:remote', renderAll);
  window.addEventListener('pageshow', function (e) { if (e.persisted) renderAll(); });
  renderAll();

  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('/sw.js').catch(function () {});
})();
</script>
<script type="module" src="/sync.js"></script>
