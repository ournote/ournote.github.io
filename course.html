<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Date course · Our note</title>
<meta name="theme-color" content="#b5476a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="약속 노트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://dapi.kakao.com">
<link rel="preconnect" href="https://t1.daumcdn.net">
<link rel="dns-prefetch" href="https://map.daumcdn.net">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Great+Vibes&display=swap">
<style>
  :root {
    --bg: #f7f3f4;
    --paper: #fff;
    --paper-60: rgba(255, 255, 255, .6);
    --ink: #2b2230;
    --muted: #7d6f7a;
    --line: #e8dfe3;
    --rose: #b5476a;
    --rose-soft: #f6e3ea;
    --plum: #4a2f45;
    --shadow: 0 1px 2px rgba(43, 34, 48, .06), 0 4px 14px rgba(43, 34, 48, .05);
    --serif: "Gowun Batang", "Apple SD Gothic Neo", serif;
    --script: "Great Vibes", "Snell Roundhand", "Apple Chancery", cursive;
    --sans: "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c171d;
      --paper: #262028;
      --paper-60: rgba(38, 32, 40, .6);
      --ink: #f1e9ef;
      --muted: #a8999f;
      --line: #3a3039;
      --rose: #e3829f;
      --rose-soft: #3d2531;
      --plum: #e9cfe0;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
    animation: enter .2s ease both;
  }
  body.locked { overflow: hidden; }
  @keyframes enter { from { opacity: 0; } to { opacity: 1; } }
  button, input { font: inherit; color: inherit; }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 max(16px, env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    transition: opacity .12s ease, transform .12s ease;
  }
  body.switching .wrap { opacity: 0; transform: scale(.98); }

  header.top {
    position: relative;
    padding: calc(28px + env(safe-area-inset-top)) 2px 10px;
  }
  header.top h1 {
    margin: 0;
    padding-right: 116px;
    font-family: var(--script);
    font-weight: 400;
    font-size: 46px;
    line-height: 1.1;
    color: var(--plum);
    white-space: nowrap;
  }
  .pillbtn {
    position: absolute;
    top: calc(28px + env(safe-area-inset-top));
    right: 0;
    height: 34px;
    padding: 0 13px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--plum);
    font-family: var(--serif);
    font-weight: 700;
    font-size: 14px;
    display: grid;
    place-items: center;
    box-shadow: var(--shadow);
    text-decoration: none;
  }

  .sec { margin: 14px 2px 8px; font-size: 12px; letter-spacing: .06em; color: var(--muted); }

  /* 1. 일시: 저장된 코스(날짜별) + 날짜 범위 */
  .trips {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    margin: 0 -2px 8px;
    padding: 2px;
  }
  .trips::-webkit-scrollbar { display: none; }
  .trip {
    flex: 0 0 auto;
    border: 1px solid var(--line);
    background: var(--paper-60);
    color: var(--muted);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 12.5px;
    white-space: nowrap;
    cursor: pointer;
  }
  .trip[aria-pressed="true"] { background: var(--plum); border-color: var(--plum); color: var(--bg); }
  .trip.new { color: var(--rose); }
  .when {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    border: 1px solid var(--line);
    background: var(--paper-60);
    border-radius: 14px;
    padding: 11px 14px;
    cursor: pointer;
  }
  .when .d { flex: 1; min-width: 0; font-family: var(--serif); font-weight: 700; font-size: 16px; color: var(--plum); }
  .when .d.none { color: var(--muted); font-weight: 400; font-size: 14.5px; font-family: var(--sans); }
  .when .n { flex: 0 0 auto; font-size: 12px; color: var(--rose); background: var(--rose-soft); border-radius: 999px; padding: 2px 9px; font-weight: 600; }
  .days { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
  .days::-webkit-scrollbar { display: none; }
  .day {
    flex: 0 0 auto;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    border-radius: 10px;
    padding: 5px 11px;
    font-size: 12.5px;
    line-height: 1.35;
    text-align: center;
    cursor: pointer;
  }
  .day b { display: block; font-size: 13px; color: inherit; }
  .day[aria-pressed="true"] { border-color: var(--rose); background: var(--rose-soft); color: var(--rose); }

  /* 달력 */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-head b { font-family: var(--serif); font-size: 17px; color: var(--plum); }
  .cal-head button { border: 1px solid var(--line); background: var(--paper); border-radius: 50%; width: 34px; height: 34px; cursor: pointer; color: var(--plum); }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px 0; text-align: center; }
  .cal .w { font-size: 11.5px; color: var(--muted); padding: 4px 0; }
  .cal .w:first-child { color: var(--rose); }
  .cd {
    position: relative;
    height: 40px;
    border: 0;
    background: transparent;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    color: var(--ink);
  }
  .cd.out { visibility: hidden; }
  .cd.sun { color: var(--rose); }
  .cd.today::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--rose); }
  .cd.has span { text-decoration: underline; text-decoration-color: var(--rose); text-underline-offset: 3px; }
  .cd.in { background: var(--rose-soft); }
  .cd.s, .cd.e { background: var(--rose-soft); }
  .cd.s { border-radius: 999px 0 0 999px; }
  .cd.e { border-radius: 0 999px 999px 0; }
  .cd.s.e { border-radius: 999px; }
  .cd.s span, .cd.e span {
    display: inline-grid;
    place-items: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--rose);
    color: var(--paper);
    font-weight: 700;
  }
  .calsum { margin-top: 12px; text-align: center; font-size: 14px; color: var(--plum); font-weight: 600; min-height: 22px; }
  .calsum small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .dangerlink { display: block; margin: 26px auto 0; border: 0; background: none; color: var(--muted); font-size: 12.5px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .confirm { margin-top: 10px; background: var(--rose-soft); border-radius: 14px; padding: 10px 12px; display: flex; align-items: center; gap: 8px; }
  .confirm span { flex: 1; color: var(--rose); font-weight: 500; font-size: 14px; }
  .confirm .btn { padding: 7px 13px; font-size: 14px; }
  /* 2. 지도 */
  .mapbox {
    position: relative;
    height: 42vh;
    min-height: 260px;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: var(--paper-60);
    box-shadow: var(--shadow);
  }
  #map { position: absolute; inset: 0; }
  .mapmsg {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 24px;
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.6;
    word-break: keep-all;
    z-index: 2;
    background: var(--paper-60);
  }
  .maphint {
    position: absolute;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    z-index: 3;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
    box-shadow: var(--shadow);
  }
  .pin {
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2.5px solid #fff;
    color: #fff;
    font: 700 13px/1 var(--sans);
    box-shadow: 0 2px 6px rgba(0, 0, 0, .3);
    cursor: pointer;
  }

  /* 3. 코스 목록 */
  .stops { display: flex; flex-direction: column; }
  .stop {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    border: 1px solid var(--line);
    background: var(--paper-60);
    border-radius: 14px;
    padding: 11px 14px;
    cursor: pointer;
  }
  .num {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: #fff;
    font: 700 12.5px/1 var(--sans);
  }
  .stop .tx { flex: 1; min-width: 0; }
  .stop .tt { font-family: var(--serif); font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
  .stop .mm { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
  .stop .tm { flex: 0 0 auto; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--plum); font-weight: 600; text-align: right; line-height: 1.3; }
  .stop .tm small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
  .leg { text-align: center; font-size: 11.5px; color: var(--muted); padding: 4px 0; }
  .empty { text-align: center; color: var(--muted); font-size: 13.5px; padding: 18px 10px 6px; word-break: keep-all; }

  .addbar { display: flex; justify-content: center; margin-top: 14px; }
  .addbtn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 42px;
    padding: 0 22px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--paper-60);
    color: var(--rose);
    font-family: var(--serif);
    font-weight: 700;
    font-size: 14.5px;
    box-shadow: var(--shadow);
    cursor: pointer;
  }
  .addbtn svg { width: 15px; height: 15px; }

  /* 바텀시트 */
  .ov {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(28, 20, 26, .32);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    transition: opacity .25s ease;
  }
  .ov.show { opacity: 1; }
  .bs {
    width: 100%;
    max-width: 560px;
    max-height: calc(100% - 20px - env(safe-area-inset-top));
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--paper);
    border-radius: 18px 18px 0 0;
    padding: 10px 20px calc(20px + env(safe-area-inset-bottom));
    transform: translateY(30px);
    transition: transform .3s cubic-bezier(.22,.8,.3,1);
  }
  .ov.show .bs { transform: none; }
  .grip { width: 38px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 14px; }
  .bs h2 { margin: 0 0 12px; font-family: var(--serif); font-size: 19px; color: var(--plum); word-break: keep-all; overflow-wrap: anywhere; }
  .seg { display: flex; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px; margin-bottom: 10px; }
  .seg button { flex: 1; border: 0; background: transparent; border-radius: 999px; padding: 6px 0; font-size: 13.5px; color: var(--muted); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--paper); color: var(--plum); font-weight: 600; box-shadow: var(--shadow); }
  .search { display: flex; gap: 6px; margin-bottom: 8px; }
  .search input {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 12px;
    padding: 9px 12px;
    font-size: 16px;
    outline: none;
  }
  .search input:focus { border-color: var(--rose); }
  .pick { max-height: 30vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .opt {
    width: 100%;
    text-align: left;
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 12px;
    padding: 8px 12px;
    cursor: pointer;
  }
  .opt[aria-pressed="true"] { border-color: var(--rose); background: var(--rose-soft); }
  .opt .t { font-size: 14.5px; font-weight: 500; overflow-wrap: anywhere; }
  .opt .s { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .hint { font-size: 12.5px; color: var(--muted); padding: 6px 2px; word-break: keep-all; }

  /* 원형 시계 */
  .clockwrap { display: flex; flex-direction: column; align-items: center; margin-top: 14px; }
  .clockwrap .lab { align-self: flex-start; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
  svg.clock { width: min(260px, 72vw); height: auto; touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair; }
  .clock .face { fill: var(--bg); stroke: var(--line); }
  .clock .tick { stroke: var(--muted); opacity: .45; }
  .clock .tick.major { opacity: .9; }
  .clock .hr { fill: var(--muted); font: 500 11px var(--sans); text-anchor: middle; dominant-baseline: central; }
  .clock .mid { fill: var(--paper); stroke: var(--line); }
  .clock .read { fill: var(--plum); font: 700 15px var(--sans); text-anchor: middle; dominant-baseline: central; }
  .clock .read2 { fill: var(--muted); font: 500 10.5px var(--sans); text-anchor: middle; dominant-baseline: central; }
  .clocknote { font-size: 12px; color: var(--muted); margin-top: 4px; text-align: center; }

  .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; align-items: center; }
  .acts .sp { flex: 1; }
  .btn { border: 1px solid var(--line); background: var(--paper); border-radius: 12px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
  .btn.pri { background: var(--rose); border-color: var(--rose); color: var(--paper); font-weight: 600; }
  .btn.del { color: var(--rose); border-color: var(--rose-soft); background: transparent; }
  .btn.ghost { background: transparent; color: var(--muted); padding: 8px 12px; font-size: 13.5px; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(28px + env(safe-area-inset-bottom));
    transform: translate(-50%, 10px);
    background: var(--plum);
    color: var(--bg);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 13.5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 40;
    max-width: calc(100% - 32px);
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* 현위치 버튼 */
  .locbtn {
    position: absolute;
    right: 10px;
    bottom: 10px;
    z-index: 4;
    width: 40px;
    height: 40px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--plum);
    display: grid;
    place-items: center;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
    cursor: pointer;
    transition: bottom .2s ease;
  }
  .locbtn svg { width: 20px; height: 20px; }
  .locbtn.on { color: #3b82f6; }
  .locbtn.busy svg { animation: locspin 1s linear infinite; }
  @keyframes locspin { to { transform: rotate(360deg); } }
  .me {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #3b82f6;
    border: 3px solid #fff;
    animation: mepulse 2s ease-out infinite;
  }
  @keyframes mepulse {
    0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, .45); }
    70% { box-shadow: 0 0 0 14px rgba(59, 130, 246, 0); }
    100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
  }
  .sortrow { display: flex; justify-content: flex-end; margin: -2px 0 8px; }
  .sortchip { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .sortchip[aria-pressed="true"] { border-color: var(--rose); background: var(--rose-soft); color: var(--rose); font-weight: 600; }
  .opt .dist { color: var(--rose); font-weight: 600; }
  .addrline { font-size: 13.5px; color: var(--ink); margin: -4px 0 8px; line-height: 1.6; overflow-wrap: anywhere; }
  .addrline a { color: var(--rose); text-decoration: none; margin-left: 2px; }
  .addrline em { color: var(--muted); font-style: normal; font-size: 12px; }
  .noaddr { color: var(--muted); }
  .stop .noaddr { color: var(--rose); opacity: .8; }
  .linkish { border: 0; background: none; color: var(--rose); font-size: 13px; font-weight: 600; padding: 0 2px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .addrbox { margin-bottom: 4px; }
  .pick.small { max-height: 22vh; margin-bottom: 8px; }
  .pick.small:empty { display: none; }
  .picker {
    position: relative;
    height: 240px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: var(--bg);
  }
  .pmap { position: absolute; inset: 0; }
  .aim {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 30px;
    height: 44px;
    margin: -44px 0 0 -15px;
    z-index: 3;
    pointer-events: none;
    transition: transform .15s ease;
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .3));
  }
  .aim svg { width: 100%; height: 100%; display: block; }
  .aimshadow {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 10px;
    height: 4px;
    margin: -2px 0 0 -5px;
    border-radius: 50%;
    background: rgba(0, 0, 0, .3);
    z-index: 2;
    pointer-events: none;
    transition: transform .15s ease, opacity .15s ease;
  }
  .picker.moving .aim { transform: translateY(-8px); }
  .picker.moving .aimshadow { transform: scale(1.5); opacity: .5; }
  .locbtn.small { width: 34px; height: 34px; right: 8px; bottom: 8px; }
  .locbtn.small svg { width: 17px; height: 17px; }
  .pickaddr { margin-top: 8px; font-size: 13px; color: var(--muted); text-align: center; overflow-wrap: anywhere; min-height: 20px; }
  .pickaddr b { color: var(--plum); }
  .sortrow { justify-content: space-between; align-items: center; gap: 8px; }
  .noaddr-slot { font-size: 12.5px; color: var(--muted); }
  .sortrow .sortchip { margin-left: auto; flex: 0 0 auto; }
  .addpicker { margin-top: 8px; }
  /* 끌어내려 닫기: 손잡이 주변을 넓게 잡히도록 */
  .grip-zone { margin: -10px -20px 0; padding: 10px 20px 2px; touch-action: none; cursor: grab; }
  .grip-zone + h2, .grip-zone ~ h2 { touch-action: none; }
  /* 일정 사이 이동 */
  .legwrap { display: flex; flex-direction: column; align-items: center; padding: 5px 0; position: relative; }
  .legwrap::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 1.5px dashed var(--line); z-index: 0; }
  .legpill {
    position: relative;
    z-index: 1;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--muted);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 12px;
    line-height: 1.5;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
    max-width: 100%;
  }
  .legpill.set { background: var(--paper); color: var(--ink); }
  .legpill b { font-weight: 600; color: var(--plum); }
  .legpill i { font-style: normal; opacity: .5; margin: 0 5px; }
  .legpill .sugg { opacity: .7; }
  .legpill .ok { color: #3f7a5a; }
  .legpill .bad { color: var(--rose); font-weight: 600; }
  @media (prefers-color-scheme: dark) { .legpill .ok { color: #7cc59a; } }
  .legmemo { position: relative; z-index: 1; margin-top: 3px; font-size: 11.5px; color: var(--muted); background: var(--bg); padding: 0 6px; max-width: 90%; overflow-wrap: anywhere; text-align: center; }
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 4px 0 12px; }
  .mode {
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 12px;
    padding: 8px 4px;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    cursor: pointer;
  }
  .mode span { font-size: 20px; line-height: 1.2; }
  .mode[aria-pressed="true"] { border-color: var(--rose); background: var(--rose-soft); color: var(--rose); font-weight: 600; }
  .legrow { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13.5px; }
  .legrow label { flex: 0 0 74px; color: var(--muted); font-size: 12.5px; }
  .legrow input {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 16px;
    outline: none;
  }
  .legrow input[type="number"] { flex: 0 0 84px; }
  .legrow input:focus { border-color: var(--rose); }
  .legrow .est { color: var(--muted); font-size: 12px; }
  .routebtn {
    display: block;
    width: 100%;
    border: 1px solid var(--rose-soft);
    background: var(--rose-soft);
    color: var(--rose);
    border-radius: 12px;
    padding: 10px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    margin-top: 4px;
  }
  .routebtn:disabled { opacity: .45; cursor: default; }
  .modebadge {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #fff;
    border: 1.5px solid #b5476a;
    display: grid;
    place-items: center;
    font-size: 14px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .25);
  }
  .ignorebtn {
    margin-left: auto;
    flex: 0 0 auto;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    padding: 4px 11px;
    font-size: 12.5px;
    cursor: pointer;
  }
  .ignorebtn[aria-pressed="true"] { border-color: var(--plum); background: var(--plum); color: var(--bg); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Date course</h1>
    <a class="pillbtn" id="backBtn" href="/v2.html" aria-label="Our note로 돌아가기">← 노트</a>
  </header>

  <div class="sec">일시</div>
  <div class="trips" id="trips" role="tablist" aria-label="저장된 코스"></div>
  <button class="when" id="whenBtn" type="button" aria-label="날짜 고르기">
    <span>📅</span><span class="d" id="whenText"></span><span class="n" id="whenNights" hidden></span>
  </button>
  <div class="days" id="days" hidden></div>

  <div class="sec">지도</div>
  <div class="mapbox">
    <div id="map"></div>
    <div class="mapmsg" id="mapMsg">지도를 불러오는 중…</div>
    <div class="maphint" id="mapHint" hidden>장소를 추가하면 여기에 코스가 그려져요</div>
    <button class="locbtn" id="locBtn" type="button" aria-label="현위치">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8" opacity=".35"/></svg>
    </button>
  </div>

  <div class="sec">코스</div>
  <div class="stops" id="stops"></div>
  <div class="addbar">
    <button class="addbtn" id="addBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      추가하기
    </button>
  </div>
  <button type="button" class="dangerlink" id="delTrip">이 코스 지우기</button>
  <div class="confirm" id="delConfirm" hidden><span>이 코스를 통째로 지울까요?</span>
    <button type="button" class="btn" id="delNo">아니요</button>
    <button type="button" class="btn pri" id="delYes">지우기</button></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });

  var KAKAO_JS_KEY = 'fdb9bb9ef9a347bf4b1c4a08e9f00fcf';
  var TRIPS_KEY = 'ournote:courses';
  var OLD_KEY = 'ournote:course';
  var ITEMS_KEY = 'ournote:items';
  var GEO_KEY = 'ournote:geo';
  var COLORS = ['#e3829f', '#f0b45c', '#7cc59a', '#7fb3e0', '#b99be8', '#f08a6c', '#5fc0bb', '#d98cc9'];
  var WEEK = ['일', '월', '화', '수', '목', '금', '토'];

  // ---------- 저장 ----------
  function readJSON(key, fallback) {
    try {
      var v = JSON.parse(localStorage.getItem(key));
      return v === null || v === undefined ? fallback : v;
    } catch (e) {
      return fallback;
    }
  }
  function writeJSON(key, v) {
    try { localStorage.setItem(key, JSON.stringify(v)); return true; } catch (e) { return false; }
  }
  function uid() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }

  // 코스는 날짜(여행 기간)마다 따로 저장: { trips: [{ id, start, end, stops: [{…, day}] }], current }
  var store = readJSON(TRIPS_KEY, null);
  if (!store || !Array.isArray(store.trips)) {
    store = { trips: [], current: '' };
    var old = readJSON(OLD_KEY, null); // 예전 한 개짜리 코스 옮기기
    if (old && Array.isArray(old.stops) && (old.stops.length || old.date)) {
      var t0 = { id: uid(), start: old.date || '', end: old.date || '', stops: old.stops.map(function (s) { s.day = 0; return s; }) };
      store.trips.push(t0);
      store.current = t0.id;
    }
  }
  store.trips.forEach(function (t) {
    if (!Array.isArray(t.stops)) t.stops = [];
    if (!t.end) t.end = t.start;
  });
  var geo = readJSON(GEO_KEY, {});
  if (!geo || typeof geo !== 'object') geo = {};
  var trip = null, dayIdx = 0;

  function save() { writeJSON(TRIPS_KEY, store); }

  // ---------- 날짜 유틸 ----------
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return ymd(d); }
  function nightsOf(t) { return t.start && t.end ? Math.round((parse(t.end) - parse(t.start)) / 86400000) : 0; }
  function md(s) { var d = parse(s); return (d.getMonth() + 1) + '.' + d.getDate(); }
  function mdw(s) { var d = parse(s); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + WEEK[d.getDay()] + ')'; }
  function nightsLabel(n) { return n > 0 ? n + '박 ' + (n + 1) + '일' : '당일'; }
  function tripLabel(t) {
    if (!t.start) return '날짜 없음';
    var n = nightsOf(t);
    return n ? md(t.start) + '–' + md(t.end) + ' · ' + nightsLabel(n) : md(t.start) + ' (' + WEEK[parse(t.start).getDay()] + ')';
  }
  function sortTrips() {
    store.trips.sort(function (a, b) {
      if (!a.start) return 1;
      if (!b.start) return -1;
      return a.start < b.start ? -1 : a.start > b.start ? 1 : 0;
    });
  }

  // ---------- 기타 유틸 ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function hm(min) { min = ((min % 1440) + 1440) % 1440; return pad(Math.floor(min / 60)) + ':' + pad(min % 60); }
  function span(s, e) { return ((e - s) % 1440 + 1440) % 1440; }
  function durText(m) {
    var h = Math.floor(m / 60), r = m % 60;
    return (h ? h + '시간' : '') + (r ? (h ? ' ' : '') + r + '분' : '');
  }
  function hasTime(st) { return typeof st.start === 'number' && typeof st.end === 'number' && st.start !== st.end; }
  function distKm(a, b) {
    var R = 6371, t = Math.PI / 180;
    var dLat = (b.lat - a.lat) * t, dLng = (b.lng - a.lng) * t;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a.lat * t) * Math.cos(b.lat * t) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  function dayStops() { return trip ? trip.stops.filter(function (s) { return (s.day || 0) === dayIdx; }) : []; }
  function nextColor() {
    var used = {};
    dayStops().forEach(function (s) { used[s.color] = (used[s.color] || 0) + 1; });
    var best = COLORS[0], n = Infinity;
    COLORS.forEach(function (c) { if ((used[c] || 0) < n) { n = used[c] || 0; best = c; } });
    return best;
  }
  // 시간이 있으면 시작 시간 순, 없으면 넣은 순서대로 뒤에
  function ordered() {
    var list = dayStops();
    return list.filter(hasTime).sort(function (a, b) { return a.start - b.start; })
      .concat(list.filter(function (s) { return !hasTime(s); }));
  }

  // ---------- 1. 일시 ----------
  function selectTrip(id) {
    trip = store.trips.find(function (t) { return t.id === id; }) || null;
    store.current = trip ? trip.id : '';
    dayIdx = 0;
    save();
    renderAll(true);
  }
  function ensureTrip() {
    if (trip) return trip;
    trip = { id: uid(), start: '', end: '', stops: [] };
    store.trips.push(trip);
    store.current = trip.id;
    save();
    return trip;
  }

  function renderTrips() {
    sortTrips();
    var el = document.getElementById('trips');
    if (!store.trips.length) { el.hidden = true; return; }
    el.hidden = false;
    el.innerHTML = store.trips.map(function (t) {
      return '<button type="button" class="trip" data-trip="' + esc(t.id) + '" aria-pressed="' + (trip === t) + '">' + esc(tripLabel(t)) +
        (t.stops.length ? ' · ' + t.stops.length + '곳' : '') + '</button>';
    }).join('') + '<button type="button" class="trip new" data-new>+ 새 코스</button>';
    var cur = el.querySelector('[aria-pressed="true"]');
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }
  function renderWhen() {
    var t = trip || { start: '', end: '' };
    var txt = document.getElementById('whenText');
    var nn = document.getElementById('whenNights');
    if (!t.start) {
      txt.textContent = '날짜 고르기 (안 골라도 돼요)';
      txt.className = 'd none';
      nn.hidden = true;
    } else {
      var n = nightsOf(t);
      var sameMonth = parse(t.end).getMonth() === parse(t.start).getMonth();
      txt.textContent = n ? mdw(t.start) + ' – ' + (sameMonth ? mdw(t.end).replace(/^\d+월 /, '') : mdw(t.end)) : mdw(t.start);
      txt.className = 'd';
      nn.textContent = nightsLabel(n);
      nn.hidden = false;
    }
    var days = document.getElementById('days');
    var n2 = trip ? nightsOf(trip) : 0;
    if (!n2) { days.hidden = true; days.innerHTML = ''; return; }
    days.hidden = false;
    var html = '';
    for (var i = 0; i <= n2; i++) {
      var dstr = addDays(trip.start, i);
      var cnt = trip.stops.filter(function (s) { return (s.day || 0) === i; }).length;
      html += '<button type="button" class="day" data-day="' + i + '" aria-pressed="' + (i === dayIdx) + '"><b>' + (i + 1) + '일차</b>' + md(dstr) + (cnt ? ' · ' + cnt : '') + '</button>';
    }
    days.innerHTML = html;
  }

  document.getElementById('trips').addEventListener('click', function (e) {
    var t = e.target.closest('[data-trip]');
    if (t) { selectTrip(t.getAttribute('data-trip')); return; }
    if (e.target.closest('[data-new]')) openCalendar(true);
  });
  document.getElementById('whenBtn').addEventListener('click', function () { openCalendar(false); });
  document.getElementById('days').addEventListener('click', function (e) {
    var d = e.target.closest('[data-day]');
    if (!d) return;
    dayIdx = Number(d.getAttribute('data-day'));
    renderWhen();
    renderStops();
    drawMap(true);
  });

  // 달력: 첫 번째 탭 = 시작일, 두 번째 탭 = 마지막 날(연박)
  function openCalendar(isNew) {
    var base = !isNew && trip ? trip : { start: '', end: '' };
    var sel = { start: base.start || '', end: base.end || base.start || '' };
    var picking = sel.start && sel.end && sel.start !== sel.end ? 'start' : (sel.start ? 'end' : 'start');
    var shown = sel.start ? parse(sel.start) : new Date();
    shown = new Date(shown.getFullYear(), shown.getMonth(), 1);
    var today = ymd(new Date());
    var tripDays = {};
    store.trips.forEach(function (t) {
      if (!t.start) return;
      for (var i = 0; i <= nightsOf(t); i++) tripDays[addDays(t.start, i)] = true;
    });

    var html = '<h2>' + (isNew ? '새 코스 날짜' : '날짜 고르기') + '</h2>' +
      '<div class="cal-head"><button type="button" data-mv="-1" aria-label="이전 달">‹</button><b data-title></b><button type="button" data-mv="1" aria-label="다음 달">›</button></div>' +
      '<div class="cal" data-cal></div>' +
      '<div class="calsum" data-sum></div>' +
      '<div class="acts"><button type="button" class="btn ghost" data-act="nodate">날짜 없이</button><span class="sp"></span>' +
      '<button type="button" class="btn" data-act="close">닫기</button>' +
      '<button type="button" class="btn pri" data-act="ok">확인</button></div>';

    openSheet(html, function (bs) {
      function paint() {
        bs.querySelector('[data-title]').textContent = shown.getFullYear() + '년 ' + (shown.getMonth() + 1) + '월';
        var first = shown.getDay();
        var dim = new Date(shown.getFullYear(), shown.getMonth() + 1, 0).getDate();
        var h = WEEK.map(function (w) { return '<div class="w">' + w + '</div>'; }).join('');
        for (var i = 0; i < first; i++) h += '<button type="button" class="cd out" tabindex="-1"></button>';
        for (var d = 1; d <= dim; d++) {
          var s = ymd(new Date(shown.getFullYear(), shown.getMonth(), d));
          var cls = ['cd'];
          if (new Date(shown.getFullYear(), shown.getMonth(), d).getDay() === 0) cls.push('sun');
          if (s === today) cls.push('today');
          if (tripDays[s]) cls.push('has');
          if (sel.start && s === sel.start) cls.push('s');
          if (sel.end && s === sel.end) cls.push('e');
          if (sel.start && sel.end && s > sel.start && s < sel.end) cls.push('in');
          h += '<button type="button" class="' + cls.join(' ') + '" data-d="' + s + '"><span>' + d + '</span></button>';
        }
        bs.querySelector('[data-cal]').innerHTML = h;
        var sum = bs.querySelector('[data-sum]');
        if (!sel.start) sum.innerHTML = '<small>시작하는 날을 눌러주세요</small>';
        else {
          var n = Math.round((parse(sel.end) - parse(sel.start)) / 86400000);
          sum.innerHTML = (n ? mdw(sel.start) + ' – ' + mdw(sel.end) + ' · ' + nightsLabel(n) : mdw(sel.start) + ' · 당일') +
            '<small>' + (picking === 'end' ? '연박이면 마지막 날을 한 번 더 눌러주세요' : '다른 날을 누르면 처음부터 다시 골라요') + '</small>';
        }
      }
      bs.addEventListener('click', function (e) {
        var mv = e.target.closest('[data-mv]');
        if (mv) { shown = new Date(shown.getFullYear(), shown.getMonth() + Number(mv.getAttribute('data-mv')), 1); paint(); return; }
        var c = e.target.closest('[data-d]');
        if (c) {
          var s = c.getAttribute('data-d');
          if (picking === 'start' || s < sel.start) {
            sel.start = s; sel.end = s; picking = 'end';
          } else {
            sel.end = s;
            if (Math.round((parse(sel.end) - parse(sel.start)) / 86400000) > 13) { sel.end = addDays(sel.start, 13); toast('최대 13박까지 고를 수 있어요'); }
            picking = 'start';
          }
          paint();
          return;
        }
        var a = e.target.closest('[data-act]');
        if (!a) return;
        var act = a.getAttribute('data-act');
        if (act === 'close') closeSheet();
        else if (act === 'nodate') applyDates('', '', isNew);
        else if (act === 'ok') {
          if (!sel.start) { toast('날짜를 골라주세요'); return; }
          applyDates(sel.start, sel.end || sel.start, isNew);
        }
      });
      paint();
    });
  }

  function applyDates(start, end, isNew) {
    // 같은 날짜(기간)의 코스가 이미 있으면 그걸 연다
    var same = store.trips.find(function (t) { return t.start === start && t.end === end && t !== (isNew ? null : trip); });
    if (same && (isNew || !trip || !trip.stops.length)) {
      if (!isNew && trip && !trip.stops.length) store.trips = store.trips.filter(function (t) { return t !== trip; });
      closeSheet();
      selectTrip(same.id);
      toast('이미 있는 코스를 열었어요');
      return;
    }
    if (isNew || !trip) {
      trip = { id: uid(), start: start, end: end, stops: [] };
      store.trips.push(trip);
    } else {
      trip.start = start;
      trip.end = end;
      var last = nightsOf(trip);
      trip.stops.forEach(function (s) { if ((s.day || 0) > last) s.day = last; }); // 줄어든 날의 장소는 마지막 날로
    }
    store.current = trip.id;
    dayIdx = Math.min(dayIdx, nightsOf(trip));
    if (isNew) dayIdx = 0;
    save();
    closeSheet();
    renderAll(true);
  }

  // 코스 지우기
  var delConfirm = document.getElementById('delConfirm');
  document.getElementById('delTrip').addEventListener('click', function () { delConfirm.hidden = false; delConfirm.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); });
  document.getElementById('delNo').addEventListener('click', function () { delConfirm.hidden = true; });
  document.getElementById('delYes').addEventListener('click', function () {
    if (trip) store.trips = store.trips.filter(function (t) { return t !== trip; });
    delConfirm.hidden = true;
    sortTrips();
    selectTrip(store.trips[0] ? store.trips[0].id : '');
    toast('코스를 지웠어요');
  });

  // ---------- 일정 사이 이동 ----------
  // 이동 정보는 '도착하는 장소'에 붙임: st.move = { mode, min(직접 적은 분, 없으면 어림), memo }
  var MODES = [
    { id: 'walk', ic: '🚶', name: '도보', kmh: 4.5, detour: 1.3, extra: 0, kakao: 'walk', line: 'shortdot' },
    { id: 'car', ic: '🚗', name: '자차', kmh: 32, detour: 1.35, extra: 5, kakao: 'car', line: 'solid' },
    { id: 'taxi', ic: '🚕', name: '택시', kmh: 32, detour: 1.35, extra: 5, kakao: 'car', line: 'solid' },
    { id: 'bus', ic: '🚌', name: '버스', kmh: 18, detour: 1.4, extra: 8, kakao: 'traffic', line: 'dash' },
    { id: 'subway', ic: '🚇', name: '지하철', kmh: 30, detour: 1.3, extra: 10, kakao: 'traffic', line: 'dash' },
    { id: 'train', ic: '🚆', name: '기차', kmh: 110, detour: 1.2, extra: 20, kakao: 'traffic', line: 'longdash' },
    { id: 'plane', ic: '✈️', name: '비행기', kmh: 600, detour: 1, extra: 90, kakao: '', line: 'shortdash' },
    { id: 'bike', ic: '🚲', name: '자전거', kmh: 14, detour: 1.3, extra: 0, kakao: 'bicycle', line: 'shortdot' },
    { id: 'ship', ic: '⛴️', name: '배', kmh: 30, detour: 1.2, extra: 20, kakao: '', line: 'dash' }
  ];
  var MODE = {};
  MODES.forEach(function (m) { MODE[m.id] = m; });
  function estimateMin(modeId, km) {
    var m = MODE[modeId];
    if (!m || km == null) return null;
    var v = km * m.detour / m.kmh * 60 + m.extra;
    return Math.max(5, Math.round(v / 5) * 5);
  }
  function suggestMode(km) {
    if (km == null) return null;
    if (km < 1.2) return 'walk';
    if (km < 60) return 'car';
    if (km < 350) return 'train';
    return 'plane';
  }
  function legKm(a, b) { return a.lat != null && b.lat != null ? distKm(a, b) : null; }
  function fmtKm(km) { return km < 1 ? Math.round(km * 1000) + 'm' : km.toFixed(km < 10 ? 1 : 0) + 'km'; }
  function minText(m) { return m >= 60 ? Math.floor(m / 60) + '시간' + (m % 60 ? ' ' + (m % 60) + '분' : '') : m + '분'; }
  function legInfo(prev, cur) {
    var km = legKm(prev, cur);
    var mv = cur.move || null;
    var mode = mv && MODE[mv.mode] ? mv.mode : null;
    var ignored = !!(mv && mv.noTime);
    var min = mv && typeof mv.min === 'number' ? mv.min : (mode ? estimateMin(mode, km) : null);
    var free = hasTime(prev) && hasTime(cur) ? span(prev.end, cur.start) : null;
    return { km: km, mode: mode, min: min, ignored: ignored, manual: !!(mv && typeof mv.min === 'number'), free: free, memo: mv && mv.memo || '', suggest: mode ? null : suggestMode(km) };
  }
  function legHtml(prev, cur) {
    var L = legInfo(prev, cur);
    var bits = [];
    if (L.mode) bits.push('<b>' + MODE[L.mode].ic + ' ' + MODE[L.mode].name + '</b>');
    else bits.push('<span class="sugg">' + (L.suggest ? MODE[L.suggest].ic + ' ' + MODE[L.suggest].name + '?' : '＋ 이동 방법') + '</span>');
    if (L.km != null) bits.push(fmtKm(L.km));
    if (L.min != null) bits.push((L.manual ? '' : '약 ') + minText(L.min));
    var warn = '';
    if (!L.ignored && L.free != null && L.min != null) { // 무시면 여유/부족만 안 보여줌
      var diff = L.free - L.min;
      warn = diff >= 0 ? '<span class="ok">' + (diff === 0 ? '딱 맞아요' : '여유 ' + minText(diff)) + '</span>'
        : '<span class="bad">⚠️ ' + minText(-diff) + ' 부족</span>';
    }
    return '<div class="legwrap"><button type="button" class="legpill' + (L.mode ? ' set' : '') + '" data-leg="' + esc(cur.id) + '">' +
      bits.join('<i>·</i>') + (warn ? '<i>·</i>' + warn : '') + '</button>' +
      (L.memo ? '<div class="legmemo">' + esc(L.memo) + '</div>' : '') + '</div>';
  }
  function kakaoName(s) { return String(s || '장소').replace(/[,/]/g, ' ').slice(0, 40); }

  function openLeg(prev, cur, idx) {
    var L = legInfo(prev, cur);
    var sel = L.mode;
    var html = '<h2>' + (idx) + ' → ' + (idx + 1) + ' 어떻게 갈까요?</h2>' +
      '<div class="hint">' + esc(prev.title) + ' → ' + esc(cur.title) + (L.km != null ? ' · 직선 ' + fmtKm(L.km) : '') + '</div>' +
      '<div class="modes">' + MODES.map(function (m) {
        return '<button type="button" class="mode" data-mode="' + m.id + '" aria-pressed="' + (m.id === sel) + '"><span>' + m.ic + '</span>' + m.name + '</button>';
      }).join('') + '</div>' +
      '<div class="legrow" data-timerow><label for="lmin">걸리는 시간</label><input id="lmin" type="number" inputmode="numeric" min="0" step="5" placeholder="' + (L.min != null ? L.min : '') + '" value="' + (L.manual && cur.move ? cur.move.min : '') + '"><span>분</span>' +
        '<span class="est" data-est>' + (sel && L.km != null ? '어림 약 ' + minText(estimateMin(sel, L.km)) : '') + '</span>' +
        '<button type="button" class="ignorebtn" data-act="ignore" aria-pressed="' + L.ignored + '" title="여유·부족 표시 안 하기">무시</button></div>' +
      '<div class="legrow"><label for="lmemo">메모</label><input id="lmemo" type="text" placeholder="예) KTX 10:30 서울역 출발, ○○공영주차장" value="' + esc(L.memo) + '" autocomplete="off"></div>' +
      '<button type="button" class="routebtn" data-act="route"' + (prev.lat == null || cur.lat == null ? ' disabled' : '') + '>🧭 카카오맵 길찾기</button>' +
      (prev.lat == null || cur.lat == null ? '<div class="hint" style="text-align:center">두 곳 모두 주소가 있어야 길찾기를 열 수 있어요</div>' : '') +
      '<div class="acts"><button type="button" class="btn del" data-act="clear">지우기</button><span class="sp"></span>' +
      '<button type="button" class="btn" data-act="close">닫기</button>' +
      '<button type="button" class="btn pri" data-act="save">저장</button></div>';
    openSheet(html, function (bs) {
      var est = bs.querySelector('[data-est]');
      var minIn = bs.querySelector('#lmin');
      var ignore = L.ignored;
      function refreshEst() {
        var e = sel ? estimateMin(sel, L.km) : null;
        est.textContent = e != null ? '어림 약 ' + minText(e) : (sel ? '거리를 몰라 직접 적어주세요' : '');
        minIn.placeholder = e != null ? String(e) : '';
      }
      bs.addEventListener('click', function (e) {
        var mb = e.target.closest('[data-mode]');
        if (mb) {
          sel = mb.getAttribute('data-mode');
          bs.querySelectorAll('[data-mode]').forEach(function (b) { b.setAttribute('aria-pressed', String(b === mb)); });
          refreshEst();
          return;
        }
        var a = e.target.closest('[data-act]');
        if (!a) return;
        var act = a.getAttribute('data-act');
        if (act === 'close') closeSheet();
        else if (act === 'ignore') {
          ignore = !ignore;
          a.setAttribute('aria-pressed', String(ignore));

        }
        else if (act === 'route') {
          var m = MODE[sel || L.suggest || 'car'];
          var by = m && m.kakao ? m.kakao : 'traffic';
          var url = 'https://map.kakao.com/link/by/' + by + '/' + encodeURIComponent(kakaoName(prev.title)) + ',' + prev.lat + ',' + prev.lng +
            '/' + encodeURIComponent(kakaoName(cur.title)) + ',' + cur.lat + ',' + cur.lng;
          window.open(url, '_blank', 'noopener');
        }
        else if (act === 'clear') {
          delete cur.move;
          save();
          closeSheet();
          renderAll(false);
        }
        else if (act === 'save') {
          var v = minIn.value.trim();
          var memo = bs.querySelector('#lmemo').value.trim();
          if (!sel && !v && !memo && !ignore) { delete cur.move; }
          else {
            cur.move = { mode: sel || '', memo: memo };
            if (v !== '' && isFinite(Number(v))) cur.move.min = Math.max(0, Math.round(Number(v)));
            if (ignore) cur.move.noTime = true; // 시간 딱딱 안 맞춰도 되는 구간
          }
          save();
          closeSheet();
          renderAll(false);
        }
      });
    });
  }

  // ---------- 3. 코스 목록 ----------
  function renderStops() {
    var list = ordered();
    var el = document.getElementById('stops');
    document.getElementById('delTrip').hidden = !trip;
    if (!list.length) {
      el.innerHTML = '<div class="empty">' + (trip && nightsOf(trip) ? (dayIdx + 1) + '일차 코스가 비어 있어요.' : '아직 코스가 비어 있어요.') + ' 아래 ‘추가하기’로 갈 곳을 넣어보세요.</div>';
      return;
    }
    var html = '';
    list.forEach(function (st, i) {
      if (i > 0) html += legHtml(list[i - 1], st);
      html += '<button type="button" class="stop" data-id="' + esc(st.id) + '">' +
        '<span class="num" style="background:' + esc(st.color) + '">' + (i + 1) + '</span>' +
        '<span class="tx"><span class="tt">' + esc(st.title) + '</span>' +
        (st.place ? '<span class="mm" style="display:block">📍 ' + esc(st.place) + '</span>' : '<span class="mm noaddr" style="display:block">📍 주소 없음 · 눌러서 추가</span>') + '</span>' +
        (hasTime(st) ? '<span class="tm">' + hm(st.start) + '–' + hm(st.end) + '<small>' + durText(span(st.start, st.end)) + '</small></span>' : '') +
        '</button>';
    });
    el.innerHTML = html;
  }
  document.getElementById('stops').addEventListener('click', function (e) {
    var lg = e.target.closest('[data-leg]');
    if (lg && trip) {
      var list = ordered();
      var j = list.findIndex(function (s) { return s.id === lg.getAttribute('data-leg'); });
      if (j > 0) openLeg(list[j - 1], list[j], j);
      return;
    }
    var b = e.target.closest('.stop');
    if (!b || !trip) return;
    var st = trip.stops.find(function (s) { return s.id === b.getAttribute('data-id'); });
    if (st) openStop(st);
  });

  function renderAll(fit) {
    renderTrips();
    renderWhen();
    renderStops();
    drawMap(fit);
  }

  // ---------- 2. 지도 ----------
  var map = null, kakaoReady = false, overlays = [], line = null, geocoder = null, places = null;

  function loadKakao() {
    var s = document.createElement('script');
    s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + KAKAO_JS_KEY + '&libraries=services&autoload=false';
    s.onload = function () {
      if (!window.kakao || !window.kakao.maps || typeof window.kakao.maps.load !== 'function') { mapFail(); return; }
      window.kakao.maps.load(initMap);
    };
    s.onerror = mapFail;
    document.head.appendChild(s);
  }
  function mapFail() {
    document.getElementById('mapMsg').textContent = navigator.onLine === false ? '인터넷에 연결되면 지도가 보여요.' : '지도를 불러오지 못했어요.';
  }
  function initMap() {
    var k = window.kakao;
    try {
      map = new k.maps.Map(document.getElementById('map'), { center: new k.maps.LatLng(37.5446, 127.0379), level: 7 });
      enableOneFingerZoom(map, document.getElementById('map'));
    } catch (e) { mapFail(); return; }
    geocoder = new k.maps.services.Geocoder();
    places = new k.maps.services.Places();
    document.getElementById('mapMsg').hidden = true;
    kakaoReady = true;
    var pending = [];
    store.trips.forEach(function (t) { t.stops.forEach(function (s) { if (s.lat == null && s.place) pending.push(s); }); });
    var left = pending.length;
    if (!left) { drawMap(true); return; }
    pending.forEach(function (st) {
      locate(st.place, function (c) {
        if (c) { st.lat = c.lat; st.lng = c.lng; }
        left -= 1;
        if (!left) { save(); renderStops(); drawMap(true); }
      });
    });
  }
  function locate(addr, cb) {
    if (geo[addr]) { cb(geo[addr]); return; }
    if (!kakaoReady) { cb(null); return; }
    var OK = window.kakao.maps.services.Status.OK;
    geocoder.addressSearch(addr, function (r, st) {
      if (st === OK && r[0]) return done({ lat: Number(r[0].y), lng: Number(r[0].x) });
      places.keywordSearch(addr, function (r2, st2) {
        done(st2 === OK && r2[0] ? { lat: Number(r2[0].y), lng: Number(r2[0].x) } : null);
      });
    });
    function done(c) {
      if (c) { geo[addr] = c; writeJSON(GEO_KEY, geo); }
      cb(c);
    }
  }
  function drawMap(fit) {
    if (!kakaoReady) return;
    var k = window.kakao;
    overlays.forEach(function (o) { o.setMap(null); });
    overlays = [];
    if (line) { line.forEach(function (l) { l.setMap(null); }); line = null; }
    var path = [], located = [];
    ordered().forEach(function (st, i) {
      if (st.lat == null) return;
      var pos = new k.maps.LatLng(st.lat, st.lng);
      path.push(pos);
      located.push(st);
      var el = document.createElement('div');
      el.className = 'pin';
      el.style.background = st.color;
      el.textContent = String(i + 1);
      el.title = st.title;
      el.addEventListener('click', function () { openStop(st); });
      var ov = new k.maps.CustomOverlay({ position: pos, content: el, yAnchor: 0.5, clickable: true, zIndex: 10 + i });
      ov.setMap(map);
      overlays.push(ov);
    });
    // 장소 사이 선: 이동 수단마다 모양을 다르게, 가운데에 수단 아이콘
    line = [];
    for (var j = 1; j < located.length; j++) {
      var a = located[j - 1], b2 = located[j];
      var mv = b2.move && MODE[b2.move.mode] ? MODE[b2.move.mode] : null;
      var seg = [new k.maps.LatLng(a.lat, a.lng)];
      if (mv && (mv.id === 'plane' || mv.id === 'train' || mv.id === 'ship')) {
        // 먼 이동은 부드러운 곡선
        var dx = b2.lng - a.lng, dy = b2.lat - a.lat;
        var cx = (a.lng + b2.lng) / 2 - dy * 0.18, cy = (a.lat + b2.lat) / 2 + dx * 0.18;
        for (var t = 1; t < 16; t++) {
          var u = t / 16;
          seg.push(new k.maps.LatLng((1 - u) * (1 - u) * a.lat + 2 * (1 - u) * u * cy + u * u * b2.lat, (1 - u) * (1 - u) * a.lng + 2 * (1 - u) * u * cx + u * u * b2.lng));
        }
      }
      seg.push(new k.maps.LatLng(b2.lat, b2.lng));
      var pl = new k.maps.Polyline({
        path: seg,
        strokeWeight: mv ? 4 : 3,
        strokeColor: '#b5476a',
        strokeOpacity: mv ? 0.8 : 0.5,
        strokeStyle: mv ? mv.line : 'shortdash'
      });
      pl.setMap(map);
      line.push(pl);
      if (mv) {
        var mid = seg[Math.floor(seg.length / 2)];
        if (seg.length === 2) mid = new k.maps.LatLng((a.lat + b2.lat) / 2, (a.lng + b2.lng) / 2);
        var badge = document.createElement('div');
        badge.className = 'modebadge';
        badge.textContent = mv.ic;
        var mo = new k.maps.CustomOverlay({ position: mid, content: badge, yAnchor: 0.5, zIndex: 5 });
        mo.setMap(map);
        overlays.push(mo);
      }
    }
    document.getElementById('mapHint').hidden = path.length > 0;
    if (fit && path.length) {
      if (path.length === 1) { map.setLevel(4); map.setCenter(path[0]); }
      else {
        var b = new k.maps.LatLngBounds();
        path.forEach(function (p) { b.extend(p); });
        map.setBounds(b, 50, 40, 50, 40);
      }
    }
  }


  // ---------- 현위치 (카카오 웹 지도엔 기본 버튼이 없어 직접 만듦) ----------
  // 내 위치 (검색을 가까운 순으로 정렬할 때도 씀). 5분 안에 받은 위치는 다시 묻지 않음
  var myPos = null;
  function getMyPos(cb) {
    if (myPos && Date.now() - myPos.t < 300000) { cb(myPos); return; }
    if (!navigator.geolocation) { cb(null); return; }
    var done = false;
    var timer = setTimeout(function () { if (!done) { done = true; cb(null); } }, 6000);
    navigator.geolocation.getCurrentPosition(function (pos) {
      if (done) return;
      done = true; clearTimeout(timer);
      myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude, t: Date.now() };
      cb(myPos);
    }, function () {
      if (done) return;
      done = true; clearTimeout(timer);
      cb(null);
    }, { enableHighAccuracy: false, timeout: 5000, maximumAge: 300000 });
  }

  function setupLocate(getMap, notify) {
    var btn = document.getElementById('locBtn');
    var me = null, ring = null;
    btn.addEventListener('click', function () {
      var m = getMap();
      if (!m || !window.kakao) { notify('지도가 아직 준비되지 않았어요'); return; }
      if (!navigator.geolocation) { notify('이 기기에서는 현위치를 쓸 수 없어요'); return; }
      btn.classList.add('busy');
      navigator.geolocation.getCurrentPosition(function (pos) {
        myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude, t: Date.now() };
        btn.classList.remove('busy');
        btn.classList.add('on');
        var k = window.kakao;
        var ll = new k.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
        if (!me) {
          var dot = document.createElement('div');
          dot.className = 'me';
          me = new k.maps.CustomOverlay({ position: ll, content: dot, xAnchor: 0.5, yAnchor: 0.5, zIndex: 5 });
          me.setMap(m);
        } else {
          me.setPosition(ll);
        }
        var acc = pos.coords.accuracy;
        if (ring) { ring.setMap(null); ring = null; }
        if (acc && acc < 1500) {
          ring = new k.maps.Circle({ center: ll, radius: acc, strokeWeight: 1, strokeColor: '#3b82f6', strokeOpacity: 0.35, fillColor: '#3b82f6', fillOpacity: 0.08 });
          ring.setMap(m);
        }
        if (m.getLevel() > 5) m.setLevel(4);
        m.panTo(ll);
      }, function (err) {
        btn.classList.remove('busy');
        notify(err && err.code === 1 ? '위치 권한을 허용해 주세요 (설정 → 개인정보 보호 → 위치 서비스)' : '현위치를 찾지 못했어요');
      }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
    });
  }


  // ---------- 한 손가락 확대·축소: 두 번 탭한 채로 위로 끌면 확대, 아래로 끌면 축소 ----------
  function enableOneFingerZoom(m, el) {
    var lastTapEnd = 0, lastX = 0, lastY = 0;
    var downAt = 0, downX = 0, downY = 0, wasTap = true;
    var zooming = false, startY = 0, startLevel = 0, anchor = null, moved = false;
    var ox = 0, oy = 0;          // 확대 기준점 (지도 안 좌표)
    var committed = 0;           // 지도에 실제로 반영한 단계 변화
    var desired = 0;             // 손가락이 원하는 단계 변화 (소수)
    var STEP = 70;               // 이만큼(px) 끌면 한 단계(2배)
    var MIN = 1, MAX = 14;
    function stop(e) { e.preventDefault(); e.stopPropagation(); }
    function setScale(v, animate) {
      el.style.transition = animate ? 'transform .18s ease-out' : 'none';
      el.style.transformOrigin = ox + 'px ' + oy + 'px';
      el.style.transform = v === 1 ? '' : 'scale(' + v.toFixed(4) + ')';
    }
    function applyLevel(delta) {
      m.setLevel(startLevel + delta, anchor ? { anchor: anchor } : undefined);
    }
    el.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) { return; }
      var t = e.touches[0], now = Date.now();
      if (now - lastTapEnd < 320 && Math.abs(t.clientX - lastX) < 40 && Math.abs(t.clientY - lastY) < 40) {
        zooming = true;
        moved = false;
        startY = t.clientY;
        startLevel = m.getLevel();
        committed = 0;
        desired = 0;
        var r = el.getBoundingClientRect();
        ox = t.clientX - r.left;
        oy = t.clientY - r.top;
        anchor = null;
        try { anchor = m.getProjection().coordsFromContainerPoint(new window.kakao.maps.Point(ox, oy)); } catch (err) { anchor = null; }
        m.setDraggable(false);
        stop(e);
        return;
      }
      downAt = now; downX = t.clientX; downY = t.clientY; wasTap = true;
    }, { capture: true, passive: false });
    el.addEventListener('touchmove', function (e) {
      if (!zooming) {
        var t0 = e.touches[0];
        if (t0 && (Math.abs(t0.clientX - downX) > 10 || Math.abs(t0.clientY - downY) > 10)) wasTap = false;
        return;
      }
      stop(e);
      var dy = e.touches[0].clientY - startY;
      if (Math.abs(dy) > 6) moved = true;
      // 위로 끌면(dy<0) 단계가 작아짐 = 확대
      desired = Math.max(MIN - startLevel, Math.min(MAX - startLevel, dy / STEP));
      // 한 단계 넘게 벌어지면 지도에 반영해서 화면이 흐려지지 않게
      var target = Math.round(desired);
      if (Math.abs(desired - committed) >= 0.75 && target !== committed) {
        committed = target;
        applyLevel(committed);
      }
      setScale(Math.pow(2, committed - desired), false);
    }, { capture: true, passive: false });
    function end(e) {
      if (zooming) {
        stop(e);
        zooming = false;
        lastTapEnd = 0;
        if (!moved) { // 그냥 두 번 탭 = 한 단계 확대
          setScale(1, false);
          m.setLevel(Math.max(MIN, startLevel - 1), anchor ? { anchor: anchor, animate: true } : { animate: true });
          m.setDraggable(true);
          return;
        }
        // 가장 가까운 단계로 스르르 맞춘 뒤 지도에 반영
        var fin = Math.round(desired);
        setScale(Math.pow(2, committed - fin), true);
        setTimeout(function () {
          if (fin !== committed) applyLevel(fin);
          committed = fin;
          setScale(1, false);
          m.setDraggable(true);
        }, 190);
        return;
      }
      if (wasTap && Date.now() - downAt < 250) { lastTapEnd = Date.now(); lastX = downX; lastY = downY; }
      else lastTapEnd = 0;
    }
    el.addEventListener('touchend', end, { capture: true, passive: false });
    el.addEventListener('touchcancel', end, { capture: true, passive: false });
  }

  // ---------- 바텀시트 ----------
  var stack = [];
  // 손잡이(회색 막대)나 제목을 잡고 아래로 끌어내리면 닫기
  function enableDragClose(ov, sheet) {
    var startY = 0, dy = 0, dragging = false, samples = [];
    sheet.addEventListener('pointerdown', function (e) {
      if (!e.target.closest('.grip, .grip-zone, h2')) return;
      dragging = true;
      startY = e.clientY;
      dy = 0;
      samples = [[Date.now(), 0]];
      sheet.style.transition = 'none';
      try { sheet.setPointerCapture(e.pointerId); } catch (err) { /* 없어도 됨 */ }
    });
    sheet.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      dy = Math.max(0, e.clientY - startY);
      samples.push([Date.now(), dy]);
      if (samples.length > 6) samples.shift();
      sheet.style.transform = dy ? 'translateY(' + dy + 'px)' : '';
      ov.style.opacity = String(Math.max(0.4, 1 - dy / 500));
    });
    function up() {
      if (!dragging) return;
      dragging = false;
      // 마지막 움직임의 속도로 휙 내린 것도 닫기
      var first = samples[0], now = Date.now();
      var speed = (dy - first[1]) / Math.max(1, now - first[0]);
      sheet.style.transition = '';
      ov.style.opacity = '';

  // ---------- 4. 원형 시계 (24시간, 피자 조각으로 범위) ----------
  var NS = 'http://www.w3.org/2000/svg';
  function makeClock(host, color, others, init, onChange) {
    var S = 260, C = S / 2, R = 118, IN = 44;
    var val = { start: init && hasTime(init) ? init.start : null, end: init && hasTime(init) ? init.end : null };
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + S + ' ' + S);
    svg.setAttribute('class', 'clock');
    svg.setAttribute('role', 'slider');
    svg.setAttribute('aria-label', '시간 범위: 시계를 눌러 끌어서 정해요');
    host.appendChild(svg);
    function pt(min, r) {
      var a = (min / 1440) * Math.PI * 2 - Math.PI / 2;
      return [C + Math.cos(a) * r, C + Math.sin(a) * r];
    }
    function slice(s, e, r) {
      var len = span(s, e);
      if (len === 0) return '';
      var p1 = pt(s, r), p2 = pt(s + len, r);
      return 'M' + C + ' ' + C + ' L' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2) +
        ' A' + r + ' ' + r + ' 0 ' + (len > 720 ? 1 : 0) + ' 1 ' + p2[0].toFixed(2) + ' ' + p2[1].toFixed(2) + ' Z';
    }
    function el(tag, attrs, text) {
      var n = document.createElementNS(NS, tag);
      for (var k in attrs) n.setAttribute(k, attrs[k]);
      if (text != null) n.textContent = text;
      svg.appendChild(n);
      return n;
    }
    el('circle', { cx: C, cy: C, r: R, class: 'face' });
    others.forEach(function (o) { if (hasTime(o)) el('path', { d: slice(o.start, o.end, R - 2), fill: o.color, opacity: 0.22 }); });
    var cur = el('path', { d: '', fill: color, opacity: 0.78 });
    for (var h = 0; h < 48; h++) {
      var major = h % 6 === 0;
      var a = pt(h * 30, R - 2), b = pt(h * 30, R - (h % 2 === 0 ? (major ? 12 : 8) : 4));
      el('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], class: 'tick' + (major ? ' major' : '') });
    }
    for (var n = 0; n < 24; n += 3) {
      var p = pt(n * 60, R - 24);
      el('text', { x: p[0], y: p[1], class: 'hr' }, String(n));
    }
    el('circle', { cx: C, cy: C, r: IN, class: 'mid' });
    var t1 = el('text', { x: C, y: C - 7, class: 'read' }, '');
    var t2 = el('text', { x: C, y: C + 13, class: 'read2' }, '');
    function paint() {
      if (val.start != null && val.end != null && val.start !== val.end) {
        cur.setAttribute('d', slice(val.start, val.end, R - 2));
        t1.textContent = hm(val.start) + '–' + hm(val.end);
        t2.textContent = durText(span(val.start, val.end));
      } else {
        cur.setAttribute('d', '');
        t1.textContent = '시간 없음';
        t2.textContent = '끌어서 정하기';
      }
    }
    function minAt(ev) {
      var r = svg.getBoundingClientRect();
      var x = (ev.clientX - r.left) / r.width * S - C, y = (ev.clientY - r.top) / r.height * S - C;
      var ang = Math.atan2(y, x) + Math.PI / 2;
      if (ang < 0) ang += Math.PI * 2;
      return Math.round(ang / (Math.PI * 2) * 48) % 48 * 30;
    }
    // 같은 날 다른 장소 시간과 겹치지 않게
    var occ = others.filter(hasTime).map(function (o) { return { s: o.start, len: span(o.start, o.end) }; });
    function occupiedAt(mm) { return occ.find(function (o) { return span(o.s, mm) < o.len; }); }
    function freeStart(mm) {
      for (var i = 0; i <= occ.length; i++) {
        var o = occupiedAt(mm);
        if (!o) return mm;
        mm = (o.s + o.len) % 1440; // 그 조각이 끝나는 자리부터
      }
      return null; // 빈 시간이 없음
    }
    function gapFrom(mm) {
      var g = 1440;
      occ.forEach(function (o) { var d = span(mm, o.s); if (d > 0 && d < g) g = d; });
      return g;
    }
    var dragging = false, limited = false;
    svg.addEventListener('pointerdown', function (ev) {
      ev.preventDefault();
      var m = freeStart(minAt(ev));
      if (m === null) { t2.textContent = '빈 시간이 없어요'; return; }
      svg.setPointerCapture(ev.pointerId);
      dragging = true;
      limited = false;
      val.start = m;
      val.end = m;
      paint();
    });
    svg.addEventListener('pointermove', function (ev) {
      if (!dragging) return;
      var len = span(val.start, minAt(ev));
      var max = gapFrom(val.start);
      limited = false;
      if (len > max) {
        // 반대로 조금 돌린 거면 0, 앞으로 넘친 거면 다른 일정 직전까지
        len = (1440 - len) < (len - max) ? 0 : max;
        limited = len === max;
      }
      var e = (val.start + len) % 1440;
      if (e !== val.end) { val.end = e; paint(); }
      if (limited) t2.textContent = '다음 일정 전까지';
    });
    function up() {
      if (!dragging) return;
      dragging = false;
      if (val.start === val.end) { val.start = null; val.end = null; }
      paint();
      onChange(val);
    }
    svg.addEventListener('pointerup', up);
    svg.addEventListener('pointercancel', up);
    paint();
    return { clear: function () { val.start = null; val.end = null; paint(); onChange(val); } };
  }
  function clockBlock() {
    return '<div class="clockwrap"><span class="lab">시간 (시계를 눌러 시작부터 끝까지 끌어주세요)</span>' +

      '<div class="clocknote">30분 단위 · 같은 날 다른 장소 시간은 옅게 보여요 <button type="button" class="btn ghost" data-act="clear-time">시간 지우기</button></div></div>';

  // ---------- 장소 하나: 시간 바꾸기·빼기 ----------

  function searchPlaces(q, cb) {

            cb(r2.slice(0, 5).map(function (x) {
              var road = x.road_address && x.road_address.address_name;
              return { place_name: road || x.address_name || q, road_address_name: road || '', address_name: x.address_name || q, x: x.x, y: x.y };
            }));
          } else cb([]);
        });
      }, opts);
    }
    if (!nearFirst) run(null);
    else getMyPos(run);
  }

  // ---------- 장소 하나: 주소 추가·바꾸기(지도 가운데 핀으로 맞추기), 시간 바꾸기, 빼기 ----------
  function openStop(st) {
    var time = { start: hasTime(st) ? st.start : null, end: hasTime(st) ? st.end : null };
    var others = dayStops().filter(function (s) { return s !== st; });
    var noPlace = !st.place || st.lat == null;
    var html = '<h2><span class="num" style="background:' + esc(st.color) + ';display:inline-grid;vertical-align:3px;margin-right:6px">' + (ordered().indexOf(st) + 1) + '</span>' + esc(st.title) + '</h2>' +
      '<div class="addrline" data-addrline>' +
        (st.place
          ? '<span>📍 ' + esc(st.place) + (st.lat == null ? ' <em>(지도에서 못 찾음)</em>' : '') + '</span>' +
            ' <a href="https://map.naver.com/p/search/' + encodeURIComponent(st.place) + '" target="_blank" rel="noopener">지도</a>'
          : '<span class="noaddr">지도에 표시할 주소가 없어요</span>') +
        ' <button type="button" class="linkish" data-act="addr">' + (st.place ? '주소 바꾸기' : '주소 추가') + '</button>' +
      '</div>' +
      '<div class="addrbox" data-addrbox hidden>' +
        '<div class="search"><input type="search" id="aq" placeholder="이름이나 주소로 찾기 (예: 강남역 11번 출구)" enterkeyhint="search" autocomplete="off">' +
        '<button type="button" class="btn" data-act="asearch">검색</button></div>' +
        '<div class="pick small" data-alist></div>' +
        pickerHtml(st.color) +
      '</div>' +
      clockBlock() +
      '<div class="acts"><button type="button" class="btn del" data-act="del">빼기</button><span class="sp"></span>' +
      '<button type="button" class="btn" data-act="close">닫기</button>' +
      '<button type="button" class="btn pri" data-act="save">저장</button></div>';

    openSheet(html, function (bs) {
      var clock = makeClock(bs.querySelector('[data-clock]'), st.color, others, st, function (v) { time = v; });
      var results = [];
      var addrBox = bs.querySelector('[data-addrbox]');
      var picker = makePicker(addrBox);
      function openPicker() {
        addrBox.hidden = false;
        picker.start(st.lat != null ? { lat: st.lat, lng: st.lng } : null);
      }
      function doAddrSearch() {
        var q = bs.querySelector('#aq').value.trim();
        var list = bs.querySelector('[data-alist]');
        if (!q) return;
        if (!kakaoReady) { list.innerHTML = '<div class="hint">지도를 불러오지 못해 검색할 수 없어요.</div>'; return; }
        list.innerHTML = '<div class="hint">찾는 중…</div>';
        searchPlaces(q, function (r) {
          results = r || [];
          if (!results.length) { list.innerHTML = '<div class="hint">찾지 못했어요. 지도를 직접 움직여서 골라도 돼요.</div>'; return; }
          list.innerHTML = results.map(function (p, i) {
            return '<button type="button" class="opt" data-ares="' + i + '"><div class="t">' + esc(p.place_name) + '</div>' +
              '<div class="s">' + (p.distance ? '<b class="dist">' + fmtDist(Number(p.distance)) + '</b> · ' : '') +
              esc(p.road_address_name || p.address_name || '') + '</div></button>';
          }).join('');
        });
      }

      bs.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && e.target.id === 'aq' && !e.isComposing) { e.preventDefault(); doAddrSearch(); }
      });
      if (noPlace) openPicker();

      bs.addEventListener('click', function (e) {
        var r = e.target.closest('[data-ares]');
        if (r) {
          var p = results[Number(r.getAttribute('data-ares'))];
          bs.querySelectorAll('[data-ares]').forEach(function (b) { b.setAttribute('aria-pressed', String(b === r)); });
          var nm = p.place_name && p.place_name !== (p.road_address_name || p.address_name) ? p.place_name : '';
          picker.moveTo(Number(p.y), Number(p.x), 3, nm);
          return;
        }
        var a = e.target.closest('[data-act]');
        if (!a) return;
        var act = a.getAttribute('data-act');
        if (act === 'close') closeSheet();
        else if (act === 'clear-time') clock.clear();
        else if (act === 'addr') { if (addrBox.hidden) openPicker(); else addrBox.hidden = true; }
        else if (act === 'asearch') doAddrSearch();
        else if (act === 'del') {
          trip.stops = trip.stops.filter(function (s) { return s !== st; });
          save();
          closeSheet();
          renderAll(true);
          toast('코스에서 뺐어요');
        } else if (act === 'save') {
          if (time.start != null && time.end != null && time.start !== time.end) { st.start = time.start; st.end = time.end; }
          else { delete st.start; delete st.end; }
          var moved = false;
          var g = !addrBox.hidden ? picker.get() : null;
          if (g) {
            st.place = g.name ? g.name + ' · ' + g.addr : g.addr;
            st.lat = g.lat;
            st.lng = g.lng;
            moved = true;
          }
          save();
          closeSheet();
          renderAll(moved);
          if (moved) toast('지도에 표시했어요');
        }
      });
    });
  }

  // 화면 안 뒤로가기: 앱 안에서 왔으면 진짜 뒤로가기(기록 한 칸 빼기),
  // 바로 열었으면 기록을 남기지 않고 바꿔치기 → 스와이프 뒤로가기로 방금 화면이 다시 나오지 않음
  function goBackTo(href) {
    function norm(p) { return p === '/index.html' ? '/' : p; }
    var prev = '';
    try { prev = document.referrer ? norm(new URL(document.referrer).pathname) : ''; } catch (e) { prev = ''; }
    var sameSite = false;
    try { sameSite = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch (e) { sameSite = false; }
    // 앱 안 다른 화면(예: Ver.2에서 지도)에서 왔어도 그 화면으로 돌아감
    if (sameSite && prev && history.length > 1) history.back();
    else location.replace(href);
  }

  // ---------- 뒤로 ----------
  document.getElementById('backBtn').addEventListener('click', function (e) {
    if (e.metaKey || e.ctrlKey) return;
    e.preventDefault();
    var href = this.getAttribute('href');
    document.body.classList.add('switching');
    setTimeout(function () { goBackTo(href); }, 120);
  });
  window.addEventListener('pageshow', function () { document.body.classList.remove('switching'); });

  trip = store.trips.find(function (t) { return t.id === store.current; }) || store.trips[0] || null;
  renderAll(false);
  loadKakao();
  setupLocate(function () { return kakaoReady ? map : null; }, toast);

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('/sw.js').catch(function () {});
  }
})();
</script>
