<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>데이트코스 지도 · 우리 약속 노트</title>
<meta name="theme-color" content="#b5476a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="약속 노트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://dapi.kakao.com">
<link rel="preconnect" href="https://t1.daumcdn.net">
<link rel="dns-prefetch" href="https://map.daumcdn.net">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #f7f3f4;
    --paper: #fff;
    --ink: #2b2230;
    --muted: #7d6f7a;
    --line: #e8dfe3;
    --rose: #b5476a;
    --rose-soft: #f6e3ea;
    --plum: #4a2f45;
    --ok: #3f7a5a;
    --ok-soft: #e3f1e8;
    --shadow: 0 1px 2px rgba(43, 34, 48, .06), 0 4px 14px rgba(43, 34, 48, .05);
    --serif: "Gowun Batang", "Apple SD Gothic Neo", serif;
    --sans: "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c171d;
      --paper: #262028;
      --ink: #f1e9ef;
      --muted: #a8999f;
      --line: #3a3039;
      --rose: #e3829f;
      --rose-soft: #3d2531;
      --plum: #e9cfe0;
      --ok: #7cc59a;
      --ok-soft: #203229;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--rose); }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 max(16px, env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }

  header.top { padding: calc(18px + env(safe-area-inset-top)) 2px 12px; }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--muted);
    text-decoration: none;
    font-size: 14px;
    padding: 4px 0;
  }
  header.top h1 {
    margin: 8px 0 0;
    font-family: var(--serif);
    font-weight: 700;
    font-size: 26px;
    letter-spacing: -0.01em;
    color: var(--plum);
  }
  header.top p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  header.top p b { color: var(--rose); font-weight: 600; }

  .tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 2px 0 10px;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--muted);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 13.5px;
    white-space: nowrap;
  }
  .tab .n { margin-left: 4px; font-size: 12px; opacity: .8; }
  .tab[aria-selected="true"], .tab[aria-pressed="true"] {
    background: var(--plum);
    border-color: var(--plum);
    color: var(--bg);
  }
  .tab.toggle[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--paper); }

  .mapbox {
    position: relative;
    height: min(58vh, 460px);
    min-height: 300px;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: var(--paper);
    box-shadow: var(--shadow);
  }
  #map { position: absolute; inset: 0; }
  .mapmsg {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-align: center;
    padding: 24px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
    word-break: keep-all;
    background: var(--paper);
    z-index: 2;
  }
  .mapmsg b { color: var(--ink); font-size: 15px; }

  /* 지도 위 핀 */
  .pin {
    position: relative;
    display: grid;
    place-items: center;
    width: 36px;
    height: 36px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    background: #b5476a;
    border: 2px solid #fff;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .3);
    cursor: pointer;
    margin-bottom: 6px;
  }
  .pin span { transform: rotate(45deg); font-size: 17px; line-height: 1; }
  .pin.done { background: #3f7a5a; opacity: .85; }
  .pin.sel { outline: 3px solid rgba(181, 71, 106, .35); outline-offset: 2px; }

  /* 선택한 장소 카드 */
  .info {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: 10px;
    z-index: 3;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, .18);
  }
  .info .x {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 30px;
    height: 30px;
    border: 0;
    background: none;
    color: var(--muted);
    font-size: 18px;
  }

  .ptitle {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 16px;
    line-height: 1.4;
    word-break: keep-all;
    overflow-wrap: anywhere;
    padding-right: 24px;
  }
  .done .ptitle { color: var(--muted); }
  .pmeta { margin-top: 5px; display: flex; flex-direction: column; gap: 3px; font-size: 13.5px; color: var(--muted); overflow-wrap: anywhere; }
  .chip {
    display: inline-block;
    align-self: flex-start;
    background: var(--rose-soft);
    color: var(--rose);
    border-radius: 999px;
    padding: 1px 9px;
    font-size: 12px;
    font-weight: 500;
  }
  .donedate { color: var(--ok); font-weight: 500; font-size: 13px; }
  .links { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .lbtn {
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 13px;
    text-decoration: none;
  }
  .lbtn.main { background: var(--rose); border-color: var(--rose); color: var(--paper); font-weight: 600; }

  h2.sec {
    margin: 22px 2px 8px;
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
  }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .card {
    position: relative;
    display: block;
    width: 100%;
    text-align: left;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
    box-shadow: var(--shadow);
  }
  .card.sel { border-color: var(--rose); }
  .card .miss { color: var(--rose); font-size: 12.5px; }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 28px 20px;
    font-size: 14px;
    line-height: 1.7;
    word-break: keep-all;
  }

  /* 현위치 버튼 */
  .locbtn {
    position: absolute;
    right: 10px;
    bottom: 10px;
    z-index: 4;
    width: 40px;
    height: 40px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--plum);
    display: grid;
    place-items: center;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
    cursor: pointer;
    transition: bottom .2s ease;
  }
  .locbtn svg { width: 20px; height: 20px; }
  .locbtn.on { color: #3b82f6; }
  .locbtn.busy svg { animation: locspin 1s linear infinite; }
  @keyframes locspin { to { transform: rotate(360deg); } }
  .me {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #3b82f6;
    border: 3px solid #fff;
    animation: mepulse 2s ease-out infinite;
  }
  @keyframes mepulse {
    0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, .45); }
    70% { box-shadow: 0 0 0 14px rgba(59, 130, 246, 0); }
    100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(28px + env(safe-area-inset-bottom));
    transform: translate(-50%, 10px);
    background: var(--plum);
    color: var(--bg);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 13.5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 40;
    max-width: calc(100% - 32px);
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  /* 장소 카드가 떠 있으면 현위치 버튼을 위로 */
  .mapbox.has-info .locbtn { bottom: 160px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" id="backBtn" href="/">← 약속 노트</a>
    <h1>데이트코스 지도</h1>
    <p>주소를 적어둔 약속 장소 <b id="placeCount">0</b>곳</p>
  </header>

  <nav class="tabs" id="tabs" aria-label="카테고리"></nav>

  <div class="mapbox">
    <div id="map"></div>
    <div class="mapmsg" id="mapMsg"><b>지도를 불러오는 중…</b></div>
    <div class="info" id="info" hidden></div>
    <button class="locbtn" id="locBtn" type="button" aria-label="현위치">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8" opacity=".35"/></svg>
    </button>
  </div>

  <h2 class="sec" id="listTitle">장소 목록</h2>
  <div class="list" id="list"></div>
</div>

<script>
(function () {
  'use strict';

  // 카카오 개발자 콘솔(developers.kakao.com) → 내 애플리케이션 → 앱 키 → JavaScript 키.
  // 플랫폼 → Web 사이트 도메인에 https://ournote.github.io 를 등록해야 동작한다.
  var KAKAO_JS_KEY = 'fdb9bb9ef9a347bf4b1c4a08e9f00fcf';

  var STORAGE_KEY = 'ournote:items';
  var GEO_KEY = 'ournote:geo';

  var CATS = [
    { id: 'food', emoji: '🍰', label: '맛집·디저트' },
    { id: 'gift', emoji: '🎁', label: '선물·만들어주기' },
    { id: 'surprise', emoji: '💐', label: '서프라이즈' },
    { id: 'date', emoji: '✈️', label: '데이트·여행' }
  ];
  var CAT_BY_ID = {};
  CATS.forEach(function (c) { CAT_BY_ID[c.id] = c; });

  // ---------- 데이터 ----------
  function loadItems() {
    try {
      var parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      if (!Array.isArray(parsed)) return [];
      return parsed.filter(function (x) {
        return x && typeof x.title === 'string' && typeof x.place === 'string' && x.place.trim() !== '';
      }).map(function (x) {
        return {
          id: String(x.id),
          title: x.title,
          cat: CAT_BY_ID[x.cat] ? x.cat : 'food',
          place: x.place.trim(),
          done: x.done === true,
          doneAt: typeof x.doneAt === 'string' ? x.doneAt : '',
          createdAt: Number(x.createdAt) || 0
        };
      });
    } catch (e) {
      return [];
    }
  }

  function loadGeo() {
    try {
      var g = JSON.parse(localStorage.getItem(GEO_KEY) || '{}');
      return g && typeof g === 'object' && !Array.isArray(g) ? g : {};
    } catch (e) {
      return {};
    }
  }
  function saveGeo() {
    try { localStorage.setItem(GEO_KEY, JSON.stringify(geo)); } catch (e) { /* 캐시라 실패해도 괜찮다 */ }
  }

  var places = loadItems();
  var geo = loadGeo();          // { 주소문자열: { lat, lng } }
  var missing = {};             // 이번에 찾지 못한 주소
  var currentTab = 'all';
  var showDone = false;
  var selectedId = null;

  var map = null;
  var overlays = {};            // id → CustomOverlay
  var mapReady = false;

  // ---------- 유틸 ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function naverUrl(p) { return 'https://map.naver.com/p/search/' + encodeURIComponent(p.place); }
  function kakaoToUrl(p, c) {
    return 'https://map.kakao.com/link/to/' + encodeURIComponent(p.title.replace(/,/g, ' ')) + ',' + c.lat + ',' + c.lng;
  }
  function kakaoSearchUrl(p) { return 'https://map.kakao.com/link/search/' + encodeURIComponent(p.place); }

  function visible() {
    return places.filter(function (p) {
      return (currentTab === 'all' || p.cat === currentTab) && (showDone || !p.done);
    }).sort(function (a, b) {
      if (a.done !== b.done) return a.done ? 1 : -1;
      return a.createdAt - b.createdAt;
    });
  }

  // ---------- 렌더 ----------
  function renderTabs() {
    var pool = places.filter(function (p) { return showDone || !p.done; });
    var tabs = [{ id: 'all', label: '전체', n: pool.length }].concat(CATS.map(function (c) {
      return { id: c.id, label: c.emoji + ' ' + c.label, n: pool.filter(function (p) { return p.cat === c.id; }).length };
    }));
    var doneN = places.filter(function (p) { return p.done; }).length;
    document.getElementById('tabs').innerHTML = tabs.map(function (t) {
      return '<button class="tab" type="button" data-tab="' + t.id + '" aria-selected="' + (t.id === currentTab) + '">' +
        esc(t.label) + '<span class="n">' + t.n + '</span></button>';
    }).join('') +
      '<button class="tab toggle" type="button" data-toggle-done aria-pressed="' + showDone + '">✓ 했던 곳<span class="n">' + doneN + '</span></button>';
    document.getElementById('placeCount').textContent = pool.length;
  }

  function cardBody(p) {
    var cat = CAT_BY_ID[p.cat];
    var rows = ['<span class="chip">' + cat.emoji + ' ' + esc(cat.label) + '</span>'];
    if (p.done && p.doneAt) rows.push('<span class="donedate">' + esc(p.doneAt.replace(/-/g, '.')) + ' 완료</span>');
    rows.push('<span>📍 ' + esc(p.place) + '</span>');
    return '<div class="ptitle">' + esc(p.title) + '</div><div class="pmeta">' + rows.join('') + '</div>';
  }

  function renderList() {
    var list = visible();
    var el = document.getElementById('list');
    if (!places.length) {
      el.innerHTML = '<div class="empty">주소를 적어둔 약속이 아직 없어요.<br>약속을 고칠 때 ‘주소’ 칸을 채우면 여기 지도에 나와요.</div>';
      return;
    }
    if (!list.length) {
      el.innerHTML = '<div class="empty">이 카테고리에는 장소가 없어요.</div>';
      return;
    }
    el.innerHTML = list.map(function (p) {
      var miss = mapReady && missing[p.place] ? '<div class="miss">지도에서 위치를 못 찾았어요 · 주소를 더 자세히 적어보세요</div>' : '';
      return '<button type="button" class="card' + (p.done ? ' done' : '') + (p.id === selectedId ? ' sel' : '') + '" data-id="' + esc(p.id) + '">' +
        cardBody(p) + miss + '</button>';
    }).join('');
  }

  function renderInfo() {
    var box = document.getElementById('info');
    var p = places.find(function (x) { return x.id === selectedId; });
    var c = p && geo[p.place];
    var mb = document.querySelector('.mapbox');
    if (!p || !c || !mapReady) { box.hidden = true; mb.classList.remove('has-info'); return; }
    mb.classList.add('has-info');
    box.className = 'info' + (p.done ? ' done' : '');
    box.innerHTML = '<button class="x" type="button" data-close aria-label="닫기">×</button>' + cardBody(p) +
      '<div class="links">' +
        '<a class="lbtn main" href="' + esc(kakaoToUrl(p, c)) + '" target="_blank" rel="noopener">카카오맵 길찾기</a>' +
        '<a class="lbtn" href="' + esc(naverUrl(p)) + '" target="_blank" rel="noopener">네이버 지도</a>' +
      '</div>';
    box.hidden = false;
  }

  function renderAll() {
    renderTabs();
    renderList();
    if (mapReady) syncMarkers();
    renderInfo();
  }

  // ---------- 지도 ----------
  function showMsg(html) {
    var m = document.getElementById('mapMsg');
    m.innerHTML = html;
    m.hidden = false;
  }

  function loadKakao() {
    if (!KAKAO_JS_KEY) {
      showMsg('<b>지도 API 키가 아직 없어요</b>map.html의 KAKAO_JS_KEY에 카카오 JavaScript 키를 넣으면 지도가 보여요.<br>아래 목록에서 네이버 지도로 바로 열 수 있어요.');
      return;
    }
    var s = document.createElement('script');
    s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + encodeURIComponent(KAKAO_JS_KEY) + '&libraries=services&autoload=false';
    s.onload = function () {
      if (!window.kakao || !window.kakao.maps || typeof window.kakao.maps.load !== 'function') { failMap(); return; }
      window.kakao.maps.load(initMap);
    };
    s.onerror = failMap;
    document.head.appendChild(s);
  }

  function failMap() {
    showMsg(navigator.onLine === false
      ? '<b>인터넷에 연결되어 있지 않아요</b>지도는 온라인일 때만 볼 수 있어요.'
      : '<b>지도를 불러오지 못했어요</b>카카오 앱 키와 등록된 사이트 도메인을 확인해 주세요.');
  }

  function initMap() {
    var kakao = window.kakao;
    try {
      map = new kakao.maps.Map(document.getElementById('map'), {
        center: new kakao.maps.LatLng(36.4, 127.8), // 대한민국 가운데쯤
        level: 13
      });
    } catch (e) {
      failMap();
      return;
    }
    map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
    enableOneFingerZoom(map, document.getElementById('map'));
    kakao.maps.event.addListener(map, 'click', function () { select(null); });
    document.getElementById('mapMsg').hidden = true;
    mapReady = true;

    geocodeAll(function () {
      renderAll();
      fitBounds();
    });
  }

  function geocodeAll(done) {
    var kakao = window.kakao;
    var geocoder = new kakao.maps.services.Geocoder();
    var ps = new kakao.maps.services.Places();
    var todo = [];
    places.forEach(function (p) {
      if (!geo[p.place] && todo.indexOf(p.place) < 0) todo.push(p.place);
    });
    if (!todo.length) { done(); return; }

    var left = todo.length;
    function finish(addr, result) {
      if (result) geo[addr] = result; else missing[addr] = true;
      left -= 1;
      if (left === 0) { saveGeo(); done(); }
    }
    todo.forEach(function (addr) {
      geocoder.addressSearch(addr, function (res, status) {
        if (status === kakao.maps.services.Status.OK && res[0]) {
          finish(addr, { lat: Number(res[0].y), lng: Number(res[0].x) });
          return;
        }
        // 도로명 주소가 아니면 가게 이름 등으로 한 번 더 찾아본다
        ps.keywordSearch(addr, function (res2, status2) {
          if (status2 === kakao.maps.services.Status.OK && res2[0]) {
            finish(addr, { lat: Number(res2[0].y), lng: Number(res2[0].x) });
          } else {
            finish(addr, null);
          }
        });
      });
    });
  }

  function syncMarkers() {
    var kakao = window.kakao;
    var show = {};
    visible().forEach(function (p) { show[p.id] = p; });

    Object.keys(overlays).forEach(function (id) {
      if (!show[id]) { overlays[id].setMap(null); delete overlays[id]; }
    });

    Object.keys(show).forEach(function (id) {
      var p = show[id];
      var c = geo[p.place];
      if (!c) return;
      var cls = 'pin' + (p.done ? ' done' : '') + (id === selectedId ? ' sel' : '');
      if (overlays[id]) {
        overlays[id].getContent().className = cls;
        return;
      }
      var el = document.createElement('div');
      el.className = cls;
      el.title = p.title;
      el.innerHTML = '<span>' + CAT_BY_ID[p.cat].emoji + '</span>';
      el.addEventListener('click', function (e) { e.stopPropagation(); select(id, false); });
      overlays[id] = new kakao.maps.CustomOverlay({
        position: new kakao.maps.LatLng(c.lat, c.lng),
        content: el,
        yAnchor: 1,
        clickable: true,
        zIndex: p.done ? 1 : 2
      });
      overlays[id].setMap(map);
    });
  }

  function fitBounds() {
    if (!mapReady) return;
    var kakao = window.kakao;
    var pts = visible().map(function (p) { return geo[p.place]; }).filter(Boolean);
    if (!pts.length) return;
    if (pts.length === 1) {
      map.setLevel(4);
      map.setCenter(new kakao.maps.LatLng(pts[0].lat, pts[0].lng));
      return;
    }
    var b = new kakao.maps.LatLngBounds();
    pts.forEach(function (c) { b.extend(new kakao.maps.LatLng(c.lat, c.lng)); });
    map.setBounds(b, 60, 40, 60, 40);
  }

  function select(id, pan) {
    selectedId = id;
    if (id && pan && mapReady) {
      var p = places.find(function (x) { return x.id === id; });
      var c = p && geo[p.place];
      if (c) {
        if (map.getLevel() > 5) map.setLevel(5);
        map.panTo(new window.kakao.maps.LatLng(c.lat, c.lng));
      }
    }
    renderList();
    if (mapReady) syncMarkers();
    renderInfo();
  }


  // ---------- 현위치 (카카오 웹 지도엔 기본 버튼이 없어 직접 만듦) ----------
  function setupLocate(getMap, notify) {
    var btn = document.getElementById('locBtn');
    var me = null, ring = null;
    btn.addEventListener('click', function () {
      var m = getMap();
      if (!m || !window.kakao) { notify('지도가 아직 준비되지 않았어요'); return; }
      if (!navigator.geolocation) { notify('이 기기에서는 현위치를 쓸 수 없어요'); return; }
      btn.classList.add('busy');
      navigator.geolocation.getCurrentPosition(function (pos) {
        btn.classList.remove('busy');
        btn.classList.add('on');
        var k = window.kakao;
        var ll = new k.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
        if (!me) {
          var dot = document.createElement('div');
          dot.className = 'me';
          me = new k.maps.CustomOverlay({ position: ll, content: dot, xAnchor: 0.5, yAnchor: 0.5, zIndex: 5 });
          me.setMap(m);
        } else {
          me.setPosition(ll);
        }
        var acc = pos.coords.accuracy;
        if (ring) { ring.setMap(null); ring = null; }
        if (acc && acc < 1500) {
          ring = new k.maps.Circle({ center: ll, radius: acc, strokeWeight: 1, strokeColor: '#3b82f6', strokeOpacity: 0.35, fillColor: '#3b82f6', fillOpacity: 0.08 });
          ring.setMap(m);
        }
        if (m.getLevel() > 5) m.setLevel(4);
        m.panTo(ll);
      }, function (err) {
        btn.classList.remove('busy');
        notify(err && err.code === 1 ? '위치 권한을 허용해 주세요 (설정 → 개인정보 보호 → 위치 서비스)' : '현위치를 찾지 못했어요');
      }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
    });
  }

  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2600);
  }


  // ---------- 한 손가락 확대·축소: 두 번 탭한 채로 위로 끌면 확대, 아래로 끌면 축소 ----------
  function enableOneFingerZoom(m, el) {
    var lastTapEnd = 0, lastX = 0, lastY = 0;
    var downAt = 0, downX = 0, downY = 0, wasTap = true;
    var zooming = false, startY = 0, startLevel = 0, anchor = null, moved = false;
    var ox = 0, oy = 0;          // 확대 기준점 (지도 안 좌표)
    var committed = 0;           // 지도에 실제로 반영한 단계 변화
    var desired = 0;             // 손가락이 원하는 단계 변화 (소수)
    var STEP = 70;               // 이만큼(px) 끌면 한 단계(2배)
    var MIN = 1, MAX = 14;
    function stop(e) { e.preventDefault(); e.stopPropagation(); }
    function setScale(v, animate) {
      el.style.transition = animate ? 'transform .18s ease-out' : 'none';
      el.style.transformOrigin = ox + 'px ' + oy + 'px';
      el.style.transform = v === 1 ? '' : 'scale(' + v.toFixed(4) + ')';
    }
    function applyLevel(delta) {
      m.setLevel(startLevel + delta, anchor ? { anchor: anchor } : undefined);
    }
    el.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) { return; }
      var t = e.touches[0], now = Date.now();
      if (now - lastTapEnd < 320 && Math.abs(t.clientX - lastX) < 40 && Math.abs(t.clientY - lastY) < 40) {
        zooming = true;
        moved = false;
        startY = t.clientY;
        startLevel = m.getLevel();
        committed = 0;
        desired = 0;
        var r = el.getBoundingClientRect();
        ox = t.clientX - r.left;
        oy = t.clientY - r.top;
        anchor = null;
        try { anchor = m.getProjection().coordsFromContainerPoint(new window.kakao.maps.Point(ox, oy)); } catch (err) { anchor = null; }
        m.setDraggable(false);
        stop(e);
        return;
      }
      downAt = now; downX = t.clientX; downY = t.clientY; wasTap = true;
    }, { capture: true, passive: false });
    el.addEventListener('touchmove', function (e) {
      if (!zooming) {
        var t0 = e.touches[0];
        if (t0 && (Math.abs(t0.clientX - downX) > 10 || Math.abs(t0.clientY - downY) > 10)) wasTap = false;
        return;
      }
      stop(e);
      var dy = e.touches[0].clientY - startY;
      if (Math.abs(dy) > 6) moved = true;
      // 위로 끌면(dy<0) 단계가 작아짐 = 확대
      desired = Math.max(MIN - startLevel, Math.min(MAX - startLevel, dy / STEP));
      // 한 단계 넘게 벌어지면 지도에 반영해서 화면이 흐려지지 않게
      var target = Math.round(desired);
      if (Math.abs(desired - committed) >= 0.75 && target !== committed) {
        committed = target;
        applyLevel(committed);
      }
      setScale(Math.pow(2, committed - desired), false);
    }, { capture: true, passive: false });
    function end(e) {
      if (zooming) {
        stop(e);
        zooming = false;
        lastTapEnd = 0;
        if (!moved) { // 그냥 두 번 탭 = 한 단계 확대
          setScale(1, false);
          m.setLevel(Math.max(MIN, startLevel - 1), anchor ? { anchor: anchor, animate: true } : { animate: true });
          m.setDraggable(true);
          return;
        }
        // 가장 가까운 단계로 스르르 맞춘 뒤 지도에 반영
        var fin = Math.round(desired);
        setScale(Math.pow(2, committed - fin), true);
        setTimeout(function () {
          if (fin !== committed) applyLevel(fin);
          committed = fin;
          setScale(1, false);
          m.setDraggable(true);
        }, 190);
        return;
      }
      if (wasTap && Date.now() - downAt < 250) { lastTapEnd = Date.now(); lastX = downX; lastY = downY; }
      else lastTapEnd = 0;
    }
    el.addEventListener('touchend', end, { capture: true, passive: false });
    el.addEventListener('touchcancel', end, { capture: true, passive: false });
  }

  // 화면 안 뒤로가기: 앱 안에서 왔으면 진짜 뒤로가기(기록 한 칸 빼기),
  // 바로 열었으면 기록을 남기지 않고 바꿔치기 → 스와이프 뒤로가기로 방금 화면이 다시 나오지 않음
  function goBackTo(href) {
    function norm(p) { return p === '/index.html' ? '/' : p; }
    var prev = '';
    try { prev = document.referrer ? norm(new URL(document.referrer).pathname) : ''; } catch (e) { prev = ''; }
    var sameSite = false;
    try { sameSite = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch (e) { sameSite = false; }
    // 앱 안 다른 화면(예: Ver.2에서 지도)에서 왔어도 그 화면으로 돌아감
    if (sameSite && prev && history.length > 1) history.back();
    else location.replace(href);
  }

  document.getElementById('backBtn').addEventListener('click', function (e) {
    if (e.metaKey || e.ctrlKey) return;
    e.preventDefault();
    goBackTo(this.getAttribute('href'));
  });

  // ---------- 이벤트 ----------
  document.getElementById('tabs').addEventListener('click', function (e) {
    var t = e.target.closest('[data-tab]');
    if (t) currentTab = t.getAttribute('data-tab');
    else if (e.target.closest('[data-toggle-done]')) showDone = !showDone;
    else return;
    if (selectedId && !visible().some(function (p) { return p.id === selectedId; })) selectedId = null;
    renderAll();
    fitBounds();
  });

  document.getElementById('list').addEventListener('click', function (e) {
    var card = e.target.closest('.card');
    if (!card) return;
    var id = card.getAttribute('data-id');
    var p = places.find(function (x) { return x.id === id; });
    if (!p) return;
    if (!mapReady || !geo[p.place]) {
      window.open(naverUrl(p), '_blank', 'noopener');
      return;
    }
    select(id, true);
    document.querySelector('.mapbox').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  document.getElementById('info').addEventListener('click', function (e) {
    if (e.target.closest('[data-close]')) select(null);
  });

  renderAll();
  loadKakao();
  setupLocate(function () { return mapReady ? map : null; }, toast);

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('/sw.js').catch(function () {});
  }
})();
</script>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
