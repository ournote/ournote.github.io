<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>우리 약속 노트 Ver.2</title>
<meta name="theme-color" content="#b5476a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="약속 노트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Great+Vibes&display=swap">
<style>
  :root {
    --bg: #f7f3f4;
    --paper: #fff;
    --paper-60: rgba(255, 255, 255, .6);
    --ink: #2b2230;
    --muted: #7d6f7a;
    --line: #e8dfe3;
    --rose: #b5476a;
    --rose-soft: #f6e3ea;
    --plum: #4a2f45;
    --ok: #3f7a5a;
    --ok-soft: #e3f1e8;
    --shadow: 0 1px 2px rgba(43, 34, 48, .06), 0 4px 14px rgba(43, 34, 48, .05);
    --serif: "Gowun Batang", "Apple SD Gothic Neo", serif;
    --script: "Great Vibes", "Snell Roundhand", "Apple Chancery", cursive;
    --sans: "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c171d;
      --paper: #262028;
      --paper-60: rgba(38, 32, 40, .6);
      --ink: #f1e9ef;
      --muted: #a8999f;
      --line: #3a3039;
      --rose: #e3829f;
      --rose-soft: #3d2531;
      --plum: #e9cfe0;
      --ok: #7cc59a;
      --ok-soft: #203229;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
    animation: enter .3s ease both;
  }
  @keyframes enter { from { opacity: 0; } to { opacity: 1; } }

  /* Ver.1의 머리말과 같은 자리·크기를 유지해서 버튼이 제자리에서 바뀐 것처럼 보이게 */
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 max(16px, env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    transition: opacity .24s ease, transform .24s ease;
  }
  body.switching .wrap { opacity: 0; transform: scale(.98); }
  header.top {
    position: relative;
    min-height: calc(28px + 34px + env(safe-area-inset-top));
    padding: calc(28px + env(safe-area-inset-top)) 2px 14px;
  }
  header.top h1 {
    margin: 0;
    padding-right: 124px;
    font-family: var(--script);
    font-weight: 400;
    font-size: 46px;
    line-height: 1.1;
    letter-spacing: .01em;
    color: var(--plum);
  }
  .verbtn {
    position: absolute;
    top: calc(28px + env(safe-area-inset-top));
    right: 50px;
    height: 34px;
    padding: 0 13px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--plum);
    font-family: var(--serif);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: .02em;
    display: grid;
    place-items: center;
    box-shadow: var(--shadow);
    text-decoration: none;
  }

  /* ---------- 스와이프 공간 ---------- */
  .stage { margin-top: 6px; }
  /* 알약줄: 가운데가 지금 칸, 양옆은 옅게 보이다 가장자리에서 스르르 사라짐 */
  .ptitles {
    position: relative;
    height: 30px;
    margin: 0 calc(-1 * max(16px, env(safe-area-inset-right))) 8px calc(-1 * max(16px, env(safe-area-inset-left)));
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 9%, #000 91%, transparent 100%);
    mask-image: linear-gradient(to right, transparent 0%, #000 9%, #000 91%, transparent 100%);
  }
  .pt {
    position: absolute;
    left: 50%;
    bottom: 0;
    opacity: 0;
    cursor: pointer;
    will-change: opacity, transform;
  }
  .pt .name {
    display: inline-block;
    padding: 4px 13px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--paper-60);
    font-family: var(--serif);
    font-weight: 700;
    font-size: 13px;
    line-height: 1.5;
    color: var(--plum);
    white-space: nowrap;
  }

  .deck {
    display: flex;
    height: 60vh;
    height: 60dvh;
    min-height: 320px;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
    margin: 0 -4px;
  }
  .deck::-webkit-scrollbar { display: none; }
  .page {
    flex: 0 0 100%;
    scroll-snap-align: center;
    scroll-snap-stop: always;
    padding: 4px;
  }
  .sheet {
    height: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--paper-60);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 6px 0;
  }
  .row {
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 13px 16px 13px 14px;
    transition: opacity .35s ease;
  }
  .row + .row::before {
    content: "";
    position: absolute;
    left: 54px;
    right: 16px;
    top: 0;
    border-top: 1px solid var(--line);
  }
  .ck {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    margin-top: 1px;
    padding: 0;
    border-radius: 50%;
    border: 1.6px solid var(--rose);
    background: transparent;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background .3s ease, border-color .3s ease, transform .15s ease;
  }
  .ck:active { transform: scale(.9); }
  .ck svg { width: 13px; height: 13px; color: var(--paper); opacity: 0; transition: opacity .3s ease; }
  .row.done .ck { background: var(--ok); border-color: var(--ok); }
  .row.done .ck svg { opacity: 1; }
  .tx { flex: 1; min-width: 0; }
  .tt {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.45;
    color: var(--ink);
    word-break: keep-all;
    overflow-wrap: anywhere;
    transition: color .35s ease;
  }
  .row.done { opacity: .62; }
  .row.done .tt { color: var(--muted); }
  .mm { margin-top: 2px; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
  .gap {
    margin: 10px 16px 2px;
    font-size: 11.5px;
    letter-spacing: .06em;
    color: var(--muted);
    opacity: .8;
  }
  .none {
    height: 100%;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 24px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
    word-break: keep-all;
  }


  [hidden] { display: none !important; }
  body.locked { overflow: hidden; }

  /* ---------- 등록하기 버튼 ---------- */
  .addbar { display: flex; justify-content: center; margin-top: 16px; }
  .addbtn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 42px;
    padding: 0 22px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--paper-60);
    color: var(--rose);
    font-family: var(--serif);
    font-weight: 700;
    font-size: 14.5px;
    letter-spacing: .02em;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform .15s ease;
  }
  .addbtn:active { transform: scale(.97); }
  .addbtn svg { width: 15px; height: 15px; }
  .row { cursor: pointer; }

  /* ---------- 바텀시트 ---------- */
  .ov {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(28, 20, 26, .32);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    transition: opacity .25s ease;
  }
  .ov.show { opacity: 1; }
  .bs {
    width: 100%;
    max-width: 560px;
    max-height: calc(100% - 24px - env(safe-area-inset-top));
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--paper);
    border-radius: 18px 18px 0 0;
    padding: 10px 20px calc(20px + env(safe-area-inset-bottom));
    transform: translateY(30px);
    transition: transform .3s cubic-bezier(.22,.8,.3,1);
  }
  .ov.show .bs { transform: none; }
  .grip { width: 38px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 14px; }
  .bs h2 {
    margin: 0 0 16px;
    font-family: var(--serif);
    font-size: 19px;
    color: var(--plum);
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .fld { margin-bottom: 12px; }
  .fld label, .fld .lab { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
  .fld .req { color: var(--rose); }
  .fld input, .fld textarea {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    border-radius: 12px;
    padding: 10px 12px;
    font: inherit;
    font-size: 16px;
    outline: none;
  }
  .fld textarea { resize: vertical; min-height: 64px; }
  .fld input:focus, .fld textarea:focus { border-color: var(--rose); }
  .fld.err input { border-color: var(--rose); background: var(--rose-soft); }
  .cats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cat {
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    border-radius: 12px;
    padding: 10px 8px;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  .cat[aria-pressed="true"] { border-color: var(--rose); background: var(--rose-soft); color: var(--rose); font-weight: 600; }
  .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .btn {
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    border-radius: 12px;
    padding: 10px 18px;
    font: inherit;
    font-size: 15px;
    cursor: pointer;
  }
  .btn.pri { background: var(--rose); border-color: var(--rose); color: var(--paper); font-weight: 600; }

  /* 세부내용 */
  .chip {
    display: inline-block;
    background: var(--rose-soft);
    color: var(--rose);
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 12px;
    font-weight: 500;
  }
  .dtop { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .ddone { font-size: 12.5px; color: var(--ok); font-weight: 500; }
  .dl { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
  .di { display: flex; gap: 10px; font-size: 14.5px; line-height: 1.55; }
  .di .ic { flex: 0 0 22px; text-align: center; }
  .di .v { flex: 1; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .di a { color: var(--rose); text-decoration: none; }
  .di .map {
    display: inline-block;
    margin-left: 6px;
    font-size: 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0 6px;
    white-space: nowrap;
  }
  .review { background: var(--ok-soft); border-radius: 12px; padding: 10px 12px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .dempty { color: var(--muted); font-size: 14px; }
  .acts .sp { flex: 1; }
  .btn.del { color: var(--rose); border-color: var(--rose-soft); background: transparent; }
  .btn.delx { background: var(--rose); border-color: var(--rose); color: var(--paper); font-weight: 600; }
  .confirm {
    margin-top: 14px;
    background: var(--rose-soft);
    border-radius: 14px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .confirm span { flex: 1; color: var(--rose); font-weight: 500; font-size: 14px; }
  .confirm .btn { padding: 7px 13px; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Our Date</h1>
    <a class="verbtn" id="verBtn" href="/" aria-label="버전 1로 돌아가기">Ver.1</a>
  </header>

  <main id="app">
    <div class="stage">
      <div class="ptitles" id="ptitles" aria-live="polite"></div>
      <div class="deck" id="deck"></div>
    </div>
    <div class="addbar">
      <button class="addbtn" id="addBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        등록하기
      </button>
    </div>
  </main>
</div>

<script>
(function () {
  'use strict';

  // iOS 사파리는 user-scalable=no를 무시할 때가 있어 두 손가락 확대도 직접 막음
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });

  document.getElementById('verBtn').addEventListener('click', function (e) {
    if (e.metaKey || e.ctrlKey) return;
    e.preventDefault();
    var href = this.getAttribute('href');
    document.body.classList.add('switching');
    setTimeout(function () { location.href = href; }, 220);
  });
  window.addEventListener('pageshow', function () { document.body.classList.remove('switching'); });


  var STORAGE_KEY = 'ournote:items';
  var PAGE_KEY = 'ournote:v2page';
  var PAGES = [
    { id: 'all', name: '전체' },
    { id: 'food', name: '🍰 맛집' },
    { id: 'gift', name: '🎁 선물' },
    { id: 'surprise', name: '💐 서프라이즈' },
    { id: 'date', name: '✈️ 데이트' }
  ];
  var CAT = {
    food: { emoji: '🍰', label: '맛집·디저트' },
    gift: { emoji: '🎁', label: '선물·만들어주기' },
    surprise: { emoji: '💐', label: '서프라이즈' },
    date: { emoji: '✈️', label: '데이트·여행' }
  };
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  // ---------- 저장 (Ver.1과 같은 데이터) ----------
  function loadRaw() {
    try {
      var v = JSON.parse(localStorage.getItem(STORAGE_KEY));
      return Array.isArray(v) ? v : [];
    } catch (e) {
      return [];
    }
  }
  function saveRaw(list) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); return true; } catch (e) { return false; }
  }
  function valid(x) { return x && typeof x.title === 'string' && x.title.trim() !== ''; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // 남은 약속은 적은 순서대로, 체크한 약속은 체크한 순서대로 맨 아래에
  function sorted(list) {
    var open = list.filter(function (x) { return x.done !== true; })
      .sort(function (a, b) { return (Number(a.createdAt) || 0) - (Number(b.createdAt) || 0); });
    var done = list.filter(function (x) { return x.done === true; })
      .sort(function (a, b) {
        var da = String(a.doneAt || ''), db = String(b.doneAt || '');
        if (da !== db) return da < db ? -1 : 1;
        return (Number(a.checkedAt) || 0) - (Number(b.checkedAt) || 0) || (Number(a.createdAt) || 0) - (Number(b.createdAt) || 0);
      });
    return { open: open, done: done };
  }

  // ---------- 그리기 ----------
  var deck = document.getElementById('deck');
  var ptitles = document.getElementById('ptitles');

  function rowHtml(it, pageId) {
    var meta = [];
    if (pageId === 'all' && CAT[it.cat]) meta.push(CAT[it.cat].emoji + ' ' + CAT[it.cat].label);
    if (it.place) meta.push('📍 ' + it.place);
    else if (it.when) meta.push('⏳ ' + it.when);
    return '<div class="row' + (it.done === true ? ' done' : '') + '" data-id="' + esc(it.id) + '">' +
      '<button class="ck" type="button" aria-label="' + (it.done === true ? '체크 해제' : '체크') + '">' + CHECK + '</button>' +
      '<div class="tx"><div class="tt">' + esc(it.title) + '</div>' +
      (meta.length ? '<div class="mm">' + esc(meta.join(' · ')) + '</div>' : '') + '</div></div>';
  }

  function pageItems(all, pageId) {
    return all.filter(function (x) { return pageId === 'all' || x.cat === pageId; });
  }

  function renderTitles(all) {
    ptitles.innerHTML = PAGES.map(function (p, i) {
      return '<div class="pt" data-i="' + i + '" role="button" tabindex="0" aria-label="' + esc(p.name) + '"><span class="name">' + esc(p.name) + '</span></div>';
    }).join('');
  }

  function renderPage(all, p) {
    var groups = sorted(pageItems(all, p.id));
    if (!groups.open.length && !groups.done.length) {
      return '<div class="none">' + (p.id === 'all'
        ? '아직 약속이 없어요.<br>Ver.1에서 약속을 적으면 여기에 보여요.'
        : '이 카테고리에는 아직 약속이 없어요.') + '</div>';
    }
    return groups.open.map(function (it) { return rowHtml(it, p.id); }).join('') +
      (groups.done.length ? '<div class="gap">했던 것</div>' : '') +
      groups.done.map(function (it) { return rowHtml(it, p.id); }).join('');
  }

  function renderAll(first) {
    var all = loadRaw().filter(valid);
    if (first) {
      renderTitles(all);
      deck.innerHTML = PAGES.map(function (p) {
        return '<section class="page" data-page="' + p.id + '"><div class="sheet">' + renderPage(all, p) + '</div></section>';
      }).join('');
    } else {
      PAGES.forEach(function (p) {
        deck.querySelector('[data-page="' + p.id + '"] .sheet').innerHTML = renderPage(all, p);
      });
    }
    onScroll();
  }

  // ---------- 체크: 바로 토글, 자리 이동은 부드럽게 ----------
  function toggle(id) {
    var list = loadRaw();
    var it = list.find(function (x) { return x && String(x.id) === id; });
    if (!it) return;
    if (it.done === true) {
      it.done = false;
      it.doneAt = '';
      delete it.checkedAt;
    } else {
      it.done = true;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(String(it.doneAt || ''))) it.doneAt = today();
      it.checkedAt = Date.now();
    }
    saveRaw(list);

    // FLIP: 바뀌기 전 위치를 기억했다가 새 자리로 미끄러지게
    var before = {};
    deck.querySelectorAll('.row').forEach(function (r) {
      before[r.closest('.page').getAttribute('data-page') + '|' + r.getAttribute('data-id')] = r.getBoundingClientRect().top;
    });
    renderAll(false);
    deck.querySelectorAll('.row').forEach(function (r) {
      var key = r.closest('.page').getAttribute('data-page') + '|' + r.getAttribute('data-id');
      if (!(key in before)) return;
      var dy = before[key] - r.getBoundingClientRect().top;
      if (!dy) return;
      r.style.transition = 'none';
      r.style.transform = 'translateY(' + dy + 'px)';
      r.getBoundingClientRect();
      r.style.transition = 'transform .5s cubic-bezier(.22,.8,.3,1), opacity .35s ease';
      r.style.transform = '';
    });
  }

  deck.addEventListener('click', function (e) {
    var ck = e.target.closest('.ck');
    if (ck) { toggle(ck.closest('.row').getAttribute('data-id')); return; }
    var row = e.target.closest('.row');
    if (row) openDetail(row.getAttribute('data-id'));
  });

  // ---------- 바텀시트 ----------
  var stack = [];
  function openSheet(html, onMount) {
    var ov = document.createElement('div');
    ov.className = 'ov';
    ov.innerHTML = '<div class="bs" role="dialog" aria-modal="true"><div class="grip"></div>' + html + '</div>';
    ov.addEventListener('click', function (e) { if (e.target === ov) closeSheet(); });
    document.body.appendChild(ov);
    document.body.classList.add('locked');
    stack.push(ov);
    requestAnimationFrame(function () { ov.classList.add('show'); });
    if (onMount) onMount(ov.querySelector('.bs'));
  }
  function closeSheet() {
    var ov = stack.pop();
    if (!ov) return;
    ov.classList.remove('show');
    setTimeout(function () { ov.remove(); }, 260);
    if (!stack.length) document.body.classList.remove('locked');
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && stack.length) { e.preventDefault(); closeSheet(); }
  });

  function fld(id, label, opts) {
    opts = opts || {};
    var input = opts.textarea
      ? '<textarea id="' + id + '" rows="3" placeholder="' + esc(opts.ph || '') + '">' + esc(opts.val || '') + '</textarea>'
      : '<input id="' + id + '" type="text" value="' + esc(opts.val || '') + '" placeholder="' + esc(opts.ph || '') + '" autocomplete="off"' + (opts.mode ? ' inputmode="' + opts.mode + '"' : '') + '>';
    return '<div class="fld" data-f="' + id + '"><label for="' + id + '">' + label + (opts.req ? ' <span class="req">*</span>' : '') + '</label>' + input + '</div>';
  }

  // ---------- 등록하기 ----------
  function uid() { return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8); }

  function openEditor(item) {
    var isNew = !item;
    var pageId = PAGES[current] ? PAGES[current].id : 'all';
    var cat = item ? (CAT[item.cat] ? item.cat : 'food') : (CAT[pageId] ? pageId : 'food');
    var v = item || {};
    var html = '<h2>' + (isNew ? '새 약속' : '약속 고치기') + '</h2>' +
      fld('a-title', '무엇을', { req: true, ph: '예) 성수동 소금빵 같이 먹기', val: v.title }) +
      '<div class="fld"><span class="lab">카테고리</span><div class="cats">' +
      Object.keys(CAT).map(function (k) {
        return '<button type="button" class="cat" data-cat="' + k + '" aria-pressed="' + (k === cat) + '">' + CAT[k].emoji + ' ' + esc(CAT[k].label) + '</button>';
      }).join('') + '</div></div>' +
      fld('a-place', '주소', { ph: '지도에서 찾을 주소나 가게 이름', val: v.place }) +
      fld('a-link', '링크', { ph: 'https://', mode: 'url', val: v.link }) +
      fld('a-memo', '메모', { textarea: true, ph: '영업시간, 메뉴, 사이즈 등', val: v.memo }) +
      fld('a-when', '목표 시기', { ph: '예) 12월, 100일, 다음 휴가', val: v.when }) +
      '<div class="acts"><button type="button" class="btn" data-act="close">닫기</button>' +
      '<button type="button" class="btn pri" data-act="save">저장</button></div>';

    openSheet(html, function (bs) {
      var title = bs.querySelector('#a-title');
      if (isNew) setTimeout(function () { title.focus(); }, 80);
      title.addEventListener('input', function () { bs.querySelector('[data-f="a-title"]').classList.remove('err'); });

      function save() {
        var t = title.value.trim();
        if (!t) {
          bs.querySelector('[data-f="a-title"]').classList.add('err');
          title.focus();
          return;
        }
        var vals = {
          title: t,
          cat: cat,
          place: bs.querySelector('#a-place').value.trim(),
          link: bs.querySelector('#a-link').value.trim(),
          memo: bs.querySelector('#a-memo').value.trim(),
          when: bs.querySelector('#a-when').value.trim()
        };
        var list = loadRaw();
        if (isNew) {
          var maxCreated = list.reduce(function (m, x) { return Math.max(m, Number(x && x.createdAt) || 0); }, 0);
          vals.id = uid();
          vals.done = false;
          vals.doneAt = '';
          vals.review = '';
          vals.createdAt = Math.max(Date.now(), maxCreated + 1);
          list.push(vals);
        } else {
          var target = list.find(function (x) { return x && String(x.id) === String(item.id); });
          if (target) Object.assign(target, vals);
        }
        saveRaw(list);
        renderAll(false);
        closeSheet();
        if (!isNew) setTimeout(function () { closeSheet(); setTimeout(function () { openDetail(String(item.id)); }, 120); }, 0);
      }

      bs.addEventListener('click', function (e) {
        var c = e.target.closest('[data-cat]');
        if (c) {
          cat = c.getAttribute('data-cat');
          bs.querySelectorAll('[data-cat]').forEach(function (b) { b.setAttribute('aria-pressed', String(b === c)); });
          return;
        }
        var a = e.target.closest('[data-act]');
        if (!a) return;
        if (a.getAttribute('data-act') === 'close') closeSheet();
        else save();
      });
      bs.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && e.target.tagName === 'INPUT' && !e.isComposing) { e.preventDefault(); save(); }
      });
    });
  }
  document.getElementById('addBtn').addEventListener('click', function () { openEditor(null); });

  // ---------- 세부내용 ----------
  function openDetail(id) {
    var it = loadRaw().find(function (x) { return x && String(x.id) === id; });
    if (!it) return;
    var c = CAT[it.cat] || CAT.food;
    var rows = [];
    if (it.place) {
      rows.push('<div class="di"><span class="ic">📍</span><span class="v">' + esc(it.place) +
        '<a class="map" href="https://map.naver.com/p/search/' + encodeURIComponent(it.place) + '" target="_blank" rel="noopener">지도</a></span></div>');
    }
    if (it.link) {
      var link = String(it.link);
      rows.push('<div class="di"><span class="ic">🔗</span><span class="v">' + (/^https?:\/\//i.test(link)
        ? '<a href="' + esc(link) + '" target="_blank" rel="noopener">' + esc(link.replace(/^https?:\/\//i, '')) + '</a>'
        : esc(link)) + '</span></div>');
    }
    if (it.memo) rows.push('<div class="di"><span class="ic">📝</span><span class="v">' + esc(it.memo) + '</span></div>');
    if (it.when) rows.push('<div class="di"><span class="ic">⏳</span><span class="v">' + esc(it.when) + '</span></div>');
    if (it.done === true && it.review) rows.push('<div class="review">' + esc(it.review) + '</div>');

    var html = '<div class="dtop"><span class="chip">' + c.emoji + ' ' + esc(c.label) + '</span>' +
      (it.done === true && it.doneAt ? '<span class="ddone">' + esc(String(it.doneAt).replace(/-/g, '.')) + ' 완료</span>' : '') + '</div>' +
      '<h2>' + esc(it.title) + '</h2>' +
      (rows.length ? '<div class="dl">' + rows.join('') + '</div>' : '<div class="dempty">적어둔 세부내용이 없어요.</div>') +
      '<div class="acts"><button type="button" class="btn del" data-act="del">삭제</button><span class="sp"></span>' +
      '<button type="button" class="btn" data-act="close">닫기</button>' +
      '<button type="button" class="btn pri" data-act="edit">수정</button></div>' +
      '<div class="confirm" data-confirm hidden><span>정말 지울까요?</span>' +
      '<button type="button" class="btn" data-act="del-no">아니요</button>' +
      '<button type="button" class="btn delx" data-act="del-yes">지우기</button></div>';
    openSheet(html, function (bs) {
      bs.addEventListener('click', function (e) {
        var a = e.target.closest('[data-act]');
        if (!a) return;
        var act = a.getAttribute('data-act');
        var box = bs.querySelector('[data-confirm]');
        if (act === 'close') closeSheet();
        else if (act === 'edit') openEditor(it);
        else if (act === 'del') { box.hidden = false; box.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
        else if (act === 'del-no') box.hidden = true;
        else if (act === 'del-yes') {
          saveRaw(loadRaw().filter(function (x) { return !(x && String(x.id) === id); }));
          renderAll(false);
          closeSheet();
        }
      });
    });
  }

  // ---------- 스와이프에 따라 제목이 스르르 바뀜 ----------
  var ticking = false, current = 0;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      ticking = false;
      var w = deck.clientWidth || 1;
      var pos = deck.scrollLeft / w;
      layoutPills(pos);
      var idx = Math.round(pos);
      current = idx;
    });
  }
  deck.addEventListener('scroll', onScroll, { passive: true });

  // 마지막으로 본 칸은 넘기기가 다 끝난 뒤에 한 번만 저장 (넘기는 도중 저장하면 버벅일 수 있음)
  var savedPage = null, saveTimer = null;
  deck.addEventListener('scroll', function () {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      if (current === savedPage) return;
      savedPage = current;
      try { localStorage.setItem(PAGE_KEY, String(current)); } catch (e) { /* 위치 기억은 없어도 됨 */ }
    }, 300);
  }, { passive: true });
  window.addEventListener('resize', function () { deck.scrollLeft = current * deck.clientWidth; measurePills(); onScroll(); });

  // 알약들을 한 줄로 이어 붙이고, 넘긴 만큼 줄 전체가 미끄러지게
  var pillW = [], PILL_GAP = 6;
  function measurePills() {
    pillW = [];
    ptitles.querySelectorAll('.pt').forEach(function (el) { pillW.push(el.offsetWidth); });
  }
  // 가운데에서 멀수록 옅고 작게: 바로 옆은 또렷한 편, 두 칸 옆은 희미하게
  function pillLook(d) {
    d = Math.abs(d);
    var scale = d >= 2 ? 0.7 : d >= 1 ? 0.86 - (d - 1) * 0.16 : 1 - d * 0.14;
    var op = d >= 2 ? Math.max(0, 0.32 - (d - 2) * 0.6) : d >= 1 ? 0.6 - (d - 1) * 0.28 : 1 - d * 0.4;
    return { scale: scale, op: op };
  }
  function layoutPills(pos) {
    if (pillW.length !== PAGES.length || !pillW[0]) measurePills();
    var looks = pillW.map(function (w, i) { return pillLook(i - pos); });
    // 줄어든 크기 기준으로 이어 붙여서 간격이 늘 일정하게
    var x = [], acc = 0;
    pillW.forEach(function (w, i) {
      if (i > 0) acc += pillW[i - 1] * looks[i - 1].scale / 2 + PILL_GAP + w * looks[i].scale / 2;
      x.push(acc);
    });
    var lo = Math.max(0, Math.min(PAGES.length - 1, Math.floor(pos)));
    var hi = Math.min(PAGES.length - 1, lo + 1);
    var center = x[lo] + (x[hi] - x[lo]) * Math.max(0, Math.min(1, pos - lo));
    ptitles.querySelectorAll('.pt').forEach(function (el, i) {
      el.style.transform = 'translateX(calc(-50% + ' + (x[i] - center).toFixed(1) + 'px)) scale(' + looks[i].scale.toFixed(3) + ')';
      el.style.opacity = looks[i].op.toFixed(3);
    });
  }

  function goTo(i) { deck.scrollTo({ left: i * deck.clientWidth, behavior: 'smooth' }); }
  ptitles.addEventListener('click', function (e) {
    var pt = e.target.closest('.pt');
    if (pt) goTo(Number(pt.getAttribute('data-i')));
  });
  ptitles.addEventListener('keydown', function (e) {
    var pt = e.target.closest('.pt');
    if (pt && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); goTo(Number(pt.getAttribute('data-i'))); }
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { measurePills(); onScroll(); });

  renderAll(true);
  try { current = Math.max(0, Math.min(PAGES.length - 1, Number(localStorage.getItem(PAGE_KEY)) || 0)); } catch (e) { current = 0; }
  savedPage = current;
  deck.scrollLeft = current * deck.clientWidth;
  onScroll();

  // Ver.1에서 고치고 돌아오면 다시 읽기
  window.addEventListener('pageshow', function (e) { if (e.persisted) renderAll(false); });
  window.addEventListener('storage', function (e) { if (e.key === STORAGE_KEY) renderAll(false); });

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('/sw.js').catch(function () {});
  }
})();
</script>
</body>
