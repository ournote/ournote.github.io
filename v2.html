<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Our note</title>
<meta name="theme-color" content="#b5476a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="약속 노트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="prefetch" href="/course.html">
<link rel="prefetch" href="/map.html">
<link rel="preconnect" href="https://dapi.kakao.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Great+Vibes&display=swap">
<style>
  :root {
    --bg: #f7f3f4;
    --paper: #fff;
    --paper-60: rgba(255, 255, 255, .6);
    --ink: #2b2230;
    --muted: #7d6f7a;
    --line: #e8dfe3;
    --rose: #b5476a;
    --rose-soft: #f6e3ea;
    --plum: #4a2f45;
    --ok: #3f7a5a;
    --ok-soft: #e3f1e8;
    --shadow: 0 1px 2px rgba(43, 34, 48, .06), 0 4px 14px rgba(43, 34, 48, .05);
    --serif: "Gowun Batang", "Apple SD Gothic Neo", serif;
    --script: "Great Vibes", "Snell Roundhand", "Apple Chancery", cursive;
    --sans: "IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c171d;
      --paper: #262028;
      --paper-60: rgba(38, 32, 40, .6);
      --ink: #f1e9ef;
      --muted: #a8999f;
      --line: #3a3039;
      --rose: #e3829f;
      --rose-soft: #3d2531;
      --plum: #e9cfe0;
      --ok: #7cc59a;
      --ok-soft: #203229;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
    animation: enter .2s ease both;
  }
  @keyframes enter { from { opacity: 0; } to { opacity: 1; } }

  /* Ver.1의 머리말과 같은 자리·크기를 유지해서 버튼이 제자리에서 바뀐 것처럼 보이게 */
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 max(16px, env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    transition: opacity .12s ease, transform .12s ease;
  }
  body.switching .wrap { opacity: 0; transform: scale(.98); }
  header.top {
    position: relative;
    min-height: calc(28px + 34px + env(safe-area-inset-top));
    padding: calc(28px + env(safe-area-inset-top)) 2px 14px;
  }
  header.top h1 {
    margin: 0;
    padding-right: 0;
    font-family: var(--script);
    font-weight: 400;
    font-size: 46px;
    white-space: nowrap;
    line-height: 1.1;
    letter-spacing: .01em;
    color: var(--plum);
  }
  .verbtn {
    position: absolute;
    top: calc(28px + env(safe-area-inset-top));
    right: 0;
    height: 34px;
    padding: 0 13px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--plum);
    font-family: var(--serif);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: .02em;
    display: grid;
    place-items: center;
    box-shadow: var(--shadow);
    text-decoration: none;
  }

  /* ---------- 스와이프 공간 ---------- */
  .stage { margin-top: 6px; }
  /* 알약줄: 가운데가 지금 칸, 양옆은 옅게 보이다 가장자리에서 스르르 사라짐 */
  .ptitles {
    position: relative;
    height: 30px;
    touch-action: pan-y; /* 가로로 미는 건 알약 넘기기로 */
    margin: 0 calc(-1 * max(16px, env(safe-area-inset-right))) 8px calc(-1 * max(16px, env(safe-area-inset-left)));
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 9%, #000 91%, transparent 100%);
    mask-image: linear-gradient(to right, transparent 0%, #000 9%, #000 91%, transparent 100%);
  }
  .pt {
    position: absolute;
    left: 50%;
    bottom: 0;
    opacity: 0;
    cursor: pointer;
    will-change: opacity, transform;
  }
  .pt .name {
    display: inline-block;
    padding: 4px 13px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--paper-60);
    font-family: var(--serif);
    font-weight: 700;
    font-size: 13px;
    line-height: 1.5;
    color: var(--plum);
    white-space: nowrap;
  }

  .deck {
    display: flex;
    height: 60vh;
    height: 60dvh;
    min-height: 320px;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
    margin: 0 -4px;
  }
  .deck::-webkit-scrollbar { display: none; }
  .page {
    flex: 0 0 100%;
    scroll-snap-align: center;
    scroll-snap-stop: always;
    padding: 4px;
  }
  .sheet {
    height: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--paper-60);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 6px 0;
  }
  .row {
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 13px 16px 13px 14px;
    transition: opacity .35s ease;
  }
  .row + .row::before {
    content: "";
    position: absolute;
    left: 54px;
    right: 16px;
    top: 0;
    border-top: 1px solid var(--line);
  }
  .ck {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    margin-top: 1px;
    padding: 0;
    border-radius: 50%;
    border: 1.6px solid var(--rose);
    background: transparent;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background .3s ease, border-color .3s ease, transform .15s ease;
  }
  .ck:active { transform: scale(.9); }
  .ck svg { width: 13px; height: 13px; color: var(--paper); opacity: 0; transition: opacity .3s ease; }
  .row.done .ck { background: var(--ok); border-color: var(--ok); }
  .row.done .ck svg { opacity: 1; }
  .tx { flex: 1; min-width: 0; }
  .tt {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 15.5px;
    line-height: 1.45;
    color: var(--ink);
    word-break: keep-all;
    overflow-wrap: anywhere;
    transition: color .35s ease;
  }
  .row.done { opacity: .62; }
  .row.done .tt { color: var(--muted); }
  .mm { margin-top: 2px; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
  .gap {
    margin: 10px 16px 2px;
    font-size: 11.5px;
    letter-spacing: .06em;
    color: var(--muted);
    opacity: .8;
  }
  .none {
    height: 100%;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 24px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
    word-break: keep-all;
  }


  [hidden] { display: none !important; }
  body.locked { overflow: hidden; }

  /* ---------- 등록하기 버튼 ---------- */
  .addbar { display: flex; justify-content: center; margin-top: 16px; }
  .addbtn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 42px;
    padding: 0 22px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--paper-60);
    color: var(--rose);
    font-family: var(--serif);
    font-weight: 700;
    font-size: 14.5px;
    letter-spacing: .02em;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform .15s ease;
  }
  .addbtn:active { transform: scale(.97); }
  .addbtn svg { width: 15px; height: 15px; }
  .row { cursor: pointer; }

  /* ---------- 바텀시트 ---------- */
  .ov {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(28, 20, 26, .32);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    transition: opacity .25s ease;
  }
  .ov.show { opacity: 1; }
  .bs {
    width: 100%;
    max-width: 560px;
    max-height: calc(100% - 24px - env(safe-area-inset-top));
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--paper);
    border-radius: 18px 18px 0 0;
    padding: 10px 20px calc(20px + env(safe-area-inset-bottom));
    transform: translateY(30px);
    transition: transform .3s cubic-bezier(.22,.8,.3,1);
  }
  .ov.show .bs { transform: none; }
  .grip { width: 38px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 14px; }
  .bs h2 {
    margin: 0 0 16px;
    font-family: var(--serif);
    font-size: 19px;
    color: var(--plum);
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .fld { margin-bottom: 12px; }
  .fld label, .fld .lab { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 5px; }
  .fld .req { color: var(--rose); }
  .fld input, .fld textarea {
    width: 100%;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    border-radius: 12px;
    padding: 10px 12px;
    font: inherit;
    font-size: 16px;
    outline: none;
  }
  .fld textarea { resize: vertical; min-height: 64px; }
  .fld input:focus, .fld textarea:focus { border-color: var(--rose); }
  .fld.err input { border-color: var(--rose); background: var(--rose-soft); }
  .cats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cat {
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    border-radius: 12px;
    padding: 10px 8px;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  .cat[aria-pressed="true"] { border-color: var(--rose); background: var(--rose-soft); color: var(--rose); font-weight: 600; }
  .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .btn {
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    border-radius: 12px;
    padding: 10px 18px;
    font: inherit;
    font-size: 15px;
    cursor: pointer;
  }
  .btn.pri { background: var(--rose); border-color: var(--rose); color: var(--paper); font-weight: 600; }

  /* 세부내용 */
  .chip {
    display: inline-block;
    background: var(--rose-soft);
    color: var(--rose);
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 12px;
    font-weight: 500;
  }
  .lock { font-size: .78em; margin-right: 4px; opacity: .75; }
  .lockchip { background: transparent; border: 1px solid var(--line); color: var(--muted); }
  .privrow { display: flex; align-items: center; gap: 10px; }
  .privtog { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 7px 13px; font: inherit; font-size: 13.5px; cursor: pointer; flex: 0 0 auto; }
  .privtog[aria-pressed="true"] { border-color: var(--plum); color: var(--plum); font-weight: 600; }
  .privnote { font-size: 12px; color: var(--muted); }
  .dtop { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .ddone { font-size: 12.5px; color: var(--ok); font-weight: 500; }
  .dl { display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
  .di { display: flex; gap: 10px; font-size: 14.5px; line-height: 1.55; }
  .di .ic { flex: 0 0 22px; text-align: center; }
  .di .v { flex: 1; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .di a { color: var(--rose); text-decoration: none; }
  .di .map {
    display: inline-block;
    margin-left: 6px;
    font-size: 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0 6px;
    white-space: nowrap;
  }
  .review { background: var(--ok-soft); border-radius: 12px; padding: 10px 12px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .dempty { color: var(--muted); font-size: 14px; }
  .acts .sp { flex: 1; }
  .btn.del { color: var(--rose); border-color: var(--rose-soft); background: transparent; }
  .btn.delx { background: var(--rose); border-color: var(--rose); color: var(--paper); font-weight: 600; }
  .confirm {
    margin-top: 14px;
    background: var(--rose-soft);
    border-radius: 14px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .confirm span { flex: 1; color: var(--rose); font-weight: 500; font-size: 14px; }
  .confirm .btn { padding: 7px 13px; font-size: 14px; }

  .addbar { gap: 8px; }
  .addbtn.sub { color: var(--plum); padding: 0 18px; }

  /* ---------- 붙여넣기 미리보기 ---------- */
  .pv { display: flex; flex-direction: column; gap: 10px; }
  .pi {
    display: flex;
    gap: 12px;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 12px 12px 10px;
    background: var(--bg);
    transition: opacity .25s ease;
  }
  .pi { position: relative; }
  .pi .tt { padding-right: 40px; }
  .plock { position: absolute; top: 10px; right: 10px; width: 32px; height: 24px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); font-size: 15px; line-height: 1; cursor: pointer; }
  .plock[aria-pressed="true"] { border-color: var(--plum); }
  .pi.off { opacity: .45; }
  .pi .ck { margin-top: 0; }
  .pi.on .ck { background: var(--rose); border-color: var(--rose); }
  .pi.on .ck svg { opacity: 1; }
  .pi .tx { flex: 1; min-width: 0; }
  .pi .tt { font-size: 15px; }
  .pcats { display: flex; flex-wrap: nowrap; gap: 4px; margin: 7px 0 4px; overflow-x: auto; scrollbar-width: none; }
  .pcats::-webkit-scrollbar { display: none; }
  .pcat { flex: 0 0 auto; }
  .pcat {
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--muted);
    border-radius: 999px;
    padding: 1px 7px;
    font: inherit;
    font-size: 11.5px;
    white-space: nowrap;
    cursor: pointer;
  }
  .pcat[aria-pressed="true"] { border-color: var(--rose); background: var(--rose-soft); color: var(--rose); font-weight: 600; }
  .pm { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .dup { display: inline-block; margin-left: 6px; font-size: 11px; color: var(--rose); border: 1px solid var(--rose-soft); border-radius: 6px; padding: 0 5px; vertical-align: 2px; font-family: var(--sans); font-weight: 500; }
  .cleanlist { max-height: 46vh; overflow: auto; margin-bottom: 6px; }
  .cl { padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.5; }
  .cl s { display: block; color: var(--muted); font-size: 12.5px; }
  .cl b { font-weight: 600; }
  .note { margin: -6px 0 14px; font-size: 13px; color: var(--muted); line-height: 1.6; word-break: keep-all; }
  .linkbtn {
    display: block;
    margin: 14px auto 0;
    border: 0;
    background: none;
    color: var(--muted);
    font: inherit;
    font-size: 12.5px;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }
  .fld textarea.big { min-height: 180px; font-size: 14px; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(28px + env(safe-area-inset-bottom));
    transform: translate(-50%, 10px);
    background: var(--plum);
    color: var(--bg);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 13.5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 40;
    max-width: calc(100% - 32px);
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- 데이트 코스 만들기 (Ver.1 지도 바로가기와 같은 모양) ---------- */
  .maplink-page {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 22px auto 0;
    max-width: 320px;
    padding: 12px 16px;
    border: 1px solid var(--rose-soft);
    background: var(--rose-soft);
    color: var(--rose);
    border-radius: 14px;
    font-weight: 600;
    font-size: 14.5px;
    text-decoration: none;
  }
  /* 끌어내려 닫기: 손잡이 주변을 넓게 잡히도록 */
  .grip-zone { margin: -10px -20px 0; padding: 10px 20px 2px; touch-action: none; cursor: grab; }
  .grip-zone + h2, .grip-zone ~ h2 { touch-action: none; }
  /* 버전 바꾸기 버튼: 맨 아래 가운데 */
  .syncbar { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 30px; }
  .syncbar[hidden] { display: none; }
  .verbar { display: flex; justify-content: center; margin-top: 14px; }
  .verbar .verbtn { position: static; display: inline-grid; }
  .maplink-page.next { margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Our note</h1>
  </header>

  <main id="app">
    <div class="stage">
      <div class="ptitles" id="ptitles" aria-live="polite"></div>
      <div class="deck" id="deck"></div>
    </div>
    <div class="addbar">
      <button class="addbtn" id="addBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        등록하기
      </button>
      <button class="addbtn sub" id="pasteBtn" type="button" aria-label="붙여넣기로 등록">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2.5"/><path d="M9.5 4.5V3.8c0-.7.6-1.3 1.3-1.3h2.4c.7 0 1.3.6 1.3 1.3v.7M9.5 11h5M9.5 15h5"/></svg>
        붙여넣기
      </button>
    </div>
    <a class="maplink-page" id="courseLink" href="/course.html">🧭 데이트 코스 만들기 →</a>
    <a class="maplink-page next" id="mapLink" href="/map.html">🗺️ 우리가 갈 곳들 →</a>
    <div class="syncbar"><button type="button" class="syncbtn" data-sync-btn>💞 같이 쓰기</button><button type="button" class="syncbtn" data-backup-btn>🗂 백업</button></div>
    <div class="verbar"><a class="verbtn" id="verBtn" href="/" aria-label="버전 1로 돌아가기">Ver.1</a></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  try { sessionStorage.removeItem('ournote:v1'); } catch (e) { /* 없어도 됨 */ }

  // iOS 사파리는 user-scalable=no를 무시할 때가 있어 두 손가락 확대도 직접 막음
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });

  document.getElementById('verBtn').addEventListener('click', function (e) {
    if (e.metaKey || e.ctrlKey) return;
    e.preventDefault();
    var href = this.getAttribute('href');
    document.body.classList.add('switching');
    // 버전 전환은 기록을 남기지 않아 스와이프 뒤로가기로 돌아가지 않게
    try { sessionStorage.setItem('ournote:v1', '1'); } catch (err) { /* 없어도 됨 */ }
    setTimeout(function () { location.replace(href); }, 120);
  });
  window.addEventListener('pageshow', function () { document.body.classList.remove('switching'); });
  document.getElementById('mapLink').addEventListener('click', function (e) {
    if (e.metaKey || e.ctrlKey) return;
    e.preventDefault();
    var href = this.getAttribute('href');
    document.body.classList.add('switching');
    setTimeout(function () { location.href = href; }, 120);
  });
  document.getElementById('courseLink').addEventListener('click', function (e) {
    if (e.metaKey || e.ctrlKey) return;
    e.preventDefault();
    var href = this.getAttribute('href');
    document.body.classList.add('switching');
    setTimeout(function () { location.href = href; }, 120);

    var done = list.filter(function (x) { return x.done === true; })

        return (Number(a.checkedAt) || 0) - (Number(b.checkedAt) || 0) || (Number(a.createdAt) || 0) - (Number(b.createdAt) || 0);

  // 손잡이(회색 막대)나 제목을 잡고 아래로 끌어내리면 닫기
  function enableDragClose(ov, sheet) {
    var startY = 0, dy = 0, dragging = false, samples = [];
    sheet.addEventListener('pointerdown', function (e) {
      if (!e.target.closest('.grip, .grip-zone, h2')) return;
      dragging = true;
      startY = e.clientY;
      dy = 0;
      samples = [[Date.now(), 0]];
      sheet.style.transition = 'none';
      try { sheet.setPointerCapture(e.pointerId); } catch (err) { /* 없어도 됨 */ }
    });
    sheet.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      dy = Math.max(0, e.clientY - startY);
      samples.push([Date.now(), dy]);
      if (samples.length > 6) samples.shift();
      sheet.style.transform = dy ? 'translateY(' + dy + 'px)' : '';
      ov.style.opacity = String(Math.max(0.4, 1 - dy / 500));
    });
    function up() {
      if (!dragging) return;
      dragging = false;
      // 마지막 움직임의 속도로 휙 내린 것도 닫기
      var first = samples[0], now = Date.now();
      var speed = (dy - first[1]) / Math.max(1, now - first[0]);
      sheet.style.transition = '';
      ov.style.opacity = '';
      if (dy > 90 || (speed > 0.6 && dy > 24)) {
        sheet.style.transform = 'translateY(100%)';
        closeSheet();
      } else {
        sheet.style.transform = '';
      }
    }
    sheet.addEventListener('pointerup', up);
    sheet.addEventListener('pointercancel', up);
  }

  function openSheet(html, onMount) {

    ov.innerHTML = '<div class="bs" role="dialog" aria-modal="true"><div class="grip-zone"><div class="grip"></div></div>' + html + '</div>';
    ov.addEventListener('click', function (e) { if (e.target === ov) closeSheet(); });
    document.body.appendChild(ov);
    document.body.classList.add('locked');
    stack.push(ov);
    requestAnimationFrame(function () { ov.classList.add('show'); });
    enableDragClose(ov, ov.querySelector('.bs'));
    if (onMount) onMount(ov.querySelector('.bs'));

  // 띄어쓰기 뒤에 붙은 것만, 떼고 나서 두 글자 이상 남을 때만

  function copyText(text) {

  function legacyCopy(text) {

  // ---------- 붙여넣은 글 정리 ----------
  var KEYS = [
    { f: 'title', re: /^(제목|이름|무엇을|할 ?일|약속|title|name)$/i },
    { f: 'cat', re: /^(카테고리|분류|종류|category)$/i },
    { f: 'place', re: /^(주소|위치|장소|place|address)$/i },
    { f: 'link', re: /^(링크|url|link|사이트|인스타|인스타그램)$/i },
    { f: 'memo', re: /^(메모|설명|내용|영업 ?시간|정보|참고|memo|note)$/i },
    { f: 'when', re: /^(시기|목표 ?시기|언제|날짜|when)$/i }
  ];
  var CAT_WORDS = {
    food: ['맛집', '디저트', '카페', '커피', '음식', '식당', '레스토랑', '베이커리', '빵', '케이크', '휘낭시에', '마들렌', '초콜릿', '마카롱', '쿠키', '먹', '맛있', '브런치', '술집', '바 ', '오마카세', '파스타', '고기'],
    gift: ['선물', '만들어', '만들기', '케이스', '키링', '편지', '반지', '목걸이', '팔찌', '향수', '공방', '굿즈', '포토', '앨범', '사줘', '사주기'],
    surprise: ['서프라이즈', '깜짝', '꽃', '이벤트', '프로포즈', '기념일', '생일', '100일', '편지'],
    date: ['데이트', '여행', '드라이브', '캠핑', '피크닉', '전시', '공연', '영화', '산책', '바다', '호텔', '숙소', '펜션', '놀이공원', '축제', '야경', '등산', '해변', '글램핑', '팝업']
  };
  function catFromValue(v) {
    v = String(v || '').toLowerCase();
    if (/맛집|디저트|카페|음식|food/.test(v)) return 'food';
    if (/선물|만들|gift/.test(v)) return 'gift';
    if (/서프라이즈|이벤트|surprise/.test(v)) return 'surprise';
    if (/데이트|여행|date|trip/.test(v)) return 'date';
    return '';
  }
  function guessCat(it) {
    var text = (it.title + ' ' + it.memo).toLowerCase();
    var best = '', score = 0;
    Object.keys(CAT_WORDS).forEach(function (k) {
      var sc = 0;
      CAT_WORDS[k].forEach(function (w) { if (text.indexOf(w) >= 0) sc += (it.title.indexOf(w) >= 0 ? 2 : 1); });
      if (sc > score) { score = sc; best = k; }
    });
    return best || (it.place ? 'food' : 'date');
  }
  var ADDR_RE = /(서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충북|충남|전북|전남|경북|경남|제주|[가-힣]+(시|군|구))[^\n]*?[가-힣0-9]+(로|길|동|읍|면|리)\s*\d+(-\d+)?/;

  function parseBlock(text) {
    var it = { title: '', cat: '', place: '', link: '', memo: '', when: '' };
    var memo = [], loose = [], lastField = null;
    text.split('\n').forEach(function (raw) {
      var line = raw.replace(/\*\*|__/g, '').replace(/^\s*[-*•·]\s*/, '').trim();
      if (!line || /^\[?약속\s?노트\]?$/.test(line.replace(/\s/g, '')) || /^\[약속노트\]$/.test(line)) return;
      var m = line.match(/^([^:：]{1,12})\s*[:：]\s*(.*)$/);
      var key = m && KEYS.find(function (k) { return k.re.test(m[1].trim()); });
      if (key && !/^https?$/i.test(m[1].trim())) {
        var v = m[2].trim();
        lastField = key.f;
        if (!v) return;
        if (key.f === 'memo') memo.push(v);
        else if (key.f === 'cat') it.cat = catFromValue(v);
        else if (!it[key.f]) it[key.f] = v;
        else memo.push(v);
        return;
      }
      if (lastField === 'memo') { memo.push(line); return; }
      loose.push(line);
    });
    // 형식 없이 붙여넣은 줄들: 링크·주소·제목을 알아서 골라냄
    loose.forEach(function (line) {
      var urls = line.match(/https?:\/\/[^\s)>\]]+/g);
      if (urls) {
        urls.forEach(function (u) { if (!it.link) it.link = u; else memo.push(u); });
        line = line.replace(/https?:\/\/[^\s)>\]]+/g, '').trim();
        if (!line) return;
      }
      if (!it.place && ADDR_RE.test(line)) { it.place = line.replace(/^(📍|주소)\s*/, '').trim(); return; }
      if (!it.title) { it.title = line.replace(/^[#>\s]+/, '').slice(0, 80); return; }
      memo.push(line);
    });
    it.memo = memo.join(' · ');
    if (!it.cat) it.cat = guessCat(it);
    return it.title.replace(/\s/g, '').length >= 2 ? it : null;
  }

  function parsePaste(text) {
    text = String(text || '').replace(/\r\n?/g, '\n').replace(/```[a-z]*\n?/gi, '').trim();
    if (!text) return [];
    var blocks;
    if (/^\s*(-{3,}|—{2,}|={3,})\s*$/m.test(text)) blocks = text.split(/^\s*(?:-{3,}|—{2,}|={3,})\s*$/m);
    else if ((text.match(/^\s*\[약속\s?노트\]/gm) || []).length > 1) blocks = text.split(/^\s*(?=\[약속\s?노트\])/m);
    else if ((text.match(/^\s*(제목|이름)\s*[:：]/gm) || []).length > 1) blocks = text.split(/^\s*(?=(?:제목|이름)\s*[:：])/m);
    else blocks = [text];
    return blocks.map(function (b) { return b.trim(); }).filter(Boolean).map(parseBlock).filter(Boolean)
      .map(function (it) { it.title = cleanTitle(it.title); return it; });
  }

  function normTitle(t) { return cleanTitle(t).replace(/\s+/g, '').toLowerCase(); }

  // ---------- 붙여넣기 흐름 ----------
  function startPaste() {
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(function (text) {
        var items = parsePaste(text);
        if (items.length) openPreview(items);
        else openPasteBox(text);
      }, function () { openPasteBox(''); });
    } else {
      openPasteBox('');
    }
  }

  function openPasteBox(prefill) {
    var html = '<h2>붙여넣기로 등록</h2>' +
      '<p class="note">클로드가 정리해준 글을 아래에 붙여넣어 주세요. 여러 개도 한 번에 돼요.</p>' +
      '<div class="fld"><textarea id="p-text" class="big" placeholder="[약속노트]&#10;제목: …&#10;카테고리: …&#10;주소: …"></textarea></div>' +
      '<div class="acts"><button type="button" class="btn" data-act="close">닫기</button>' +
      '<button type="button" class="btn pri" data-act="go">정리하기</button></div>' +
      '<button type="button" class="linkbtn" data-act="guide">클로드 안내문 복사</button>';
    openSheet(html, function (bs) {
      var ta = bs.querySelector('#p-text');
      if (prefill) ta.value = prefill;
      bs.addEventListener('click', function (e) {
        var a = e.target.closest('[data-act]');
        if (!a) return;
        var act = a.getAttribute('data-act');
        if (act === 'close') closeSheet();
        else if (act === 'guide') copyGuide();
        else if (act === 'go') {
          var items = parsePaste(ta.value);
          if (!items.length) { toast('정리할 약속을 찾지 못했어요'); return; }
          closeSheet();
          setTimeout(function () { openPreview(items); }, 120);
        }
      });
    });
  }

  function openPreview(items) {
    var existing = {};
    loadRaw().forEach(function (x) { if (x && x.title) existing[normTitle(x.title)] = true; });
    var seen = {};
    items.forEach(function (it) {
      var k = normTitle(it.title);
      it.dup = !!existing[k] || !!seen[k];
      it.on = !it.dup;
      it.priv = !!PRIV_CATS[it.cat]; // 선물·서프라이즈는 기본 🔒
      it.privTouched = false;
      seen[k] = true;
    });
    function lockHtml(it) {
      return (it.priv ? '🔒' : '💞');
    }

    function cardHtml(it, i) {
      var meta = [];
      if (it.place) meta.push('📍 ' + it.place);
      if (it.link) meta.push('🔗 ' + it.link.replace(/^https?:\/\//i, ''));
      if (it.when) meta.push('⏳ ' + it.when);
      if (it.memo) meta.push('📝 ' + it.memo);
      return '<div class="pi' + (it.on ? ' on' : ' off') + '" data-i="' + i + '">' +
        '<button class="ck" type="button" data-act="toggle" aria-label="넣기/빼기">' + CHECK + '</button>' +
        '<button type="button" class="plock" data-act="lock" aria-pressed="' + it.priv + '" aria-label="나만 보기/같이 보기">' + lockHtml(it) + '</button>' +
        '<div class="tx"><div class="tt">' + esc(it.title) + (it.dup ? '<span class="dup">이미 있음</span>' : '') + '</div>' +
        '<div class="pcats">' + Object.keys(CAT).map(function (k) {
          return '<button type="button" class="pcat" data-cat="' + k + '" aria-pressed="' + (k === it.cat) + '">' + CAT[k].emoji + ' ' + esc(PAGES.find(function (p) { return p.id === k; }).name.replace(/^\S+\s/, '')) + '</button>';
        }).join('') + '</div>' +
        (meta.length ? '<div class="pm">' + esc(meta.join('  ')) + '</div>' : '') +
        '</div></div>';
    }
    function countOn() { return items.filter(function (it) { return it.on; }).length; }

    var html = '<h2>붙여넣은 약속 ' + items.length + '개</h2>' +
      '<p class="note">카테고리가 다르면 눌러서 바꾸고, 뺄 건 체크를 풀어주세요. 오른쪽 위 🔒는 나만 보기, 💞는 같이 보기예요.</p>' +
      '<div class="pv">' + items.map(cardHtml).join('') + '</div>' +
      '<div class="acts"><button type="button" class="btn" data-act="close">닫기</button>' +
      '<button type="button" class="btn pri" data-act="save"></button></div>' +
      '<button type="button" class="linkbtn" data-act="guide">클로드 안내문 복사</button>';

    openSheet(html, function (bs) {
      var saveBtn = bs.querySelector('[data-act="save"]');
      function refreshSave() {
        var n = countOn();
        saveBtn.textContent = n ? n + '개 등록' : '등록할 약속 없음';
        saveBtn.disabled = !n;
        saveBtn.style.opacity = n ? '' : '.5';
      }
      refreshSave();
      function paintLock(card, it) {
        var b = card.querySelector('[data-act="lock"]');
        b.textContent = lockHtml(it);
        b.setAttribute('aria-pressed', String(it.priv));
      }
      bs.addEventListener('click', function (e) {
        var card = e.target.closest('.pi');
        var a = e.target.closest('[data-act]');
        var c = e.target.closest('[data-cat]');
        if (card && c) {
          var it = items[Number(card.getAttribute('data-i'))];
          it.cat = c.getAttribute('data-cat');
          card.querySelectorAll('[data-cat]').forEach(function (b) { b.setAttribute('aria-pressed', String(b === c)); });
          if (!it.privTouched) { it.priv = !!PRIV_CATS[it.cat]; paintLock(card, it); } // 직접 바꾸기 전에는 카테고리 기본값을 따라감
          return;
        }
        if (card && a && a.getAttribute('data-act') === 'lock') {
          var lk = items[Number(card.getAttribute('data-i'))];
          lk.priv = !lk.priv;
          lk.privTouched = true;
          paintLock(card, lk);
          return;
        }
        if (card && a && a.getAttribute('data-act') === 'toggle') {
          var t = items[Number(card.getAttribute('data-i'))];
          t.on = !t.on;
          card.classList.toggle('on', t.on);
          card.classList.toggle('off', !t.on);
          refreshSave();
          return;
        }
        if (!a) return;
        if (a.getAttribute('data-act') === 'close') closeSheet();
        else if (a.getAttribute('data-act') === 'guide') copyGuide();
        else if (a.getAttribute('data-act') === 'save') {
          var pick = items.filter(function (x) { return x.on; });
          if (!pick.length) return;
          var list = loadRaw();
          var base = Math.max(Date.now(), list.reduce(function (m, x) { return Math.max(m, Number(x && x.createdAt) || 0); }, 0) + 1);
          pick.forEach(function (x, i) {
            list.push({
              id: uid(), title: x.title, cat: x.cat, place: x.place, link: x.link, memo: x.memo, when: x.when,
              done: false, doneAt: '', review: '', createdAt: base + i, priv: x.priv
            });
          });
          saveRaw(list);
          renderAll(false);
          closeSheet();
          toast(pick.length + '개 등록했어요');
        }
      });
    });
  }

  document.getElementById('pasteBtn').addEventListener('click', startPaste);

  // ---------- 세부내용 ----------
  function openDetail(id) {
    var it = loadRaw().find(function (x) { return x && String(x.id) === id; });
    if (!it) return;
    var c = CAT[it.cat] || CAT.food;
    var rows = [];
    if (it.place) {
      rows.push('<div class="di"><span class="ic">📍</span><span class="v">' + esc(it.place) +
        '<a class="map" href="https://map.naver.com/p/search/' + encodeURIComponent(it.place) + '" target="_blank" rel="noopener">지도</a></span></div>');
    }
    if (it.link) {
      var link = String(it.link);
      rows.push('<div class="di"><span class="ic">🔗</span><span class="v">' + (/^https?:\/\//i.test(link)
        ? '<a href="' + esc(link) + '" target="_blank" rel="noopener">' + esc(link.replace(/^https?:\/\//i, '')) + '</a>'
        : esc(link)) + '</span></div>');
    }
    if (it.memo) rows.push('<div class="di"><span class="ic">📝</span><span class="v">' + esc(it.memo) + '</span></div>');
    if (it.when) rows.push('<div class="di"><span class="ic">⏳</span><span class="v">' + esc(it.when) + '</span></div>');
    if (it.done === true && it.review) rows.push('<div class="review">' + esc(it.review) + '</div>');

    var priv = isPriv(it);
    var html = '<div class="dtop"><span class="chip">' + c.emoji + ' ' + esc(c.label) + '</span>' +
      (priv ? '<span class="chip lockchip">🔒 나만 보기</span>' : '') +
      (it.done === true && it.doneAt ? '<span class="ddone">' + esc(String(it.doneAt).replace(/-/g, '.')) + ' 완료</span>' : '') + '</div>' +
      '<h2>' + esc(it.title) + '</h2>' +
      (rows.length ? '<div class="dl">' + rows.join('') + '</div>' : '<div class="dempty">적어둔 세부내용이 없어요.</div>') +
      '<div class="acts"><button type="button" class="btn del" data-act="del">삭제</button><span class="sp"></span>' +
      '<button type="button" class="btn" data-act="close">닫기</button>' +
      '<button type="button" class="btn pri" data-act="edit">수정</button></div>' +
      '<div class="confirm" data-confirm hidden><span>정말 지울까요?</span>' +
      '<button type="button" class="btn" data-act="del-no">아니요</button>' +
      '<button type="button" class="btn delx" data-act="del-yes">지우기</button></div>' +
      '<button type="button" class="linkbtn" data-act="priv">' + (priv ? '🔓 공개하기 · 같이 쓰기를 하면 상대에게도 보여요' : '🔒 나만 보기로 바꾸기') + '</button>';
    openSheet(html, function (bs) {
      bs.addEventListener('click', function (e) {
        var a = e.target.closest('[data-act]');
        if (!a) return;
        var act = a.getAttribute('data-act');
        var box = bs.querySelector('[data-confirm]');
        if (act === 'close') closeSheet();
        else if (act === 'edit') openEditor(it);
        else if (act === 'del') { box.hidden = false; box.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
        else if (act === 'del-no') box.hidden = true;
        else if (act === 'priv') {
          var list = loadRaw();
          var t = list.find(function (x) { return x && String(x.id) === id; });
          if (t) { t.priv = !priv; saveRaw(list); renderAll(false); }
          toast(priv ? '공개했어요' : '나만 보기로 바꿨어요');
          closeSheet();
          setTimeout(function () { openDetail(id); }, 280);
        }
        else if (act === 'del-yes') {
          saveRaw(loadRaw().filter(function (x) { return !(x && String(x.id) === id); }));
          renderAll(false);
          closeSheet();
        }
      });
    });
  }

  // ---------- 스와이프에 따라 제목이 스르르 바뀜 ----------
  var ticking = false, current = 0;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      ticking = false;
      var w = deck.clientWidth || 1;
      var pos = deck.scrollLeft / w;
      layoutPills(pos);
      var idx = Math.round(pos);
      current = idx;
    });
  }
  deck.addEventListener('scroll', onScroll, { passive: true });

  // 마지막으로 본 칸은 넘기기가 다 끝난 뒤에 한 번만 저장 (넘기는 도중 저장하면 버벅일 수 있음)
  var savedPage = null, saveTimer = null;
  deck.addEventListener('scroll', function () {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      if (current === savedPage) return;
      savedPage = current;
      try { localStorage.setItem(PAGE_KEY, String(current)); } catch (e) { /* 위치 기억은 없어도 됨 */ }
    }, 300);
  }, { passive: true });
  window.addEventListener('resize', function () { deck.scrollLeft = current * deck.clientWidth; measurePills(); onScroll(); });

  // 알약들을 한 줄로 이어 붙이고, 넘긴 만큼 줄 전체가 미끄러지게
  var pillW = [], PILL_GAP = 6;
  function measurePills() {
    pillW = [];
    ptitles.querySelectorAll('.pt').forEach(function (el) { pillW.push(el.offsetWidth); });
  }
  // 가운데에서 멀수록 옅고 작게: 바로 옆은 또렷한 편, 두 칸 옆은 희미하게
  function pillLook(d) {
    d = Math.abs(d);
    var scale = d >= 2 ? 0.7 : d >= 1 ? 0.86 - (d - 1) * 0.16 : 1 - d * 0.14;
    var op = d >= 2 ? Math.max(0, 0.32 - (d - 2) * 0.6) : d >= 1 ? 0.6 - (d - 1) * 0.28 : 1 - d * 0.4;
    return { scale: scale, op: op };
  }
  function layoutPills(pos) {
    if (pillW.length !== PAGES.length || !pillW[0]) measurePills();
    var looks = pillW.map(function (w, i) { return pillLook(i - pos); });
    // 줄어든 크기 기준으로 이어 붙여서 간격이 늘 일정하게
    var x = [], acc = 0;
    pillW.forEach(function (w, i) {
      if (i > 0) acc += pillW[i - 1] * looks[i - 1].scale / 2 + PILL_GAP + w * looks[i].scale / 2;
      x.push(acc);
    });
    var lo = Math.max(0, Math.min(PAGES.length - 1, Math.floor(pos)));
    var hi = Math.min(PAGES.length - 1, lo + 1);
    var center = x[lo] + (x[hi] - x[lo]) * Math.max(0, Math.min(1, pos - lo));
    ptitles.querySelectorAll('.pt').forEach(function (el, i) {
      el.style.transform = 'translateX(calc(-50% + ' + (x[i] - center).toFixed(1) + 'px)) scale(' + looks[i].scale.toFixed(3) + ')';
      el.style.opacity = looks[i].op.toFixed(3);
    });
  }

  function goTo(i) { deck.scrollTo({ left: i * deck.clientWidth, behavior: 'smooth' }); }
  // 알약 줄을 손가락으로 밀어도 넘어감: 미는 동안 목록이 따라오고, 떼면 가까운 칸으로
  var pdrag = null, pdragMoved = false;
  ptitles.addEventListener('pointerdown', function (e) {
    if (e.button !== undefined && e.button !== 0) return;
    pdrag = { x: e.clientX, y: e.clientY, left: deck.scrollLeft, t: Date.now(), on: false, id: e.pointerId };
    pdragMoved = false;
  });
  ptitles.addEventListener('pointermove', function (e) {
    if (!pdrag) return;
    var dx = e.clientX - pdrag.x, dy = e.clientY - pdrag.y;
    if (!pdrag.on) {
      if (Math.abs(dx) < 8 || Math.abs(dx) < Math.abs(dy)) return;
      pdrag.on = true;
      pdragMoved = true;
      try { ptitles.setPointerCapture(pdrag.id); } catch (err) { /* 없어도 됨 */ }
      deck.style.scrollSnapType = 'none';
      deck.style.scrollBehavior = 'auto';
    }
    // 알약 한 칸(약 90px) 밀면 한 페이지
    var max = (PAGES.length - 1) * deck.clientWidth;
    deck.scrollLeft = Math.max(0, Math.min(max, pdrag.left - dx * deck.clientWidth / 90));
  });
  function pdragEnd(e) {
    if (!pdrag) return;
    var d = pdrag;
    pdrag = null;
    if (!d.on) return;
    var dx = (e && e.clientX !== undefined ? e.clientX : d.x) - d.x;
    var from = Math.round(d.left / deck.clientWidth);
    var pos = deck.scrollLeft / deck.clientWidth;
    var target = Math.round(pos);
    // 짧고 빠르게 휙 밀었으면 한 칸
    if (target === from && Math.abs(dx) > 24 && Date.now() - d.t < 350) target = from + (dx < 0 ? 1 : -1);
    target = Math.max(0, Math.min(PAGES.length - 1, target));
    deck.style.scrollSnapType = '';
    deck.style.scrollBehavior = '';
    goTo(target);
  }
  // 가로로 넘기기 시작했으면 그동안 화면이 위아래로 같이 움직이지 않게
  ptitles.addEventListener('touchmove', function (e) { if (pdrag && pdrag.on && e.cancelable) e.preventDefault(); }, { passive: false });
  ptitles.addEventListener('pointerup', pdragEnd);
  ptitles.addEventListener('pointercancel', pdragEnd);
  ptitles.addEventListener('click', function (e) {
    if (pdragMoved) { pdragMoved = false; return; } // 민 거면 누른 걸로 치지 않음
    var pt = e.target.closest('.pt');
    if (pt) goTo(Number(pt.getAttribute('data-i')));
  });
  ptitles.addEventListener('keydown', function (e) {
    var pt = e.target.closest('.pt');
    if (pt && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); goTo(Number(pt.getAttribute('data-i'))); }
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { measurePills(); onScroll(); });

  renderAll(true);
  try { current = Math.max(0, Math.min(PAGES.length - 1, Number(localStorage.getItem(PAGE_KEY)) || 0)); } catch (e) { current = 0; }
  savedPage = current;
  deck.scrollLeft = current * deck.clientWidth;
  onScroll();

  // Ver.1에서 고치고 돌아오면 다시 읽기
  window.addEventListener('pageshow', function (e) { if (e.persisted) renderAll(false); });
  window.addEventListener('storage', function (e) { if (e.key === STORAGE_KEY) renderAll(false); });
  window.addEventListener('ournote:remote', function () { renderAll(false); }); // 같이 쓰기: 상대가 바꾼 내용

  // 예전에 저장한 제목의 뒷말 정리: 바뀌는 목록을 한 번 보여주고 확인받음
  var CLEAN_KEY = 'ournote:titlecleaned';
  function offerTitleClean() {
    try { if (localStorage.getItem(CLEAN_KEY)) return; } catch (e) { return; }
    var list = loadRaw();
    var hits = list.filter(function (x) { return valid(x) && cleanTitle(x.title) !== x.title.trim(); });
    if (!hits.length) { try { localStorage.setItem(CLEAN_KEY, '1'); } catch (e) { /* 없어도 됨 */ } return; }
    var html = '<h2>제목 정리</h2>' +
      '<p class="note">이제 제목 끝의 ‘같이 가기·해주기’ 같은 말은 빼고 저장해요. 예전에 저장한 약속도 이렇게 바꿀까요?</p>' +
      '<div class="cleanlist">' + hits.map(function (x) {
        return '<div class="cl"><s>' + esc(x.title) + '</s><b>' + esc(cleanTitle(x.title)) + '</b></div>';
      }).join('') + '</div>' +
      '<div class="acts"><button type="button" class="btn" data-act="keep">그대로 두기</button>' +
      '<button type="button" class="btn pri" data-act="clean">' + hits.length + '개 정리하기</button></div>';
    openSheet(html, function (bs) {
      bs.addEventListener('click', function (e) {
        var a = e.target.closest('[data-act]');
        if (!a) return;
        if (a.getAttribute('data-act') === 'clean') {
          var cur = loadRaw();
          cur.forEach(function (x) { if (valid(x)) x.title = cleanTitle(x.title); });
          saveRaw(cur);
          renderAll(false);
          toast('제목을 정리했어요');
        }
        try { localStorage.setItem(CLEAN_KEY, '1'); } catch (err) { /* 없어도 됨 */ }
        closeSheet();
      });
    });
  }
  setTimeout(offerTitleClean, 400);

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('/sw.js').catch(function () {});
  }
})();
</script>
<script type="module" src="/sync.js"></script>
</body>
</html>
